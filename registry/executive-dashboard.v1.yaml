# TravelTrust Executive Dashboard · SSOT (at-a-glance program status)
# Human view: docs/runbook/TT-TRAVELTRUST-EXECUTIVE-DASHBOARD.md
# Gate semantics: docs/runbook/TT-EXECUTIVE-DASHBOARD-GATE-SEMANTICS.md
# Consistency audit: scripts/dev/audit-executive-dashboard-gate-consistency.cjs

schema: traveltrust.executive_dashboard.v1
version: 3
effective_utc: "2026-07-03"
updated_utc: "2026-07-03T15:45:00Z"

machine_keys:
  TT_EXECUTIVE_DASHBOARD: docs/runbook/TT-TRAVELTRUST-EXECUTIVE-DASHBOARD.md
  TT_PHASE2_STATUS: CLOSED
  TT_ACTIVE_MAINLINE: PI3
  TT_RELEASE_DECISION: NO_GO

naming:
  phase2_label: Phase2 Closed
  forbid_active_phase2: true
  active_program: PI3 Production Infrastructure
  forbid_subjective_release_percent: true
  forbid_interim_as_closed: true

gate_semantics:
  runbook: docs/runbook/TT-EXECUTIVE-DASHBOARD-GATE-SEMANTICS.md
  allowed_status:
    - CLOSED
    - INTERIM_GO
    - WAITING_OWNER
    - IN_PROGRESS
    - PENDING
    - OPTIONAL
  rollup_rules:
    closed: "status == CLOSED only — INTERIM_GO must NOT increment closed"
    interim: "status == INTERIM_GO"
    open: "status in [WAITING_OWNER, IN_PROGRESS, PENDING, OPEN]"
    optional_excluded_from_release_rollup: "status == OPTIONAL (P2 Mainnet)"
  release_decision:
    NO_GO_when: "any PI3 P0 gate is not CLOSED (interim/waiting/pending all block final GO)"

framing:
  phase2_closed_scope: >
    Phase2 Closed = Product · Operations Platform · Data Governance (RC/DDG/OCS/SOPCP/OCIP) ·
    Operations Workflow · Local↔Staging Alignment. NOT whole-project complete.
  pi3_status: >
    PI3 engineering prep on interim *.fly.dev is largely done; Owner Live Resources not fully in place.
    INTERIM_GO is not final GO.
  release_decision_note: >
    NO_GO until PI3 P0 gates reach CLOSED — not product/ops/governance failure.
  mainnet_policy:
    blocks_sepolia_production_go: false
    priority: P2_optional
    milestone: independent_after_sepolia_production_go
    default_scope: Sepolia Production

release_readiness:
  metric: gate_three_state_rollup
  overall: IN_PROGRESS
  release_decision: NO_GO
  phase2:
    product: COMPLETE
    operations: COMPLETE
    governance: COMPLETE
    alignment: COMPLETE
    enterprise_alignment_ref: enterprise_alignment.overall_enterprise_alignment.status
  production:
    infrastructure: INTERIM_GO
    validation: INTERIM_GO
    security: IN_PROGRESS
    observability: IN_PROGRESS
    performance: IN_PROGRESS
    go_live: PENDING
  rollup:
    closed: 1
    interim: 2
    open: 3
    note: Auto-derived from pi3_release_gates — run audit script to verify
  pi3_release_gates:
    - id: PI3-001
      label: Production Database / Backup / Restore drill
      status: CLOSED
      pi3_item_status: GO
      owner_live: CLOSED
    - id: PI3-002
      label: Production Domain / TLS / CDN / CORS
      status: INTERIM_GO
      pi3_item_status: INTERIM_GO
      owner_live: INTERIM_CLOSED
      blocks_final_go: true
      note: interim *.fly.dev closed — brand domain owner live pending
    - id: PI3-003
      label: Optional Fiat Onboarding (Stripe · P1)
      status: WAITING_OWNER
      pi3_item_status: WAITING_OWNER_STRIPE
      owner_live: OPEN
      blocks_final_go: false
      classification: P1_FUTURE_FIAT_ONRAMP
      note: NOT core Production Payment — onboarding optional bypass
    - id: G3-02-WEB3-PAYMENT
      label: Web3 USDC Escrow Payment Production Verification
      status: NOT_STARTED
      machine_key: TT_WEB3_PAYMENT_PRODUCTION_READINESS
      blocks_final_go: true
      classification: P0_CORE_PAYMENT
    - id: PI3-004
      label: Production Validation / Browser UAT
      status: INTERIM_GO
      pi3_item_status: INTERIM_GO
      owner_live: INTERIM_CLOSED
      blocks_final_go: true
      note: six-domain interim UAT on *.fly.dev — final PASS after P0 owner live
    - id: PI3-006
      label: Go-Live Checklist + cutover smoke
      status: PENDING
      pi3_item_status: deferred
      blocks_final_go: true
  production_readiness_gates:
    - id: production_security_audit
      label: Production Security Audit
      status: IN_PROGRESS
      priority: P1
    - id: observability_production
      label: Observability / monitoring (production)
      status: IN_PROGRESS
      priority: P1
    - id: performance_baseline_production
      label: Performance baseline (production)
      status: IN_PROGRESS
      priority: P1
      note: Staging 72h soak CLOSED — production re-run pending final config
  p2_optional_gates:
    - id: PI3-005
      label: Mainnet scope decision
      status: OPTIONAL
      blocks_sepolia_production_go: false

enterprise_alignment:
  registry: registry/enterprise-ssot-alignment.v1.yaml
  runbook: docs/runbook/TT-ENTERPRISE-SSOT-ALIGNMENT.md
  audit_script: scripts/dev/audit-enterprise-ssot-alignment.cjs
  latest_stamp: "20260703T154232Z"
  evidence: evidence/GO_enterprise_ssot_alignment/20260703T154232Z/
  naming_rule: >
    CONFIGURATION_ALIGNMENT PASS does not imply Local Runtime was validated.
    See alignment_dimensions in enterprise-ssot-alignment registry.
  tree:
    - id: configuration_alignment
      label: Configuration Alignment
      status: PASS
      validates: Registry · Runbook · config · governance SSOT
      does_not_validate: Local API running
    - id: local_runtime_validation
      label: Local Runtime Validation
      status: SKIPPED
      valid_states: [PASS, SKIPPED, FAIL, NOT_RUN]
      note: Local API not running at last audit — SKIPPED is valid; does not block Overall PASS
      on_demand: LOCAL_API=http://127.0.0.1:8080 node scripts/dev/audit-enterprise-ssot-alignment.cjs
    - id: staging_runtime_validation
      label: Staging Runtime Validation
      status: PASS
      validates: Staging /health/ready · media capabilities · no loca.lt in payloads
    - id: overall_enterprise_alignment
      label: Overall Enterprise Alignment
      status: PASS
      requires: [configuration_alignment PASS, staging_runtime_validation PASS]
      local_runtime_optional: true

remaining_work:
  - priority: P0
    gate: G3-02-WEB3-PAYMENT
    work: Web3 USDC Escrow payment prod verification (PAY-W01..W16)
