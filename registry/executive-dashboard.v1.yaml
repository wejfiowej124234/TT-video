roadmap:
  closed_track:
    label: Phase2 Closed
    items:
      - { id: product, status: COMPLETE }
      - { id: operations, status: COMPLETE }
      - { id: governance, status: COMPLETE }
      - { id: alignment, status: COMPLETE, detail: enterprise_alignment.overall_enterprise_alignment }
  active_track:
    label: PI3 · Production Engineering
    flow:
      - Production Infrastructure
      - Security
      - Observability
      - Performance
      - Production Validation
      - Production GO
    note: Product development complete — reliability, ops, security, release (not feature expansion)

