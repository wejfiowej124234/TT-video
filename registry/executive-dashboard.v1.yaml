  runbook: docs/runbook/TT-OPEN-ISSUES-REGISTRY.md
  rollup:
    open_count: 1
    blocking_open_count: 0
  summary:
    - id: CI-BUILD-20260703-V49-OOM
      category: Build Infrastructure
      severity: LOW
      blocking: false
      target_gate: CI_BUILD_STABILITY
      status: OPEN

rows:
