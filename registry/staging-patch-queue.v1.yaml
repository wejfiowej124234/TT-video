  historical_fg15_a_sha_short: "09c72b93"
  note: "Baseline Migration v2 — do not use historical_fg15_a_sha as ACTIVE"
  serves:
    - FG-15
    - PSG_Completion
    - Production_Certification
  mutate: FORBIDDEN_FOR_STAGING_OPS_PATCH

# Track B — TEMPORARY queue (must promote; not a permanent fork)
queue_policy:
  id_prefix: PATCH-STG-
  temporary_only: true
  must_promote_via: registry/patch-promotion-gate.v1.yaml
  allowed_change_classes:
    - cms_display_data
    - ops_script
    - staging_web_api_stability
    - docs_living
    - deploy_gate
  forbidden_in_patch_queue:
    - financial_protocol
    - contract_bytecode
    - on_chain_permissions
    - web3_runtime_reauth_required
    - production_go_claim
    - replace_certification_freeze

# Classification → track (write-once policy)
change_classification:
  financial_rules_contracts_permissions:
    track: A_RELEASE
    action: reenter_release_ladder
  web3_runtime:
    track: A_RELEASE
    action: recertify
  user_facing_product_feature:
    track: A_RELEASE
    action: release_candidate
  cms_display_data:
    track: B_STAGING_PATCH
    action: patch_ledger_then_promote
  docs_living:
    track: B_STAGING_PATCH
    action: living_docs_only_no_archive_mutate
  ops_scripts_gates:
    track: B_STAGING_PATCH
    action: patch_ledger_then_promote

