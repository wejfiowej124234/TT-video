# Track A — Web3 Candidate v2 / FG-15-B (sole SSOT). FG-15-A SHA retained as archive only.
certification_freeze:
  release_version: "PSG-REL-20260720-WEB3-CAND-V2"
  deploy_baseline: v311_fund_safety_candidate_v2
  release_sha: "97289a7185610ef0ad8822f0af04bfa533e42986"
