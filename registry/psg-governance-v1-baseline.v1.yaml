layer: post_psg_change_control

# Human-normative discipline (Runbook only — no new Gate):
# After BASELINE_ESTABLISHED, do not add first-class governance capabilities in v1.
# Start Governance v2 design only when a new architecture-level governance problem
# cannot be covered by existing Capability, RCP, or Incremental Audit.
# Ordinary bugs, features, module governance, and targeted fixes reuse v1.
governance_discipline_v1: >
  PSG Governance v1 进入 BASELINE_ESTABLISHED 后，不允许在 v1 中新增一级治理能力；
  新增能力必须满足「新的架构级治理问题无法通过现有 Capability、RCP 或 Incremental Audit 覆盖」
  这一条件，方可启动 PSG Governance v2 设计。普通 Bug、功能开发、模块治理和专项修复，
  应优先复用 v1 能力，而不是扩展治理框架。

meaning:
  - all_future_runtime_changes_use_rcp_path
  - no_new_first_class_governance_capabilities_in_v1
  - evolve_to_v2_only_for_architecture_level_problems
  - psg_must_not_inflate_indefinitely
  - ordinary_work_reuses_v1_not_expands_framework

not_meaning:
  - COMPLETE
  - sixteen_dimensions_complete
  - P2_or_P3_implemented
  - Production_Cert_refresh
  - TT_PRODUCTION_GO_flip

baseline_artifacts:
  dependency_registry: registry/runtime-dependency-registry.v1.yaml
  derived_json: registry/runtime-dependency-registry.derived.v1.json
  generator: scripts/dev/generate-rcp-registry-derived.py
  gate: scripts/gates/check-psg-runtime-change-propagation.cjs
  gate_binder: registry/psg-runtime-change-propagation.v1.yaml
  evolution_roadmap: registry/psg-post-baseline-governance-evolution.v1.yaml
