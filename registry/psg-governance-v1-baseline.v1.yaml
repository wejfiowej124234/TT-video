  - TT_PRODUCTION_GO
  - already-PASS Production Cert packs
  - Wallet L5 / MEDIA_ALIGNMENT ENGINEERING_CLOSED packs
  - OA-01 / OA-02

v2_unlock_only_when:
  - architecture_level_problem_cannot_be_covered_by_existing_capability_or_rcp_or_incremental_audit
  - architecture_level_problem_not_solvable_by_registry_domain_extension
  - owner_explicit_governance_v2_charter

forbid_in_v1:
  - new_first_class_governance_capability
  - parallel_gate_language_per_module
  - wave_c_d_rule_pile_expansion
  - governance_framework_growth_for_ordinary_bugs_or_features
