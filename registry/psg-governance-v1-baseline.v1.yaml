  gate_runbook: docs/runbook/TT-PSG-RUNTIME-CHANGE-PROPAGATION-GATE-LATEST.md
  gap_runbook: docs/runbook/TT-PSG-RUNTIME-CHANGE-PROPAGATION-ENTERPRISE-DEEPENING-GAP-LATEST.md

active_ops_path: |
  Feature → Local Validation → Incremental Audit → RCP Gate
  → Staging Deploy → Verification
  (not: Feature → continue designing PSG)

mainline_return:
  status: RETURN_TO_MAINLINE
  governance_design_track: EXITED
  note: >
    Stop expanding Governance design. Product work resumes on TravelTrust
    Mainline (feature / bugfix / CMS / Market / Wallet / Web3 / Payment /
    Production Release). All new features default into existing v1 flow;
    no new first-class governance capability required.

immutable_surfaces_must_not_touch:
  - evidence/GO_psg_foundation/release_archive/v1.1.0-psg-go.20260717/
