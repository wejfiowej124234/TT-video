oa_pay_03_architecture:
  status: CLOSED_ON_PAPER
  target_flow: "Escrow (Order Escrow rail · principal lock)\n  → SettlementRouter\
    \ (completion / refund / dispute resolution entry)\n  → FeeRouter (constitution\
    \ routing · not LEGACY multi-bucket as SSOT)\n  → Distributable SM (PENDING→LOCKED→SettlementReady→DISTRIBUTABLE→DISTRIBUTED)\n\
    \  → Distribution legs:\n       Guide (principal net of fee)\n       Steward (45%\
    \ of Distributable if ACTIVE)\n       Project Revenue Pool (55% or 100%)\n   \
    \    Founder Bootstrap / P4Cap (orthogonal rails · not order principal)\n"
  components:
    Escrow:
      role: lock_principal_and_emit_lifecycle_events
      must_not: silently_prove_45_55_by_direct_wallet_pay_alone
    SettlementRouter:
      role: sole_post_completion_settlement_entry_TARGET
      inputs: release_or_resolution_outcomes
      outputs: fee_leg_to_FeeRouter_plus_guide_payout
      status: TARGET_MODULE_NAME_LOCKED · impl_deferred_to_Money_Path_RC
    FeeRouter:
      role: route_Distributable_per_V311_not_LEGACY_4500_3575_1100_825_as_ssot
      constitution_split: V311DistributableSplit
    Distributable:
      role: only_after_refunds_disputes_chargebacks
    Distribution:
      legs:
      - Guide
      - Steward
      - PRP
      - Founder_or_P4Cap_orthogonal
  four_rails_remain:
  - Order_Escrow
  - GovernanceTreasuryP4Cap
  - Project_Revenue_Pool
  - Founder_Bootstrap_Wallet
oa_pay_04_05_distributable_sm:
  status: CLOSED_ON_PAPER
  vocabulary_ssot:
  - SERVICE_FEE_PENDING
  - SERVICE_FEE_LOCKED
  - SERVICE_FEE_SETTLEMENT_READY
  - SERVICE_FEE_DISTRIBUTABLE
  - SERVICE_FEE_DISTRIBUTED
  settlement_ready:
    purpose: 'Independent readiness before DISTRIBUTABLE so auditors never see LOCKED→DISTRIBUTED
      in one opaque jump without intermediate evidence.

      '
    maps_constitution: between_LOCKED_and_DISTRIBUTABLE
    onchain_options:
    - emit_explicit_ServiceFeeStateChanged_to_SETTLEMENT_READY_TARGET
    - OR_offchain_SettlementReady_attestation_PLUS_indexer_row_REQUIRED_before_DISTRIBUTABLE
    preferred_for_M_RC: explicit_onchain_or_indexed_SettlementReady_event
  transitions:
  - from: PENDING
    to: LOCKED
    trigger: Escrow.deposit_success
    event: Deposited_plus_ServiceFeeStateChanged
    db: service_fee_state=LOCKED
    reversible: false
  - from: LOCKED
    to: SETTLEMENT_READY
    trigger: dual_confirm_or_timeout_gate_OR_resolution_amounts_final
    event: SettlementReady_or_ServiceFeeStateChanged
    db: service_fee_state=SETTLEMENT_READY
    reversible: false_except_dispute_freeze_blocks_advance
  - from: SETTLEMENT_READY
    to: DISTRIBUTABLE
    trigger: SettlementRouter_accepts_fee_leg_net_of_refunds
    event: ServiceFeeStateChanged_to_DISTRIBUTABLE
    db: service_fee_state=DISTRIBUTABLE
    reversible: false
  - from: DISTRIBUTABLE
    to: DISTRIBUTED
    trigger: FeeRouter_or_split_execution_45_55_or_100_PRP
    event: FeeRouted_or_SplitApplied_plus_ServiceFeeStateChanged
    db: service_fee_state=DISTRIBUTED
    reversible: false
  illegal_edges:
  - PENDING→DISTRIBUTABLE
  - PENDING→DISTRIBUTED
  - LOCKED→DISTRIBUTED
  - LOCKED→DISTRIBUTABLE_without_SETTLEMENT_READY
  - SETTLEMENT_READY→DISTRIBUTED_skip_DISTRIBUTABLE
  - DISTRIBUTED→any_prior
  same_tx_LOCKED_to_DISTRIBUTED:
    classification: LEGACY_ANTI_PATTERN
    risk: missing_intermediate_audit_surface
    target: at_least_SettlementReady_and_DISTRIBUTABLE_must_be_observable
