# ── Canonical phrasing (use consistently in all docs, reports, and chat) ──

canonical_phrasing:
  domain_governance: >
    Market / Community / Campaign 都有数据治理，但不各自维护一套治理实现；
    它们统一使用 PCP 提供的 Governance 能力。
  english: >
    Market, Community, and Campaign all require data governance, but do not each
    maintain a separate governance implementation; they uniformly consume Governance
    capabilities provided by PCP.

standard_pipeline: |
  Database
    ↓
  PCP Governance
    ↓
  Public Engine Builder
    ↓
  Public API
    ↓
  Frontend

pcp_governance_composition: >
  PCP Governance = DDG + OCS + SOPCP + OCIP + Lifecycle + Surface + Priority
  + Schedule + Tier + Audit (+ Public Operations · Approval Workflow)

public_engine_composition: >
  Public Engine = one unified framework + multiple Builder plugins.
  Builders: FeedBuilder · MarketBuilder · CampaignBuilder · SearchBuilder · RecommendationBuilder

long_term_operations_outcome: >
  One governance rule set · one admin console · one audit trail · one publish/unpublish/
  rank/schedule mechanism — reused across all business domains. Enterprise long-term optimum.

architecture_principle: >
  Own the capability, not duplicate the implementation.
  Use canonical_phrasing.domain_governance in all PCP-related communication.

unified_public_pipeline: |
  Database → PCP Governance → Public Engine Builder → Public API → Frontend

verdict: >
  PCP is the optimal long-term enterprise architecture for all TravelTrust public display.
  Phase ② Market work becomes shared PCP Governance and reference MarketBuilder — not discarded.

one_liner: >
  Database → PCP Governance → Public Engine Builder → Public API → Frontend.
  One rule set · one ops console · one audit · one publish/rank/schedule — multi-domain reuse.

# ── Three frozen enterprise principles ───────────────────────────────────

frozen_principles:
  - id: DATABASE_NOT_PUBLIC_SURFACE
    rule: PostgreSQL rows are storage, not display. A row with visibility=public does not imply Feed visibility.
  - id: MODERATION_NOT_PUBLIC_OPERATIONS
    rule: >
      Moderation answers legal/safety (Allow?). Public Operations answers editorial/merchandising
      (Recommend? Surface? Schedule? Rank?). Never conflate visibility_status with display governance.
  - id: GOVERNED_VIEWS_ONLY
    rule: >
      All Public APIs must read Governed Public Views (SQL view, Rust module, or Engine query layer).
      Direct business-table SELECT in consumer routes is forbidden for new work and phased out for legacy.

# ── Platform stack ───────────────────────────────────────────────────────

stack:
  storage:
    layer: PostgreSQL
    entities:
      - users
      - community_posts
      - guides
      - market_listings
      - official_guides
      - cold_start_campaigns
      - orders
    note: Business data · multiple lifecycles may coexist in DB

  governance:
    layer: Public Content Governance
    alias: [Governance Core, TravelTrust Governance Core]
    nature: platform_capabilities
    capabilities:
      - id: DDG
        type: platform_capability
        registry: registry/display-data-governance.v1.yaml
        consumed_by: [market, community, campaign, guide, provider, acquisition]
        rule: >
          Domains do not maintain private DDG implementations.
          Market no longer maintains its own DDG — it uses PCP-provided DDG capability.
      - id: OCS
        type: platform_capability
        role: official_tier_bootstrap
      - id: SOPCP
        type: platform_capability
        role: surface_catalog_policy
      - id: OCIP
        type: platform_capability
        role: canonical_identity_policy
      - id: lifecycle
      - id: surface
      - id: priority
      - id: schedule
      - id: content_tier
      - id: public_operations
      - id: audit
      - id: approval_workflow
    fields:
      - lifecycle
      - publish_workflow
      - display_status
      - display_surfaces
      - display_priority
      - featured
      - schedule
      - content_tier
      - data_origin
      - region
      - language
      - feature_flag
      - audit_log
      - approval_workflow
    gates:
      moderation_gate:
        domain: legal_safety
        outputs: [visibility_status, penalties, appeals]
        admin: Moderation Center
        registry_refs:
          - registry/admin-rbac-route-matrix.v1.yaml
        does_not_set: [display_status, display_surfaces, display_priority]
      operations_gate:
        domain: editorial_merchandising
        outputs: [lifecycle, display_status, surfaces, priority, schedule, featured]
        admin: Public Content Center
        registry_refs:
          - registry/public-operations-mvp.v1.yaml
          - registry/traveltrust-operations-workflow.v1.yaml
        does_not_set: [visibility_status]

  engine:
    layer: Public Content Engine
    alias: [PCE, Public Engine]
    pattern: one_engine_many_builders
    rule: >
      Engine is the unified framework (ranking, cache, governed view access, plugin registry).
      Builders are business plugins. New modules (Video, Live, AI) add Builders — Governance unchanged.
    framework_responsibilities: [governed_view_access, ranking_hooks, cache, builder_registry]
    builders:
      - id: feed_builder
        plugin: true
        domain: community
        output: community_feed_api
        consumer_routes: [/api/v1/community/feed]
        frontend: [/community]
        status: wiring_in_progress
        pipeline: Database → PCP Governance → FeedBuilder → Public API
      - id: market_builder
        plugin: true
        domain: market
        output: market_public_apis
        includes: [guides, discover_orders, provider_listings, acquisition_listings]
        consumer_routes: [/api/v1/discover/orders, /api/v1/guides, /market/provider/listings, /market/acquisition/listings]
        frontend: [/market, /market/provider, /market/acquisition]
        status: reference_implementation
        pipeline: Database → PCP Governance → MarketBuilder → Public API
        note: Market Runtime (filters, subsite) is MarketBuilder frontend/runtime — not separate governance
      - id: campaign_builder
        plugin: true
        domain: campaign
        consumer_routes: [/api/v1/official/cold-start/surfaces/:surface]
        status: partial
        pipeline: Database → PCP Governance → CampaignBuilder → Public API
      - id: search_builder
        plugin: true
        status: deferred_post_go
      - id: recommendation_builder
        plugin: true
        status: deferred_post_go
    future_builders:
      - video_builder
      - live_builder
      - ai_builder
      note: Add Builder plugins only — do not fork Governance per module

  public_apis:
    layer: Public APIs
    rule: sole_public_exit
    examples:
      - /api/v1/community/feed
      - /api/v1/guides
      - /market/provider/listings
      - /market/acquisition/listings
      - /api/v1/official/cold-start/surfaces/:surface

  frontend:
    layer: Frontend
    rule: consumes_public_apis_only

# ── Moderation → Governance → Engine pipeline (frozen) ───────────────────

pipeline:
  - step: create_or_update
    actor: [user, admin, orchestrator]
  - step: moderation_gate
    question: Is content legally allowed and safe?
    output: visibility_status
    values: [public, restricted, removed, ...]
  - step: operations_gate
    question: Should ops publish, surface, schedule, and rank this content?
    output: [lifecycle, display_status, display_surfaces, priority, schedule]
    precondition: moderation_allows_visible
  - step: public_engine
    action: builder_plugin_builds_surface_payload
    pattern: Governance → Builder → API
  - step: public_api
    action: return_governed_payload_only
  - step: frontend

pipeline_diagram: |
  Database → PCP Governance → Public Engine Builder → Public API → Frontend
  Moderation → VISIBLE → Operations → Published → Surface → Builder → API

