# ── Architecture Constitution (FROZEN · Architecture Freeze) ───────────────

architecture_constitution:
  P1:
    id: DATABASE_NEVER_PUBLIC
    rule: Database is never Public. Storage ≠ display.
  P2:
    id: GOVERNED_VIEWS_ONLY
    rule: All Public APIs consume Governed Views only. Bypassing Governance violates P2.
  P3:
    id: MODERATION_GOVERNANCE_INDEPENDENT
    rule: Moderation (legal/safety) and Governance (editorial/ops) are independent gates.
  P4:
    id: GOVERNANCE_OWNS_CAPABILITY
    rule: Governance owns capability; business modules consume capability — no private forks.
  P5:
    id: BUILDER_REQUIRED
    rule: Every public surface must be built by a Builder plugin on Public Engine.

