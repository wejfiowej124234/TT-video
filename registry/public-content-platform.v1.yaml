# ── Layer responsibility boundaries (ENFORCED) ───────────────────────────

layer_responsibilities:
  database:
    layer: PostgreSQL
    owns: [business_entities, multiple_lifecycles, raw_storage]
    does_not: [public_display_decisions, feed_ranking, surface_assignment]
  pcp_governance:
    layer: PCP Governance
    owns:
      - display_lifecycle_and_publish_workflow
      - surface_assignment_and_schedule
      - priority_and_featured_ops
      - content_tier_and_data_origin_policy
      - ddg_leakage_audit_capability
      - ocs_official_tier_bootstrap
      - sopcp_surface_catalog_policy
      - ocip_canonical_identity
      - audit_log_and_approval_workflow
      - public_operations_editorial_gate
    does_not:
      - feed_ranking_algorithm_implementation
      - http_route_handlers
      - frontend_rendering
      - moderation_legal_verdicts
    subsumed_modules: [DDG, OCS, SOPCP, OCIP, Public_Operations, Lifecycle, Surface, Priority, Schedule, Tier, Audit]
  public_engine:
    layer: Public Engine
    owns:
      - governed_view_access
      - builder_plugin_registry
      - ranking_hooks_and_cache
      - cross_builder_shared_framework
    does_not:
      - publish_unpublish_policy_decisions
      - moderation_takedown
      - direct_unfiltered_business_table_reads
    pattern: one_framework_many_builders
  builder:
    layer: Public Engine Builder
    owns:
      - domain_specific_query_composition
      - surface_payload_shape_for_domain
      - domain_ranking_mix_in_engine_framework
    does_not:
      - duplicate_governance_rules_per_domain
      - bypass_governed_views
    plugins: [FeedBuilder, MarketBuilder, CampaignBuilder, SearchBuilder, RecommendationBuilder]
  public_api:
    layer: Public API
    owns:
      - sole_public_http_exit
      - auth_rate_limit_pagination
      - stable_consumer_contracts
    does_not:
      - raw_sql_on_business_tables_for_display
      - governance_write_side_effects
    rule: reads_only_from_governed_views_or_builder_output
  frontend:
    layer: Frontend
    owns: [ui_rendering, client_state, routing]
    does_not: [public_catalog_truth, governance_mutations]
    rule: consumes_public_apis_only

