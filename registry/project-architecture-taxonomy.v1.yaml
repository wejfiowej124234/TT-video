hard_rules:
  - id: MAPS_OVER_TRUTH
    text: >
      Packs 00–14 organize existing truth. Living SSOTs remain FTB, 04, 14,
      Registry, Official /meta, CMS ops matrix. These maps must not become a
      competing source of addresses, ABI, or GO.
  - id: ONE_MATRIX_ONE_QUESTION
    text: Do not dump Product + Frontend + Backend + Data + Web3 + Governance into one mega-matrix.
  - id: UNIFIED_IDS
    text: Cross-pack join is by SYS / M / X / CAP / PAGE / API / DATA / W3 / GOV / SEC / REL IDs.
  - id: NO_AI_COVERAGE_PERCENT
    text: >
      Pack 14 single product/reality/GO percentages stay NOT_COMPUTED.
      Plane counts and histograms are machine-computed from pack 01–13
      status machines. Never invent a product 100% from map closure.
  - id: OFFICIAL_IS_LIVE_SURFACE
    text: >
      Inventory and gap claims use Official www + api.web3-ttg.com.
      Login problems do not authorize skipping Official as the live surface.
  - id: L7_NE_L8
    text: Chain occurrence (L7 / pack 05) is not Indexer /meta / FTB proof (L8 / pack 09).
  - id: TWO_WEB3_MATRICES
    text: Pack 05 = contract architecture. Pack 06 = commercial money lifecycle. Do not mix.
  - id: TWO_MONEY_RAILS
    text: USDC escrow (product) and TTG PrimaryMarket (governance) are different rails. Fiat/Stripe is orthogonal.
  - id: LOCATE_THEN_EDIT
    text: Symptom → pack → layer/domain → then edit. Login failure is GP-01 / INC-LOGIN, not DB reset.
  - id: THIS_WAVE_NO_GO
    text: This taxonomy wave MUST NOT mutate FTB addresses, /meta contract, Indexer, Timelock/Governor/PM live params, or TT_PRODUCTION_GO.
  - id: THREE_TRUTH_PLANES
    text: >
      Official www/API/Admin/DB is the primary evidence surface for current product
      reality, not the highest truth for every fact. Web3 facts are L7 chain +
      Timelock. FTB is the freeze/rules baseline. Indexer and /meta are L8.
      Do not overwrite L7 because an Official field lags.
  - id: MATRIX_FOLLOWS_REALITY
    text: >
      Matrices obey Reality. Do not homogenize Web3 lifecycle to look neat.
      OFFICIAL_LIVE, DEPLOYED, SCHEDULED_WAITING_ETA, DEPLOYED_NOT_WIRED,
      NOT_DEPLOYED, SUPERSEDED, REALITY_VERIFIED, CLOSED_REALITY stay distinct.
  - id: PHASE1_AS_IS_NO_GREENWASH
    text: >
      Phase 1 records 2026-08 Official AS-IS. Do not fix www /auth/login 405
      (or any other breakpoint) in Phase 1 just to turn a journey green.
  - id: PACK12_NAVIGABLE_DAG_REQUIRED
    text: >
      Pack 12 DEP-*/GATE-* traffic-light DAG is retained. It turns static
      matrices into a navigable engineering map. Do not delete or collapse it.
  - id: PHASE2_ONLY_PRODUCTION_REVIEW
    text: >
      Phase 2 is Production-Grade Review: AS-IS → Requirement → GAP → Severity →
      Architecture Decision → Fix → Test → Staging → Official → Reality Evidence.
      Phase 1 must not pretend that review has started.

