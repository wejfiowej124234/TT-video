# Production Readiness · Open Issues

schema: traveltrust.production_readiness_open_issues.v1
version: 17
effective_utc: "2026-07-08"
machine_key: TT_PRODUCTION_READINESS_OPEN_ISSUES

execution_policy:
  one_root_cause_at_a_time: true
  active_sprint: none
  sprint_label: Sprint A CLOSED · Sprint B READY (not active)
  sprint_queue: []
  rule: >-
    TT_SPRINT_B=READY · BFM-001 CLOSED · BD-003 CLOSED · BD-005 CLOSED · HAT-003 CLOSED · ACTIVE=false

sprint_signals:
  TT_SPRINT_A: CLOSED
  TT_SPRINT_B: READY
  TT_SPRINT_B_ACTIVE: false
  sprint_b_entry:
    requires_all: [evidence_ready, business_rule_confirmed, root_cause_confirmed, fix_authorized]
    rule: >-
      Evidence READY AND business_rule_confirmed AND root_cause_confirmed AND fix_authorized
      → TT_SPRINT_B ACTIVE · 否则保持 READY
    governance_semantics:
      failure_signature_confirmed: 已确认 API 失败位置与签名（422 fulfillment_guide）
      business_rule_confirmed: Owner 已裁定业务设计（方案 A · By Design）
      root_cause_confirmed: 最终根因确认且批准进入 Fix/Validation 关闭路径
      fix_authorized: Owner 显式授权工程或数据 Fix
  sprint_b_phase: BD-005 CLOSED · HAT PASS · Sprint B validation complete
  bd005_fix_validation: evidence/GO_production_readiness/sprints/BD-005-FIX-VALIDATION-LATEST.json
  provider_day2_probe: scripts/dev/run-provider-business-data-readiness-probes.cjs
  provider_day2_evidence: evidence/GO_production_readiness/step2/PROVIDER-BUSINESS-DATA-READINESS-DAY2-LATEST.json
  provider_hat_probe: scripts/dev/run-sprint-b-provider-hat-order-validation.cjs
  provider_hat_evidence: evidence/GO_production_readiness/step2/hat/SPRINT-B-PROVIDER-HAT-ORDER-LATEST.json
  bd002_redefine_confirmation: evidence/GO_production_readiness/sprints/BD-002-REDEFINE-CONFIRMATION-LATEST.json
  owner_fulfillment_guide_decision: evidence/GO_production_readiness/sprints/OWNER-FULFILLMENT-GUIDE-DECISION-LATEST.json
  bd005_fix_authorization: evidence/GO_production_readiness/sprints/BD-005-FIX-AUTHORIZATION-GRANTED-LATEST.json
  hat003_fix_validation: evidence/GO_production_readiness/sprints/HAT-003-FIX-VALIDATION-LATEST.json
  owner_tourist_persona_decision: evidence/GO_production_readiness/sprints/OWNER-TOURIST-PERSONA-DECISION-LATEST.json
  bd003_redefine_confirmation: evidence/GO_production_readiness/sprints/BD-003-REDEFINE-CONFIRMATION-LATEST.json
  owner_listings_cover_decision: evidence/GO_production_readiness/sprints/OWNER-LISTINGS-COVER-DECISION-LATEST.json
  bd003_data_lineage_audit: evidence/GO_production_readiness/step3/BD-003-DATA-LINEAGE-AUDIT-LATEST.json
  bfm001_discovery: evidence/GO_production_readiness/step4/BFM-001-ACQUISITION-CHAIN-DISCOVERY-LATEST.json
  bfm001_redefine_confirmation: evidence/GO_production_readiness/sprints/BFM-001-REDEFINE-CONFIRMATION-LATEST.json
  owner_bfm001_disposition_decision: evidence/GO_production_readiness/sprints/OWNER-BFM-001-DISPOSITION-DECISION-LATEST.json
  gate_review: evidence/GO_production_readiness/sprints/PRODUCTION-READINESS-GATE-REVIEW-LATEST.json
  exit_review: evidence/GO_production_readiness/sprints/SPRINT-A-EXIT-REVIEW-LATEST.json

sprint_b_workflow:
  - Discovery
  - Evidence
  - Root Cause
  - Sprint ACTIVE
  - Fix
  - Validation
  - Close
  not: [发现一个名字, 直接开始修]

sprints:
  - id: A
    label: Sprint A
    status: closed
    TT_SPRINT_A: CLOSED
    goal: Guide Business Data Ready
    result: Guide Business Data Ready YES
    exit_review: evidence/GO_production_readiness/sprints/SPRINT-A-EXIT-REVIEW-LATEST.json
    sprint_review: evidence/GO_production_readiness/sprints/SPRINT-A-REVIEW.md
    hat_evidence: evidence/GO_production_readiness/step1/hat/SPRINT-A-GUIDE-HAT-ORDER-LATEST.json
  - id: B
    label: Sprint B
    status: ready
    TT_SPRINT_B: READY
    TT_SPRINT_B_ACTIVE: false
    phase: Provider Order Lifecycle · BD-005 · Option A confirmed
    goal: Provider Order Lifecycle Ready
    candidate_root_cause: BD-005
    probe_script: scripts/dev/run-sprint-b-provider-hat-order-validation.cjs
    entry_requires: [evidence_ready, business_rule_confirmed, root_cause_confirmed, fix_authorized]

