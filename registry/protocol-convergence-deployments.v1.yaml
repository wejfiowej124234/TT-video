# 控制面 env（R-02 · 与 contracts/script/Phase2ControlPlane.sol 同源）
control_plane_env:
  timelock_admin: TIMELOCK_ADMIN_ADDRESS
  chain_owner: PHASE2_CHAIN_OWNER_ADDRESS
  chain_owner_fallback: TIMELOCK_ADDRESS
  escrow_factory_guardian: ESCROW_FACTORY_GUARDIAN_ADDRESS
  escrow_factory_guardian_fallback: TIMELOCK_ADDRESS

contracts:
  GovernanceVotesToken:
    source: contracts/src/GovernanceVotesToken.sol
    deploy_script: contracts/script/DeployGovernanceStack.s.sol
    env_address_key: GOVERNANCE_TOKEN_ADDRESS
  GovernanceTimelock:
    source: contracts/src/GovernanceTimelock.sol
    deploy_script: contracts/script/DeployGovernanceStack.s.sol
    env_address_key: TIMELOCK_ADDRESS
  TravelTrustGovernor:
    source: contracts/src/TravelTrustGovernor.sol
    deploy_script: contracts/script/DeployGovernanceStack.s.sol
    env_address_key: GOVERNOR_ADDRESS
  EscrowFactory:
    source: contracts/src/EscrowFactory.sol
    deploy_script: contracts/script/DeployFundStackUnderTimelock.s.sol
    env_address_key: ESCROW_FACTORY_ADDRESS
  FeeRouter:
    source: contracts/src/FeeRouter.sol
    deploy_script: contracts/script/DeployFundStackUnderTimelock.s.sol
    env_address_key: FEE_ROUTER_ADDRESS
  RegionStewardStakePool:
    source: contracts/src/RegionStewardStakePool.sol
    abi: contracts/abi/RegionStewardStakePool.json
    deploy_script: contracts/script/DeployRegionStewardStakePool.s.sol
    env_address_key: REGION_STEWARD_STAKE_POOL_ADDRESS
  CountryPoolRedemptionEpochV0:
    source: contracts/src/CountryPoolRedemptionEpochV0.sol
    abi: contracts/abi/CountryPoolRedemptionEpochV0.json
    deploy_script: contracts/script/DeployCountryPoolRedemptionEpochV0.s.sol
    env_address_key: COUNTRY_POOL_REDEMPTION_EPOCH_CN_ADDRESS
  CountryPoolLedgerV0:
    source: contracts/src/CountryPoolLedgerV0.sol
    deploy_script: contracts/script/DeployP51CountryLedger.s.sol
    env_address_key: COUNTRY_POOL_LEDGER_PILOT_ADDRESS

api_quote_routes:
  steward_stake_quote: GET /api/v1/steward/stake-quote
  steward_stake_status: GET /api/v1/steward/stake-status
  redemption_quote: GET /api/v1/redemption/quote
  country_ledger: GET /api/v1/governance/country-ledger/:jurisdiction
  protocol_reference: GET /api/v1/governance/protocol-reference

