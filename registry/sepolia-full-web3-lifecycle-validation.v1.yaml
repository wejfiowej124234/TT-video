  - id: DOM-GOV-OPS
    name: Governance Params · Timelock · Emergency · Recovery
    mainnet_wave: wave2
    lifecycle_steps:
      - parameter_change_proposal
      - timelock_delay_execute
      - emergency_pause
      - emergency_unpause
      - recovery_drill
    cert_refs: ["10", "11", "12"]
    evidence_required:
