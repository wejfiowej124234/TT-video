phase_discipline:
  allowed: [validation, bug_fixes, evidence, security, protocol_alignment, sepolia_on_chain_e2e]
  forbidden: [new_features, mainnet_broadcast, param_swap_to_mainnet]
  rationale: >
    Phase ② validates the entire Web3 protocol. Adding features continuously delays
    exit criteria and disrupts deployment rhythm.

# Module-by-module E2E order (run sequentially on Sepolia)
