      - scripts/dev/run-tt-governance-cert-11-emergency-unpause.sh
      - scripts/dev/run-tt-governance-cert-12-dr-replay.sh
    status: TARGET

  - id: DOM-UI-UX
    name: Web3 UI/UX ↔ On-chain State Consistency
    mainnet_wave: wave1
    lifecycle_steps:
