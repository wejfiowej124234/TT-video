audit_deliverables:
  business_logic_audit:
    script: scripts/dev/run-sepolia-full-web3-lifecycle-validation.cjs
    output_suffix: BUSINESS-LOGIC-AUDIT-LATEST.md
    scope: Real business units · not isolated function tests
  security_audit:
    script: scripts/dev/run-web3-protocol-grade-audit.cjs
    evidence: evidence/GO_production_readiness/web3-protocol-grade-audit/
    companion: scripts/dev/run-escrow-settlement-authorization-audit.cjs
  user_journey_audit:
    script: scripts/dev/run-sepolia-full-web3-lifecycle-validation.cjs
    output_suffix: USER-JOURNEY-AUDIT-LATEST.md
    personas_ref: personas

phase2_exit_criteria:
  mandatory:
    - RULE-PH2-001 satisfied for every mainnet_wave feature
    - all validation_domains status PASS or DEFER-with-owner-waiver
    - TTG_CERT_8_12_SIGNED on Sepolia
    - WEB3_PROTOCOL_GRADE_P0_0
    - ESCROW_SETTLEMENT_MODEL_ALIGNED
    - WEB3_SYSTEM_CLOSURE_PASS or documented P1 waiver
  verdict_pass: SEPOLIA_FULL_WEB3_LIFECYCLE_PASS
  verdict_in_progress: SEPOLIA_FULL_WEB3_LIFECYCLE_IN_PROGRESS
  verdict_blocked: SEPOLIA_FULL_WEB3_LIFECYCLE_BLOCKED

