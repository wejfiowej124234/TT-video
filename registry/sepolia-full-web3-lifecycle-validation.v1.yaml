# ── Mandatory exit rule (Owner-approved) ─────────────────────────────────────
exit_rule:
  id: RULE-PH2-001
  title: Mainnet feature must have Sepolia E2E evidence
  statement: >
    Any Web3 feature planned for deployment to Ethereum Mainnet MUST complete
    at least one Sepolia real on-chain end-to-end validation with traceable
    evidence. Without such evidence, that feature SHALL NOT enter Phase ③ Mainnet.
  enforcement:
    - scripts/gates/check-phase2-mainnet-feature-evidence-gate.sh
    - scripts/dev/run-sepolia-full-web3-lifecycle-validation.cjs
  phase3_gate: TRAVELTRUST_MAINNET_PHASE3_AUTHORIZED requires SEPOLIA_FULL_WEB3_LIFECYCLE_PASS

audit_tracks_required:
  - business_logic_audit
  - security_audit
  - user_journey_audit
  - four_layer_consistency_audit

four_layer_consistency:
  layers: [API, Database, Contract, Frontend]
  probe_scripts:
    - scripts/dev/check-web3-system-master-map-parity.cjs
    - scripts/dev/check-web3-system-production-meta-contracts.cjs
    - scripts/dev/run-escrow-settlement-authorization-audit.cjs

personas:
  - id: traveler
    name: Traveler
    web3_flows: [escrow_deposit, service_confirm, refund, dispute_open, rating]
  - id: guide
    name: Guide
    web3_flows: [escrow_accept_path, service_confirm, stake, release_beneficiary]
  - id: merchant
    name: Merchant
    web3_flows: [provider_stake, merchant_listing_settlement]
  - id: region_steward
    name: Region Steward
    web3_flows: [steward_stake, seat_apply, jurisdiction_scope, unstake_cert9]
  - id: ttg_holder
    name: TTG Holder
    web3_flows: [delegate, propose, vote, queue, execute]
  - id: admin
    name: Admin
    web3_flows: [timelock_ops, emergency_pause, rbac, treasury_ops, governance_params]

validation_domains:
  - id: DOM-TTG-GOV
    name: TTG Governance Full Lifecycle
    mainnet_wave: wave2
    description: Mint · delegate · propose · vote · queue · execute · treasury
    lifecycle_steps:
      - token_mint_or_distribute
      - delegate_votes
      - create_proposal
      - cast_vote
      - queue_proposal
      - timelock_execute
      - treasury_spend
    evidence_required:
      - evidence/GO_ttg_cert/
      - scripts/dev/run-tt-governance-cert-08-treasury-spend.sh
    cert_refs: ["8", "9", "10", "11", "12"]
    status: IN_PROGRESS

  - id: DOM-ESCROW-V2
    name: EscrowV2 Bilateral Settlement
    mainnet_wave: wave1
    description: confirmServiceComplete ×2 → release → FeeRouter → Ledger
    lifecycle_steps:
      - create_escrow_v2_instance
      - traveler_deposit
      - service_confirm_bilateral_offchain
      - service_confirm_bilateral_onchain
      - permissionless_release
      - fee_router_split
      - ledger_projection
    evidence_required:
      - evidence/GO_production_readiness/escrow-bilateral-layer-a/
      - evidence/GO_production_readiness/escrow-bilateral-layer-b/
      - evidence/GO_production_readiness/escrow-settlement-authorization/
      - scripts/dev/phase2-sepolia-broadcast-escrow-factory-v2.sh
    status: IN_PROGRESS

  - id: DOM-IDENTITY-STAKE
    name: Identity Staking
    mainnet_wave: wave2
    description: Guide · Provider · Region Steward stake / unstake / slash path
    lifecycle_steps:
      - guide_stake
      - provider_stake
      - region_steward_stake
      - unstake_request_release
    evidence_required:
      - scripts/dev/smoke-guide-identity-stake-anvil.sh
      - scripts/dev/run-tt-governance-cert-09-unstake.sh
    status: IN_PROGRESS

  - id: DOM-SEAT-JURISDICTION
    name: Seat / Jurisdiction / Region Steward Permissions
    mainnet_wave: wave2
    lifecycle_steps:
      - steward_application
      - seat_assignment
      - jurisdiction_scope_binding
      - permission_gate_enforcement
    evidence_required:
      - crates/api steward/seat routes
      - evidence/GO_ttg_cert/
    status: TARGET

  - id: DOM-FUND-FLOWS
    name: CountryPool · FeeRouter · Treasury · StewardPath
    mainnet_wave: wave1
    lifecycle_steps:
      - escrow_fee_to_fee_router
      - country_bucket_allocation
      - treasury_receive
      - steward_path_distribution
      - country_pool_ledger
    evidence_required:
