# RULE-DEPLOY-001: Sepolia addresses are lineage reference ONLY — never copy as mainnet deploy.

schema: traveltrust.mainnet_address_registry.v1
version: 1
planning_item: P3-03
effective_utc: "2026-07-09"
machine_key: TT_MAINNET_ADDRESS_REGISTRY
verdict: MAINNET_ADDRESS_PLANNING_READY
verdict_status: PASS

network:
  id: ethereum_mainnet
  chain_id: 1
  eip155: "eip155:1"
  deploy_status: NOT_STARTED
  broadcast_authorized: false

address_status_enum:
  - TBD
  - PLANNED
  - NOT_DEPLOYED
  - EXTERNAL_REFERENCE
  - FORBIDDEN

anti_patterns:
  - id: RULE-DEPLOY-001
    forbidden: copy_sepolia_addresses_to_mainnet
    ssot: registry/mainnet-deployment-package.v1.yaml
  - id: RULE-ADDR-001
    forbidden: placeholder_mainnet_addresses
    note: All TravelTrust-deployed mainnet slots remain TBD until broadcast evidence fills them.

sepolia_lineage_reference:
  purpose: planning_lineage_only
  baseline: gov_freeze_v2_clean_baseline
  registry: registry/protocol-convergence-deployments.v1.yaml
  p3_baseline: registry/phase3-production-entry-baseline.v1.yaml
  note: >
    Sepolia GovFreeze V2 + Vacancy V1 DE triplet validated under P3-02.
    Mainnet deploy generates fresh addresses — see deployment_sequence.

posture_ssot: registry/g24-p-upgrade-01-contract-posture.v1.yaml
escrow_policy: registry/escrow-bilateral-mainnet-policy.v1.yaml
env_catalog: registry/env-key-catalog-web3.v1.yaml

# ── Address classification ────────────────────────────────────────────────────

address_categories:
  governance_controlled:
    description: Timelock-administered governable shells and treasury actions
    upgrade: proxy_or_timelock_owner
  immutable_deployment:
    description: Fresh-deploy instances — no logic upgrade surface (G23-04 / Vacancy V1)
    upgrade: forbidden
  operational:
    description: Off-chain or EOA/multisig ops wallets — not user-facing contracts
    upgrade: n/a
  user_facing:
    description: Contracts end users / integrators interact with directly
    upgrade: varies
  external_reference:
    description: Third-party canonical tokens — not TravelTrust deploys
    upgrade: n/a
  forbidden_mainnet:
    description: Explicitly blocked on mainnet per policy
    upgrade: n/a

