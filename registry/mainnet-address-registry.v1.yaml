# ── Permission model ──────────────────────────────────────────────────────────

permission_model:
  hierarchy:
    - id: L0
      role: TIMELOCK_ADMIN_MULTISIG
      holder: TBD
      powers: [timelock.schedule, timelock.cancel, timelock.execute_as_admin]
    - id: L1
      role: GovernanceTimelock
      holder: TBD
      powers:
        - proxy.upgradeTo
        - treasury.spend_via_governance
        - fee_router.setRoutingConfig
        - fee_router.setDistributePaused
        - escrow_factory_v2.transferGuardianship
        - immutable_contract.owner_actions
    - id: L2
      role: TravelTrustGovernor
      holder: TBD
      powers: [propose, vote, queue, execute_via_timelock]
    - id: L3
      role: TTG_holders
      holder: token_delegates
      powers: [vote_on_proposals]

  emergency_roles:
    fee_router_pause:
      actor: FeeRouter.owner
      planned_holder: GovernanceTimelock
      scope: distributePaused only
      not: fund_withdrawal_or_upgrade

    escrow_factory_guardian:
      actor: EscrowFactoryV2.guardian
      planned_holder: GovernanceTimelock
      scope: [transferGuardianship, factory_admin_ops]
      not: user_escrow_release

  forbidden_patterns:
    - deployer_eoa_retains_proxy_admin
    - bare_implementation_as_user_address
    - escrow_v1_factory_on_mainnet
    - timelock_as_upgradeable_proxy

# ── Upgrade plan ──────────────────────────────────────────────────────────────

upgrade_plan:
  proxy_pattern: TimelockUpgradeableProxy
  posture_ssot: registry/g24-p-upgrade-01-contract-posture.v1.yaml
  governable_shells:
    - TravelTrustGovernor
    - GovernanceTreasuryP4Cap
    - TtgPrimaryMarketV1
    - TtgSeatConcentrationRegistry
    - RegionStewardStakePool
  upgrade_authority: GovernanceTimelock
  upgrade_path: Governor_proposal → Timelock_delay → Timelock_execute → proxy.upgradeTo
  timelock_delay_hours_planned: 48
  timelock_controller: CONTROLLER_NON_UPGRADEABLE
  immutable_exempt:
    - CountryPoolNetProfitLedger
    - StewardPathVault
    - UnallocatedStewardPathVault
  emergency_procedure:
  - FeeRouter.setDistributePaused(true) via Timelock fast-track if pre-authorized
  - Escrow instances remain user-controlled — factory pause is guardian-scoped
  - No silent implementation swap on immutable core

# ── Deployment sequence (planning — execution in P3-04+) ─────────────────────

deployment_sequence:
  - step: 1
    action: deploy_implementations
    scope: [governable_shell_implementations, FeeRouter, immutable_core_per_jurisdiction]
    status: NOT_STARTED
  - step: 2
    action: deploy_proxies
    scope: [TimelockUpgradeableProxy shells]
    status: NOT_STARTED
  - step: 3
    action: initialize
    scope: [proxy_storage_init, tokenomics_params_from_TTG_FREEZE]
    status: NOT_STARTED
  - step: 4
    action: transfer_ownership
    scope: [all_contracts_owner_to_Timelock, proxy_admin_to_Timelock]
    status: NOT_STARTED
  - step: 5
    action: configure_roles
    scope: [FeeRouter_routing, stake_pool_jurisdictions, escrow_factory_v2_guardian]
    status: NOT_STARTED
  - step: 6
    action: verify
    scope: [etherscan, bytecode_hash_manifest, cast_admin_implementation_checks]
    status: NOT_STARTED
  - step: 7
    action: enable_production
    scope: [registry_update, env_mainnet, api_meta, indexer_start]
    status: NOT_STARTED
    blocked_by:
      - P3-04_escrow_v2_prep
      - P3-05_security_review
      - P3-06_ops_runbook
      - P3-08_owner_signoff
      - WEB3_FREEZE_PASS
      - mainnet_cutover_authorized

p3_03_scope_excluded:
  - mainnet_broadcast
  - gas_purchase
  - real_multisig_creation
  - contract_source_changes
  - tokenomics_changes

next_items:
  - P3-05_security_review_refresh
  - P3-06_mainnet_ops_runbook

closeout: docs/spec/governance-token/evidence/phase3-production-entry-baseline/P3-03-MAINNET-ADDRESS-PLANNING-CLOSEOUT.md
