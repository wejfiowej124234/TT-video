# ── Permission model ──────────────────────────────────────────────────────────

permission_model:
  hierarchy:
    - id: L0
      role: TIMELOCK_ADMIN_MULTISIG
      holder: TBD
      powers: [timelock.schedule, timelock.cancel, timelock.execute_as_admin]
    - id: L1
      role: GovernanceTimelock
      holder: TBD
      powers:
        - proxy.upgradeTo
        - treasury.spend_via_governance
        - fee_router.setRoutingConfig
        - fee_router.setDistributePaused
        - escrow_factory_v2.transferGuardianship
        - immutable_contract.owner_actions
    - id: L2
      role: TravelTrustGovernor
      holder: TBD
      powers: [propose, vote, queue, execute_via_timelock]
    - id: L3
      role: TTG_holders
      holder: token_delegates
      powers: [vote_on_proposals]

  emergency_roles:
    fee_router_pause:
      actor: FeeRouter.owner
      planned_holder: GovernanceTimelock
      scope: distributePaused only
      not: fund_withdrawal_or_upgrade

    escrow_factory_guardian:
      actor: EscrowFactoryV2.guardian
      planned_holder: GovernanceTimelock
      scope: [transferGuardianship, factory_admin_ops]
      not: user_escrow_release

  forbidden_patterns:
    - deployer_eoa_retains_proxy_admin
    - bare_implementation_as_user_address
    - escrow_v1_factory_on_mainnet
    - timelock_as_upgradeable_proxy

# ── Upgrade plan ──────────────────────────────────────────────────────────────

upgrade_plan:
  proxy_pattern: TimelockUpgradeableProxy
  posture_ssot: registry/g24-p-upgrade-01-contract-posture.v1.yaml
  governable_shells:
    - TravelTrustGovernor
    - GovernanceTreasuryP4Cap
    - TtgPrimaryMarketV1
    - TtgSeatConcentrationRegistry
    - RegionStewardStakePool
  upgrade_authority: GovernanceTimelock
  upgrade_path: Governor_proposal → Timelock_delay → Timelock_execute → proxy.upgradeTo
  timelock_delay_hours_planned: 48
  timelock_controller: CONTROLLER_NON_UPGRADEABLE
  immutable_exempt:
    - CountryPoolNetProfitLedger
    - StewardPathVault
    - UnallocatedStewardPathVault
  emergency_procedure:
  - FeeRouter.setDistributePaused(true) via Timelock fast-track if pre-authorized
  - Escrow instances remain user-controlled — factory pause is guardian-scoped
  - No silent implementation swap on immutable core

