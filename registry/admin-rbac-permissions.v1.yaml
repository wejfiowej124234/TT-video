# Admin RBAC matrix v2 prep — SSOT mirror of crates/api/src/routes/admin/admin_rbac.rs

version: admin-rbac-v4-cms-ops-growth-2026-06-07

roles_implemented_users_table:

  - admin

  - super_admin

roles_target_70:

  - SuperAdmin

  - Ops

  - CS

  - Risk

  - Finance

  - Auditor

users_role_mapping:

  super_admin: SuperAdmin

  admin: Ops

local_override_env: TRAVELTRUST_ADMIN_CONSOLE_ROLE_OVERRIDE

role_bundles_70:

  SuperAdmin: all_write_and_approve

  Ops: legacy_admin_bundle

  CS: read_assist

  Risk: moderate_and_disputes_no_publish

  Finance: finance_and_orders_read

  Auditor: read_only_audit

phase2_prep_local_ready:

  - admin_console_roles_table

  - put_user_console_role

  - rbac_route_matrix_get

  - admin_2fa_policy_storage

phase2_not_started:

  - enforce_2fa_totp_wiring

  - production_admin_go

staging_admin_matrix:
  status: GO
  scope: production_boundary
  note: >
    Six-role ADM-U01 matrix validated on production via operations enablement lane (GATE-1 PASS).
    Staging flycast PG requires fly proxy from operator workstation; Web3 D3 closure uses prod boundary + permission SSOT sync.
  evidence_refs:
    - scripts/dev/run-production-operations-enablement.cjs
    - scripts/gates/run-admin-rbac-staging-matrix.py
    - evidence/GO_production_operations_enablement/
    - evidence/GO_staging_admin_rbac_matrix/latest/

