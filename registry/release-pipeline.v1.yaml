# CLOSED graduation gates → three-layer evidence reuse (Rule 1–3).
# SSOT: registry/evidence-reuse-policy.v1.yaml
evidence_reuse_policy:
  registry: registry/evidence-reuse-policy.v1.yaml
  rules:
    rule_1: CLOSED_UNLESS_TOUCHED
    rule_2: REUSE_EXISTING_EVIDENCE
    rule_3: INCIDENT_OVERRIDE
  principle: >
    Default: reuse existing evidence for CLOSED gates (Rule 2).
    Re-run when rerun trigger categories 1–4 match since latest evidence (Rule 1).
    Re-run on production incident, security event, critical regression, or data integrity
    issue even without code diffs (Rule 3 — highest priority).
  rerun_trigger_categories:
    - "1_code_paths"
    - "2_deployment"
    - "3_runtime_configuration"
    - "4_data_model_and_contract"
  decision_flow:
    - CHECK_INCIDENT_OVERRIDE
    - CHECK_GATE_CLOSED
    - CHECK_RERUN_TRIGGERS
    - REUSE_EXISTING_EVIDENCE
    - RE_EXECUTE_GATE
  closed_gates:
    RELEASE_CANDIDATE: CLOSED_UNLESS_TOUCHED
    PHASE12_FINAL_CONVERGENCE: CLOSED_UNLESS_TOUCHED
    MARKET_LISTINGS_DISPLAY_GOVERNANCE: CLOSED_UNLESS_TOUCHED
    STAGING_FULL_SITE_DDG: CLOSED_UNLESS_TOUCHED
    OFFICIAL_COLD_START_DATASET: CLOSED_UNLESS_TOUCHED
    ADMIN_40_40: CLOSED_UNLESS_TOUCHED

# 毕业门禁治理层级（产品 → 展示 → 官方基线 → 生产）
governance_ladder:
  - id: RELEASE_CANDIDATE
    short: RC
    status: CLOSED
  - id: STAGING_FULL_SITE_DDG
    short: DDG
    status: CLOSED
  - id: OFFICIAL_COLD_START_DATASET
    short: OCS
    status: CLOSED
    role: production_official_content_baseline
    rerun_policy: CLOSED_UNLESS_TOUCHED
  - id: PRODUCTION_INFRASTRUCTURE
    short: PI3
    status: IN_PROGRESS
  - id: PRODUCTION_GO
    short: GO
    status: NO_GO
  note: >
    Product (RC + DDG + OCS) graduation gates are CLOSED. Remaining blockers to Go Live
    are production engineering: PI3 (domain/TLS, Stripe Live, Mainnet) then Production GO.

# 产品开发冻结 — 2026-07-02 · 产品验收已闭 · 唯一主线 PI3→GO
