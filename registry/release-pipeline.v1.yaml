  effective_utc: "2026-07-02"
  discipline: docs/runbook/TT-PROGRAM-MAINLINE-DISCIPLINE.md#23--产品开发冻结product-development-freeze--2026-07-02-起
  current_mainline_only:
    - PI3
    - PRODUCTION_INFRASTRUCTURE
    - MAINNET
    - PRODUCTION_BUSINESS_UAT
    - PRODUCTION_GO

