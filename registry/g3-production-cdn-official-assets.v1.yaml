# G3 Production CDN · Official Asset Baseline V1 · SSOT
# Human: docs/runbook/TT-G3-PRODUCTION-CDN-OFFICIAL-ASSETS.md

schema: traveltrust.g3_production_cdn_official_assets.v1
version: 1
effective_utc: "2026-07-04"

machine_keys:
  TT_G3_PRODUCTION_CDN_OFFICIAL_ASSETS: ENFORCED
  TT_OCS_OFFICIAL_ASSET_BASELINE_V1: VERIFIED
  TT_G3_PRODUCTION_CDN_PREP: READY
  TT_G3_PRODUCTION_CDN_VERIFIED: PLANNED

honest_boundary:
  staging_asset_verified_not_cdn: >
    TT_OCS_OFFICIAL_ASSET_BASELINE_V1 VERIFIED (② Staging) proves binaries + bindings on API volume.
    TT_G3_PRODUCTION_CDN_VERIFIED requires production CDN edge probes — not Staging signoff.
  prep_not_go: >
    TT_G3_PRODUCTION_CDN_PREP READY = configuration artifacts + runbooks + validators complete.
    TT_PRODUCTION_GO remains NO_GO until G3-01..G3-06 VERIFIED + Decision Package.

cdn:
  provider: cloudflare
  public_base: https://cdn.traveltrust.app
  official_assets:
    prefix: official-cold-start/v1
    url_pattern: "{public_base}/{prefix}/{filename}"
    filename_pattern: ocs-{chain_id}-{slot}.jpg
    asset_count: 60
    baseline_version: V1

cache_policy:
  official_static:
    cache_control: "public, max-age=31536000, immutable"
    edge_ttl_seconds: 31536000
    browser_ttl_seconds: 31536000
    cf_cache_status_expect: HIT
    note: Content-addressed by v1 prefix + immutable filename — safe long TTL
  community_user_upload:
    cache_control: "public, max-age=86400, immutable"
    edge_ttl_seconds: 86400
    prefix: community-media/v1
  api_origin_fallback:
    path: /api/v1/uploads/community-posts/:name
    staging_only_interim: true
    production_target: cdn_public_url

version_management:
  rule: bump baseline prefix on content expansion — never mutate in place
  sequence: [V1, V1.1, V2]
  path_by_version:
    V1: official-cold-start/v1
    V1.1: official-cold-start/v1.1
    V2: official-cold-start/v2
  manifest_pins:
    content: data/official-cold-start/dataset.v1.json
    assets: data/official-cold-start/assets.v1.json
  cutover:
    step1: upload new prefix objects to R2
    step2: update manifest public_url to CDN absolute URLs
    step3: rebind published entities via remediate script
    step4: verify HEAD 200 + cf-cache-status on CDN host
    step5: deprecate old prefix via lifecycle — do not delete until unpublish

object_lifecycle:
  r2_bucket: traveltrust-community-media
  rules:
    - id: official_v1_current
      prefix: official-cold-start/v1/
      status: ACTIVE
      expiration_days: null
    - id: official_superseded_prefix
      prefix: official-cold-start/
      superseded_after_days: 90
      transition: STANDARD_IA
      delete: false
      note: Governance unpublish required before hard delete
    - id: community_media_current
      prefix: community-media/v1/
      status: ACTIVE
      expiration_days: null

global_edge:
  compression: [brotli, gzip]
  http3: true
  geo: cloudflare_anycast
  cors:
    allow_origins_production:
      - https://traveltrust.app
      - https://www.traveltrust.app
    allow_methods: [GET, HEAD, OPTIONS]
    max_age_seconds: 86400

implementation_artifacts:
  generator: scripts/dev/generate-g3-cdn-implementation-artifacts.cjs
  cache_rules: evidence/GO_production_readiness/G3-01/preparation/cloudflare-cache-rules.v1.json
  lifecycle: evidence/GO_production_readiness/G3-01/preparation/r2-lifecycle-policy.v1.json
  r2_upload_manifest: evidence/GO_production_readiness/G3-01/preparation/ocs-r2-upload-manifest.v1.json

scripts:
  policy_lib: scripts/dev/lib/g3-production-cdn-policy.cjs
  generate_artifacts: scripts/dev/generate-g3-cdn-implementation-artifacts.cjs
  bootstrap_r2: scripts/dev/bootstrap-ocs-official-assets-to-r2.cjs
  configure_production: scripts/dev/configure-production-media-r2-cdn.sh
  validate_prep: scripts/dev/validate-g3-production-cdn-prep.cjs
  orchestrate_prep: scripts/dev/run-g3-production-cdn-prep.sh
  production_baseline_prep: scripts/dev/run-ocs-official-asset-baseline-production-prep.sh

evidence:
  prep_root: evidence/GO_production_readiness/G3-01/preparation
  verified_root: evidence/GO_production_readiness/G3-01
  staging_asset_baseline: evidence/GO_official_cold_start_dataset/ocs-official-asset-baseline/20260704T085638Z

release_prep:
  master_script: scripts/dev/run-phase12-production-release-prep.sh
  registry: registry/production-release-prep.v1.yaml
  runbook: docs/runbook/TT-PRODUCTION-RELEASE-PREP.md
