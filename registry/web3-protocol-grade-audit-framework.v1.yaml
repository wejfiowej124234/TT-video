  track: D4555_B_net_profit_split
  flows:
    - id: CP-01
      step: Gross revenue accrual
      contract: CountryPoolNetProfitLedger
      function: accrueBatch
      math: sum(R100+R110+R120 lines)
      verified: partial
    - id: CP-02
      step: Expense deduction → net profit
      function: closeEpoch
      math: netProfit = gross - allowableExpense - carriedLoss
      verified: partial
    - id: CP-03
      step: 45/55 split (net profit prime)
      function: executeSplit
      math: stewardAmount + globalAmount + unallocated = netProfitPrime
      verified: partial
    - id: CP-04
      step: Snapshot qualification
      function: qualificationSnapshotBlock
      math: steward eligibility boolean
      verified: target
    - id: CP-05
      step: StewardPathVault deposit
      contract: StewardPathVault
      verified: partial
    - id: CP-06
      step: Claim → Wallet
      contract: RegionDistributionClaim
