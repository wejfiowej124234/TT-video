# ── Attack Surface Matrix ─────────────────────────────────────────────────────
attack_surface_matrix:
  - contract: Escrow
    attacks:
      - id: ASM-ESC-01
        vector: Reentrancy
        proof_required: forge test or CEI pattern in source
        mitigation_design: checks-effects-interactions + no external call before state
      - id: ASM-ESC-02
        vector: Double Release
        proof_required: status gate Funded→Completed once
        mitigation_design: InvalidState on non-Funded
      - id: ASM-ESC-03
        vector: Unauthorized Release
        proof_required: caller restriction or documented relayer model
        mitigation_design: UNVERIFIED — release() public
      - id: ASM-ESC-04
        vector: Wrong Recipient
        proof_required: init immutability of guide/traveler/token
        mitigation_design: onlyFactory init once

  - contract: TravelTrustGovernor
    attacks:
      - id: ASM-GOV-01
        vector: Flash Vote
        proof_required: ERC20Votes getPastVotes
        mitigation_design: GovernanceVotesToken snapshots
      - id: ASM-GOV-02
        vector: Queue Spam
        proof_required: proposal threshold + timelock
        mitigation_design: proposalThreshold parameter
      - id: ASM-GOV-03
        vector: Execute Replay
        proof_required: timelock idempotency
        mitigation_design: OpenZeppelin GovernorTimelockCompound pattern

  - contract: FeeRouter
    attacks:
      - id: ASM-FR-01
        vector: Routing config hijack
        proof_required: onlyOwner + Timelock as owner
        mitigation_design: owner=Timelock at deploy
      - id: ASM-FR-02
        vector: Dust accumulation
        proof_required: distribute pulls full balance
        mitigation_design: distribute(amount) semantics

  - contract: RegionStewardStakePool
    attacks:
      - id: ASM-STK-01
        vector: Double stake same jurisdiction
        proof_required: hasJurisdictionStake guard
        mitigation_design: stake() revert if active
      - id: ASM-STK-02
        vector: Early unstake
        proof_required: release delay timestamps
        mitigation_design: releaseRequestedAt + claimReleased

  - contract: GovernanceTreasuryP4Cap
    attacks:
      - id: ASM-TR-01
        vector: Spender bypass cap
        proof_required: P4 cap enforcement test
        mitigation_design: spendP4Reserve cap check
      - id: ASM-TR-02
        vector: Non-spender drain
        proof_required: onlySpender modifier
        mitigation_design: role gated spend

  - contract: TimelockUpgradeableProxy
    attacks:
      - id: ASM-PRX-01
        vector: EOA upgradeTo
        proof_required: admin slot = Timelock only
        mitigation_design: G24 gate + proxy tests

# ── Web3 Permission Tree (on-chain + off-chain) ───────────────────────────────
permission_tree:
  - id: PERM-ROOT-OWNER
    role: Protocol Owner / Safe
    scope: deploy-time + Timelock proposer
    children:
      - id: PERM-PROXY-ADMIN
        role: Timelock (via ERC1967 admin slot)
        scope: upgradeTo / upgradeToAndCall
        denies: [EOA direct upgrade]
      - id: PERM-TIMELOCK-EXEC
        role: Timelock Executor
        scope: execute queued ops
        children:
          - id: PERM-GOVERNOR
            role: TravelTrustGovernor
            scope: propose · vote · queue · execute via timelock
          - id: PERM-TREASURY-SPEND
            role: Treasury spender (Timelock)
            scope: spendP4Reserve · spend ETH
          - id: PERM-FEEROUTER-OWNER
            role: FeeRouter.owner
            scope: distribute · setRoutingConfig · pause
          - id: PERM-LEDGER-OWNER
            role: CountryPoolNetProfitLedger.owner
            scope: accrue · fund · close · split
      - id: PERM-REGISTRY
        role: On-chain registry (TARGET)
        scope: address book updates via governance
      - id: PERM-ESCROW-FACTORY
        role: EscrowFactory
        scope: createEscrow instances
        denies: [upgrade existing Escrow]
      - id: PERM-API-RBAC
        role: Admin Console RBAC
        scope: off-chain reads/approvals only
        denies: [direct_timelock · spend · upgrade]

# ── Upgrade Matrix ────────────────────────────────────────────────────────────
upgrade_matrix:
  - contract: TimelockUpgradeableProxy shells
    path: [Proposal, Vote, Queue, TimelockDelay, Execute, upgradeTo, VerifyBytecode, EvidenceG24]
    rollback: previous impl only via new governance proposal
    verify: [G1 bytecode manifest, storage layout test]
    evidence: registry/g24-p-upgrade-01-contract-posture.v1.yaml
  - contract: TravelTrustGovernor
    path: [non_upgradeable — redeploy requires migration proposal]
    rollback: none in-place
    verify: [bytecode hash G1]
  - contract: GovernanceTimelock
    path: [non_upgradeable delay constant]
    rollback: none
    verify: [G3 delay >= 86400s]
  - contract: Escrow instances
    path: [immutable — new orders via EscrowFactory only]
    rollback: N/A
    verify: [factory routing config]
  - contract: FeeRouter
    path: [setRoutingConfig via Timelock if owner=Timelock]
    rollback: prior config via governance
    verify: [event RoutingConfigSet]

# ── Economic Model Flows ──────────────────────────────────────────────────────
economic_model:
  supply_invariants:
    - id: ECO-01
      check: TTG total supply cap
      source: TtgGovFreezeConstants.TTG_TOTAL_SUPPLY_UNITS
      expected: 10_000_000 ether
      infinite_mint_risk: GovernanceVotesToken mint restricted to Minter role
    - id: ECO-02
      check: USDC Escrow conservation
      source: Escrow.executeResolution sum check
      expected: guide+traveler+platform == totalAmount
    - id: ECO-03
      check: FeeRouter BPS sum
      source: FeeRouter constructor defaults
      expected: country 4500 + global splits = 10000
  flow_graph:
    - from: TTG Treasury mint
      to: Primary Market TARGET
      cycle_risk: LOW if mint cap enforced
    - from: Primary Market
      to: TTG Holder wallets
      cycle_risk: MEDIUM — market price vs NAV disclosure
    - from: Escrow fees
      to: FeeRouter
      to2: CountryPool D-4555-A
      cycle_risk: LOW — orthogonal to D-4555-B
    - from: Net profit
      to: CountryPoolNetProfitLedger
      to2: Steward + Global
      cycle_risk: MEDIUM — double-count if mixed with D-4555-A
  arbitrage_checks:
    - id: ECO-ARB-01
      scenario: stake vote then unstake same block
      mitigation: getPastVotes + release delay
      status: REQUIRES_CERT_EVIDENCE
    - id: ECO-ARB-02
      scenario: fee route vs net profit double dip
      mitigation: orthogonal accounting tracks
      status: REQUIRES_OPS_TRAINING

