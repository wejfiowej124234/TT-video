# ── Design Intent (Why · not just what) ───────────────────────────────────────
design_intent:
  Escrow:
    module: M10
    functions:
      release:
        current_behavior: permissionless external call when status==Funded
        v1_legacy_behavior: V1 Escrow.sol — permissionless @ Funded (Sepolia legacy only)
        v2_mainnet_behavior: EscrowV2 — permissionless AFTER travelerServiceConfirmed && guideServiceConfirmed
        design_target: Bilateral Confirmation Settlement Model
        why_target: >
          release() executes fund split only; business authorization = bilateral service
          complete. Permissionless caller AFTER attestation enables Keeper automation
          without Backend custody. Immutable destinations prevent caller profit.
        why_not_onlyTraveler: >
          Traveler-only would block decentralized settlement bots; authorization belongs
          in completion layer not release layer.
        status: V2_DESIGN_PASS_V1_LEGACY_FORBIDDEN
        v1_mainnet: FORBIDDEN
        evidence_required:
          - ESCROW-SETTLEMENT-AUTHORIZATION-AUDIT-LATEST.json
          - ESCROW-BILATERAL-LAYER-A-EVIDENCE-LATEST.json
          - ESCROW-BILATERAL-LAYER-B-EVIDENCE-LATEST.json
          - registry/escrow-bilateral-mainnet-policy.v1.yaml
          - Owner signoff on ODR
        verdict_until_mainnet_deploy: BLOCKED
      deposit:
        current_behavior: onlyTraveler
        why: payer authorization — only traveler funds order
        status: PASS
      refund:
        current_behavior: onlyTraveler
        why: unilateral exit before service settlement
        status: PASS
  FeeRouter:
    module: M09
    functions:
      distribute:
        current_behavior: onlyOwner
        why: routing params governance-controlled; pause for emergency
        status: PASS
  CountryPoolNetProfitLedger:
    module: M11
    functions:
      executeSplit:
        current_behavior: onlyOwner Timelock
        why: D-4555-B net profit split is governance/finance controlled
        status: PASS

