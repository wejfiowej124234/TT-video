fund_lifecycle_flows:
  - id: FL-01
    track: R3_escrow
    step: Traveler USDC → Escrow lock
    from: traveler_wallet
    to: Escrow
    contract: Escrow
    function: deposit
    caller_allowed: [traveler]
    caller_denied: [guide, admin, backend, governor, timelock]
    responsible: [Product, Backend relayer optional]
    rollback: refund while Funded (traveler only)
    recovery: none on-chain post-Completed
    pause: none (immutable instance)
    deadlock_risk: Created without deposit — order stuck until timeout/off-chain cancel
    source_ref: contracts/src/Escrow.sol#deposit
    ssot_ref: fund-flow-ssot.v1.md §5

  - id: FL-02
    track: R3_escrow
    step: Escrow Funded → Release split (after bilateral service complete)
    from: Escrow
    to: [guide_wallet, platformFeeRecipient]
    contract: Escrow
    function: release
    caller_allowed: [permissionless Keeper AFTER service bilateral complete — Design Intent]
    caller_denied: [release before service complete]
    responsible: [Automation Keeper, Product policy]
    rollback: none after Completed
    recovery: dispute path only while Funded→Disputed
    pause: none
    deadlock_risk: release before bilateral confirm if attestation missing
    source_ref: contracts/src/Escrow.sol#release
    ssot_ref: escrow-settlement-authorization audit · Bilateral Confirmation Settlement Model
    cross_validation_required: true
    business_confirm_prerequisite: [guide_service_confirmed, traveler_service_confirmed]

  - id: FL-03
    track: R4_platform_fee
    step: platformFeeRecipient → FeeRouter distribute
    from: FeeRouter balance
    to: [countryBucket, globalStakers, globalReserve, globalOps]
    contract: FeeRouter
    function: distribute
    caller_allowed: [owner]
    caller_denied: [traveler, guide, backend without owner key]
    responsible: [Finance, Ops Timelock executor]
    rollback: none (tokens already split)
    recovery: owner setRoutingConfig via Timelock for future fees
    pause: distributePaused blocks new distribute
    deadlock_risk: fees stuck in FeeRouter if paused and no recovery path
    source_ref: contracts/src/FeeRouter.sol
    ssot_ref: fund-flow-ssot.v1.md §6 · D-4555-A

  - id: FL-04
    track: D4555_A
    step: FeeRouter countryBucket → RegionVault
    from: FeeRouter.countryBucket
    to: RegionVault
    contract: RegionVault
    function: receive / accounting
    caller_allowed: [FeeRouter owner distribute path]
    caller_denied: [steward direct withdraw]
    responsible: [Finance, Protocol]
    rollback: none
    recovery: governance re-route FeeRouter
    pause: FeeRouter pause
    deadlock_risk: misconfigured countryBucket address
    source_ref: contracts/src/RegionVault.sol
    ssot_ref: WEB3-SYSTEM-MASTER-MAP-V1.md M25

  - id: FL-05
    track: D4555_B
    step: Net profit accrual → CountryPoolNetProfitLedger
    from: off-chain finance accrual
    to: CountryPoolNetProfitLedger
    contract: CountryPoolNetProfitLedger
    function: accrueBatch / fundEpoch
    caller_allowed: [owner Timelock]
    caller_denied: [admin API, steward, traveler]
    responsible: [Finance, Ops]
    rollback: epoch OPEN only — close rules apply
    recovery: Timelock governance parameter fix
    pause: owner-controlled ops
    deadlock_risk: epoch stuck OPEN without close
    source_ref: contracts/src/CountryPoolNetProfitLedger.sol
    ssot_ref: fund-flow-ssot.v1.md · PHASE2 alignment

  - id: FL-06
    track: D4555_B
    step: Ledger split → StewardPathVault / Treasury path
    from: CountryPoolNetProfitLedger
    to: [StewardPathVault, UnallocatedStewardPathVault, global treasury path]
    contract: CountryPoolNetProfitLedger
    function: executeSplit
    caller_allowed: [owner Timelock]
    caller_denied: [steward self-claim without qualification snapshot]
    responsible: [Finance, Steward Ops]
    rollback: none post SPLIT_COMPLETED
    recovery: governance corrective proposal
    pause: Timelock schedule delay
    deadlock_risk: SPLIT_PENDING without executeSplit
    source_ref: contracts/src/CountryPoolNetProfitLedger.sol

  - id: FL-07
    track: R1_ttg
    step: Steward TTG stake lock
    from: steward_wallet
    to: RegionStewardStakePool
    contract: RegionStewardStakePool
    function: stake
    caller_allowed: [steward EOA]
    caller_denied: [admin mint into pool]
    responsible: [Product, Steward program]
    rollback: unstake release path after delay
    recovery: slash via SlashRouter (Wave 3)
    pause: pool parameter freeze
    deadlock_risk: releaseRequestedAt without claimReleased
    source_ref: contracts/src/RegionStewardStakePool.sol
    ssot_ref: state-machine.v1.md §1

  - id: FL-08
    track: R1_ttg
    step: Treasury spend (governance)
    from: GovernanceTreasuryP4Cap
    to: spend recipient
    contract: GovernanceTreasuryP4Cap
    function: spendP4Reserve
    caller_allowed: [spender role — Timelock execute]
    caller_denied: [governor without timelock, admin API]
    responsible: [Governance, Finance]
    rollback: none
    recovery: governance top-up only
    pause: Timelock delay 48h
    deadlock_risk: queued proposal expires
    source_ref: contracts/src/GovernanceTreasuryP4Cap.sol
    ssot_ref: ttg-governance-cert-gates Cert #8

  - id: FL-09
    track: R2_country_pool
    step: Claim → Wallet
    from: RegionDistributionClaim / Redemption
    to: holder_wallet
    contract: RegionDistributionClaim
    function: claim
    caller_allowed: [holder EOA]
    caller_denied: [admin pull]
    responsible: [Finance, Product]
    rollback: none
    recovery: re-snapshot if merkle wrong — governance
    pause: epoch not open
    deadlock_risk: TARGET — mainnet not deployed
    source_ref: contracts/src/RegionDistributionClaim.sol
    ssot_ref: state-machine.v1.md §4

# ── Role State Machines ───────────────────────────────────────────────────────
role_state_machines:
  traveler:
    ssot: docs/spec/350-阶段状态机可视化与状态校验系统.md
    machine_code: order_traveler
    states:
      - id: browse
        allowed: [create_order, connect_wallet]
        forbidden: [release_escrow, claim_ttg]
        anomaly: off-chain KYC block → support ticket
      - id: order_created
        allowed: [deposit_escrow, cancel_pre_fund]
        forbidden: [guide_release]
        anomaly: deposit fail → retry / refund off-chain
      - id: escrow_funded
        allowed: [refund, open_dispute]
        forbidden: [direct_fee_router]
        anomaly: service dispute → dispute FSM
      - id: completed
        allowed: [review]
        forbidden: [on-chain refund]
        anomaly: indexer lag → wait G2 replay

  guide:
    ssot: docs/spec/350-阶段状态机可视化与状态校验系统.md
    machine_code: order_guide
    states:
      - id: identity_staked
        allowed: [accept_order, deposit_identity]
        forbidden: [withdraw_stake_while_active_orders]
        anomaly: slash → IdentityStakingPool
      - id: service_active
        allowed: [request_release via backend]
        forbidden: [pull_escrow_direct]
        anomaly: no-show → slashed path
      - id: payout_received
        allowed: [withdraw_wallet]
        forbidden: [double_release]
        anomaly: wrong amount → dispute

  merchant:
    ssot: fund-flow-ssot.v1.md §2
    machine_code: country_pool_subscriber
    states:
      - id: subscription_open
        allowed: [subscribe_usdc]
        forbidden: [steward_stake_same_pool]
        anomaly: lock period → redemption queue
      - id: locked
        allowed: [request_redemption]
        forbidden: [instant_principal_guarantee]
        anomaly: window closed → queue next epoch

  steward:
    ssot: docs/spec/governance-token/state-machine.v1.md §1 §2
    machine_code: steward_application
    states:
      - id: draft
        allowed: [submit_application]
        forbidden: [vote, receive_profit]
        anomaly: withdrawn terminal
      - id: stake_pending
        allowed: [stake_ttg_on_chain]
        forbidden: [transfer_staked_ttg]
        anomaly: tx fail → retry
      - id: under_review
        allowed: [admin_review]
        forbidden: [self_approve]
        anomaly: rejected → stake_release_pending
      - id: approved
        allowed: [role_confirm, seat_activate]
        forbidden: [unstake_instant]
        anomaly: KPI watch → seat FSM
      - id: active
        allowed: [vote, receive_profit, request_exit]
        forbidden: [direct_treasury_spend]
        anomaly: probation → 0% bonus
      - id: exit_requested
        allowed: [wait_cooling_180d]
        forbidden: [usdc_exit]
        anomaly: KPI review fail → extended delay
      - id: released
        allowed: [claimReleased]
        forbidden: [re_stake_same_epoch]
        anomaly: claim fail → on-chain retry

  ttg_holder:
    ssot: ttg-allocation-permissions-flows-ssot-v1.md
    machine_code: ttg_governance_participant
    states:
      - id: wallet_balance
        allowed: [transfer, delegate, primary_market_if_enabled]
        forbidden: [mint_self]
        anomaly: lost key → no recovery
      - id: delegated
        allowed: [vote, propose if threshold]
        forbidden: [double_delegate_same_block]
        anomaly: flash vote mitigated by getPastVotes
      - id: staked_steward
        allowed: [governance_vote_per_rules]
        forbidden: [transfer_while_locked]
        anomaly: see steward FSM

  admin:
    ssot: registry/admin-rbac-permissions.v1.yaml
    machine_code: admin_console
    states:
      - id: authenticated
        allowed: [rbac_scoped_reads, approval_workflows]
        forbidden: [direct_timelock_execute, spend_treasury]
        anomaly: 403 → permission matrix audit
      - id: approval_pending
        allowed: [second_signer_approve]
        forbidden: [solo_p0_mutations]
        anomaly: timeout → escalate Ops

