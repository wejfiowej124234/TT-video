# ── 唯一执行入口（写死） ─────────────────────────────────────────────────────

sole_execution_entry:
  status: ENFORCED
  rule: >
    Production Readiness is the ONLY execution entry. Any bug, requirement, or fix
    MUST enter the Master Matrix before work starts — never fix-first.
  forbidden:
    - direct_fix_without_matrix_registration
    - parallel_ad_hoc_backlog
    - new_architecture_lines_before_production_go
    - pcp_feature_work_without_architecture_review
  workflow:
    - discover_or_intake
    - master_matrix_register
    - locate_domain
    - assign_go_gate
    - classify_blocking
    - fix_or_confirm
    - attach_evidence
    - close_in_matrix
    - advance_wave_and_gate

release_train:
  status: ACTIVE
  chain: Master Matrix → Wave → Gate → Evidence → Production GO
  go_rule: G1 PASS + G2 PASS + G3 PASS → TT_PRODUCTION_GO GO
  active_wave: "1.1"
  active_gate: G1
  waves:
    - wave: "1.1"
      gate: G1
      execute: bash scripts/dev/run-production-readiness-wave-1-1-g1.sh
    - wave: "2"
      gate: G2
    - wave: "3"
      gate: G3

