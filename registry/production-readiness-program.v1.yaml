# TravelTrust · Production Readiness Program · Machine SSOT
# Human: docs/runbook/TT-PRODUCTION-READINESS-PROGRAM.md
# Scope: Production layer only — NOT PCP architecture (see TT_PCP_ARCHITECTURE: FROZEN)

schema: traveltrust.production_readiness_program.v1
version: 1
effective_utc: "2026-07-04"
updated_utc: "2026-07-04T08:08:00Z"

supreme_principle:
  en: Production GO is earned by evidence, not by implementation.
  zh: Production GO 由证据获得，而不是由代码完成获得。
  not_go:
    - feature_shipped
    - tests_passing
    - docs_complete
  go_rule: >
    Master Matrix G1 + G2 + G3 all CLOSED with evidence attachments only then TT_PRODUCTION_GO GO

operating_principles:
  effective_utc: "2026-07-04"
  principle_1_no_look_back:
    en: Closed tracks stay in maintenance — do not re-discuss unless new requirement, architecture review, or production incident
    zh: 不回头 — PCP 与 Community G1 默认维护态；仅新需求 / 架构评审 / 线上事故可重开
    maintenance_tracks:
      - pcp
      - community_production_ready_g1_domain
    reopen_triggers: [new_requirement, architecture_review, production_incident]
    closed_gap_policy: never_reopen — new gaps use new PRM-* IDs
  principle_2_matrix_first:
    en: Any bug, requirement, or optimization enters Master Matrix before fix — single Release Train
    zh: 只看 Master Matrix — 第一件事不是修，是登记 Matrix
    workflow: intake → master_matrix → fix_or_confirm → evidence → close
  principle_3_go_by_evidence_only:
    en: No subjective go-live opinions — only Evidence → Matrix → G1 → G2 → G3 → Production GO
    zh: GO 只看 Evidence — 禁止「我觉得可以上线」
    chain: [evidence, master_matrix, g1_pass, g2_pass, g3_pass, production_go]
  principle_4_content_governance_non_blocking:
    en: >
      Content/Data Governance must NOT block Production Infrastructure.
      Only issues that directly affect Production GO may block the current G3 Domain.
    zh: >
      任何运营数据治理（Content/Data Governance）不得阻塞生产基础设施（Production Infrastructure）；
      只有直接影响 Production GO 的问题才能阻塞当前 G3 Domain。
    blocks_current_g3_domain:
      - dns
      - tls
      - cdn
      - waf
      - stripe_live
      - disaster_recovery
      - production_monitoring
      - production_evidence
    does_not_block_g3:
      - market_media_ddg_remediation
      - ocs_manifest_optimization
      - new_official_content
      - content_richness
      - community_ops_campaigns
      - new_campaigns
    does_not_block_g3_unless: directly_affects_production_go
    machine_key: TT_CONTENT_GOVERNANCE_NON_BLOCKING_G3
  principle_5_configuration_over_code:
    en: >
      In G3, resolve via configuration surfaces (Fly secrets, DNS, CDN, Stripe Dashboard,
      Cloudflare, WAF, env vars, deploy params) before any code change. Code work is allowed
      only after Capability is confirmed missing.
    zh: >
      G3 阶段：若问题可通过 Fly Secrets · DNS · CDN · Stripe Dashboard · Cloudflare · WAF ·
      环境变量 · 部署参数解决，禁止先改代码；仅当 Capability 确认缺失时才允许进入开发。
    configuration_surfaces:
      - fly_secrets
      - dns
      - cdn
      - stripe_dashboard
      - cloudflare
      - waf
      - environment_variables
      - deploy_parameters
    code_change_allowed_only_when: capability_confirmed_missing
    machine_key: TT_CONFIGURATION_CHANGES_OVER_CODE_CHANGES

g3_ccv_pre_implementation_gate:
  status: ENFORCED
  machine_key: TT_G3_CCV_PRE_IMPLEMENTATION_GATE
  rule: >
    Before any G3 Domain enters Implementation, answer three questions — do not start
    DNS/Stripe/DR work until CCV is recorded per domain.
  dimensions:
    capability:
      question_en: Does this capability already exist?
      question_zh: 这个能力是否已经存在？
    configuration:
      question_en: Is it only not configured yet?
      question_zh: 是否只是没有配置？
    verification:
      question_en: Is it only not verified yet?
      question_zh: 是否只是没有验收？
  dimension_status: [VERIFIED, PLANNED, IMPLEMENTING]
  formal_lane: PLANNED
  interpretation:
    capability_verified_configuration_planned: no_platform_development — configuration and verification only
    capability_missing: register_matrix_gap — then and only then code or platform work
  required_before: g3_domain_implementation
  ssot_human: docs/runbook/G3-PRODUCTION-DOMAINS.md#tt-g3-ccv-pre-implementation-gate

progress_reporting:
  forbidden:
    - percentage_completion
    - subjective_go_live_opinion
  default_one_line: >
    Platform COMPLETE · Production Readiness ACTIVE · G1 IN_PROGRESS ·
    G2 NOT_STARTED · G3 NOT_STARTED · Production GO NO_GO
  rule: Report Gate status and Matrix closures — not % complete

