  verdict: PASS
  evidence:
    audit_json: evidence/GO_official_cold_start_dataset/20260703T044855Z/single-official-baseline-audit.json
    align_json: evidence/GO_official_cold_start_dataset/20260703T044855Z/single-official-baseline-align.json
