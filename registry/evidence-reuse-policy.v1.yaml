# TravelTrust · Evidence Reuse Policy · SSOT
# Runbook: docs/runbook/TT-RELEASE-PIPELINE.md § Evidence Reuse Policy
# Applies to all CLOSED graduation gates and capstone audits in the release pipeline.

schema: traveltrust.evidence_reuse_policy.v1
version: 2
effective_utc: "2026-07-03"

machine_keys:
  TT_EVIDENCE_REUSE_POLICY: ENFORCED
  TT_EVIDENCE_REUSE_RUNBOOK: docs/runbook/TT-RELEASE-PIPELINE.md
  TT_EVIDENCE_REUSE_RULE1: CLOSED_UNLESS_TOUCHED
  TT_EVIDENCE_REUSE_RULE2: REUSE_EXISTING_EVIDENCE
  TT_EVIDENCE_REUSE_RULE3: INCIDENT_OVERRIDE

# ── Three-layer rules (priority: Rule 3 > Rule 1 triggers > Rule 2 default) ──

rules:
  rule_1:
    id: CLOSED_UNLESS_TOUCHED
    priority: default
    summary: CLOSED gates are not re-executed unless a configured rerun trigger matches.
  rule_2:
    id: REUSE_EXISTING_EVIDENCE
    priority: default_when_no_triggers
    summary: >
      If the gate is CLOSED and no rerun trigger (categories 1–4 below) has changed since
      the latest evidence stamp, the existing evidence remains authoritative and the gate
      must not be re-executed.
  rule_3:
    id: INCIDENT_OVERRIDE
    priority: highest
    summary: >
      A CLOSED gate must be re-executed if a production incident, security event, critical
      regression, or data integrity issue invalidates the previous evidence, regardless of
      whether configured trigger paths changed.
    requires:
      - incident_record_or_signoff_note
      - scope_gate_ids_affected
      - new_evidence_stamp
    invalidates_without_code_change: true

principle: >
  Default: do not re-run CLOSED gates — reuse existing evidence (Rule 2).
  Re-run when any rerun trigger category matches since latest evidence (Rule 1).
  Re-run when Rule 3 incident override applies, even with zero code diffs.

decision_flow:
  - id: CHECK_INCIDENT_OVERRIDE
    priority: 1
    action: >
      If production incident, security event, critical regression, or data integrity issue
      invalidates prior evidence → RE_EXECUTE_GATE (Rule 3) and record override reason.
  - id: CHECK_GATE_CLOSED
    priority: 2
    action: Confirm gate status is CLOSED (or PASS for one-time graduation gates)
  - id: CHECK_RERUN_TRIGGERS
    priority: 3
    action: Evaluate rerun trigger categories 1–4 against latest evidence stamp
  - id: REUSE_EXISTING_EVIDENCE
    priority: 4
    when: gate_closed AND no_triggers_matched AND no_incident_override
    action: Point Registry / Dashboard / Sign-off at latest evidence — do not re-run (Rule 2)
  - id: RE_EXECUTE_GATE
    priority: 5
    when: any_trigger_matched OR incident_override
    action: Re-run gate orchestrator, write new evidence, update sign-off

# ── Rerun trigger categories (explicit — avoid ambiguous "runtime config") ──

rerun_trigger_categories:
  "1_code_paths":
    label: Code path changes
    field: rerun_when_paths_change
    description: >
      Files or globs listed per gate, plus shared audit scripts, gates, and gate registries.
    detection: git diff since latest evidence stamp against gate path list
  "2_deployment":
    label: Deployment changes
    description: New staging or production deployment invalidates browser/API evidence tied to deploy ids.
    staging:
      - staging_api_deploy_id
      - staging_web_deploy_id
    production:
      - production_api_deploy_id
      - production_web_deploy_id
    detection: compare fly release / deploy id recorded in latest evidence vs current live deploy
  "3_runtime_configuration":
    label: Runtime configuration changes
    description: >
      Secrets, environment variables, and feature flags that affect public surfaces, seed
      behaviour, or gate outcomes — not generic infra noise.
    env_vars:
      - TRAVELTRUST_SEED_MULTI_DEMO_PUBLIC_MARKET
      - TRAVELTRUST_SEED_GUIDE_PUBLIC_MARKET
      - TRAVELTRUST_MARKET_PUBLIC_SHOWCASE
      - TRAVELTRUST_MANUAL_ACCEPTANCE
      - TRAVELTRUST_SHOW_TEST_DATA
    secrets_and_flags:
      - fly secrets diff affecting API/WEB staging or production apps
      - feature flags toggling public catalog, admin RBAC, or seed paths
    detection: compare env/secrets snapshot in latest evidence vs current deployment config
  "4_data_model_and_contract":
    label: Data model or contract changes
    description: >
      API schema, response shapes, data_origin, public_catalog_only filters, migrations, or
      OpenAPI/contract tests that change what "PASS" means for the gate.
    paths:
      - crates/api/migrations/**
      - crates/api/src/db/public_catalog_surface.rs
      - crates/api/src/db/market_listings.rs
      - frontend/lib/apiClient/**
      - registry/*contract*
      - docs/spec/*API*
    keywords:
      - data_origin
      - public_catalog_only
      - display_origin
      - display_status
    detection: git diff on paths/keywords since latest evidence stamp

incident_override:
  applies_to: all CLOSED gates in this registry
  triggers:
    - production_incident
    - security_event
    - critical_regression
    - data_integrity_issue
    - evidence_proven_stale_by_ops_review
  action: RE_EXECUTE_GATE
  documentation:
    - evidence/manual-uat/signoff/<GATE>-INCIDENT-OVERRIDE-<UTC>.md
    - link incident ticket or postmortem id in sign-off body
  note: >
    Rule 3 overrides Rule 2 even when categories 1–4 show no diff. Do not use Rule 3 for
    routine release hygiene — use configured triggers instead.

