# Human runbook: docs/runbook/PRODUCTION-PAYMENT-READINESS-WEB3-USDC.md
# Gate: scripts/check-web3-payment-production-readiness.sh
# Machine key: TT_WEB3_PAYMENT_PRODUCTION_READINESS
# Architecture SSOT: registry/payment-architecture-classification.v1.yaml

schema: traveltrust.production_payment_readiness_checklist.v2
version: 2
effective_utc: "2026-07-08"
machine_key: TT_WEB3_PAYMENT_PRODUCTION_READINESS
g3_domain: G3-02
production_scope: PRODUCTION_SCOPE_SEPOLIA
chain_id: 11155111

architecture_truth:
  core_rail:
    label: Web3 Escrow (USDC)
    flow: Wallet → approve → deposit → Escrow → events → Indexer → order → release → FeeRouter → Settlement → Ledger
  not_core_rail:
    stripe:
      label: Optional Fiat Onboarding (future extension)
      classification: P1_FUTURE_FIAT_ONRAMP
      pi3_ref: PI3-003
      blocks_production_go: false
  mock_pay:
    gate: P3_CHAIN_OFF=1
    production: FORBIDDEN

ssot_refs:
  payment_architecture: registry/payment-architecture-classification.v1.yaml
  order_state_machine: crates/core/src/escrow.rs
  payment_path: docs/runbook/TT-B435-USER-WALLET-ESCROW-FEEROUTER-PAYMENT-PATH-001.md
  chain_architecture: docs/runbook/TT-CHAIN-ARCHITECTURE-AUDITABLE-SPEC.md
  market_escrow: docs/spec/94-自由市场-商家橱窗与旅行收购-链上托管技术规格.md
  scope_decision: docs/handbook/engineering/148-PI3-005-Production-Scope-Decision-Report.md
  gov_freeze_sepolia: docs/spec/governance-token/GOV-FREEZE-V2-SEPOLIA-BASELINE-FREEZE.md
  fundstack_spine: registry/protocol-convergence-deployments.v1.yaml

