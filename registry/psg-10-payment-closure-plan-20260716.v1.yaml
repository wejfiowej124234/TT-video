    - charter_boundary_frozen
    - cross_capability_boundary_matrix
    - owned_modules_index
    - governance_traceability
    - wbs_line_footnotes
    - gap_remediation_table
    - closure_waves
    - engineering_implementation
    - certification_handoff
    - exit_criteria
  closure_waves:
    wave_1: governance_definition
    wave_2: governance_implementation
    wave_3: governance_validation
  gap_remediation_columns:
    - gap_id
    - wbs
    - surface
    - closure_action
    - artifact_to_update
    - owner_capability
    - phase
    - code_change
  phase_enum:
    governance_definition: "Wave 1 · boundary · terminology · WBS · cross-reference"
    governance_implementation: "Wave 2 · inventory · matrix · registry · traceability"
    governance_validation: "Wave 3 · consistency check · governance exit"
    engineering_implementation: "API · FE · BE · DB · runtime · deploy · evidence — after governance exit"
    certification: "Gates · ②③ sign-off · CLOSED"
  exit_criteria_governance:
    - wave_1_governance_definition_complete
    - wave_2_governance_implementation_complete
    - wave_3_governance_validation_signed
    - cross_capability_boundary_matrix_published
    - owned_modules_index_in_matrix_row
    - governance_traceability_wbs_to_assets
    - no_new_ga_concepts
  exit_criteria_certification:
    - governance_exit_signed
    - engineering_implementation_gaps_met
    - cert_path_gate_pass_or_owner_written_accept

# ── Charter · frozen boundary (page one) ────────────────────────────
charter_boundary_frozen:
  psg_10_owns_execution_rail:
    - PSP (Stripe optional onboarding rail)
    - Payment Gateway
    - Payment Intent
    - Escrow Payment Flow
    - Settlement Execution (order payment rail)
    - Payment Webhook
    - Payment Ledger (payment events)
    - Payment Verification
  psg_10_never_owns:
    - Platform Admission Fee business rules
    - Revenue Policy
    - Pricing Policy
    - Platform Financial Registry
  ssot: registry/payment-architecture-classification.v1.yaml

# ── Three-way boundary matrix (PSG-10 · PSG-20 · PSG-09) ─────────────
cross_capability_boundary_matrix:
  purpose: "Fix Payment / Platform Financial / Web3 boundaries permanently"
  ssot_after_closure: registry/psg-10-payment-closure-plan-20260716.v1.yaml#cross_capability_boundary_matrix
  rows:
    - topic: Core trip/market payment
      psg_10: "Escrow USDC deposit→release · mock-pay ① · G3-02 ③"
      psg_20: "—"
      psg_09: "Escrow contract · FeeRouter · chain events · indexer projection"
      ledger_ssot: "Chain + indexer (not PG payment_events)"
    - topic: Optional Stripe onboarding checkout
      psg_10: "Stripe PSP · payment-intents · webhooks · onboarding_payment_events"
      psg_20: "Admission fee amount · pricing · destination Platform Safe · revenue classification"
      psg_09: "—"
      ledger_ssot: "onboarding_payment_events (PG)"
    - topic: USDC admission fee (default path)
      psg_10: "Wallet transfer rail to OnboardingFeeReceiver / Platform Safe path"
      psg_20: "fee_schedule_v1 · onboarding-fee-schedule · Platform Safe registry"
      psg_09: "On-chain receiver / indexer onboarding_fee_paid events"
      ledger_ssot: "Split — PG events + chain indexer"
    - topic: Settlement (term disambiguation)
      psg_10: "Order escrow release · FeeRouter distribute · payment_deadline state machine"
      psg_20: "Platform commercial revenue settlement to Platform Operating Treasury"
      psg_09: "On-chain FeeRouter execution · protocol treasury_safe (≠ Platform Safe)"
      rule: "Never use 'settlement' without prefix: order_settlement | platform_revenue_settlement | protocol_treasury_settlement"
    - topic: Payment verification / Production GO
      psg_10: "G3-02 · PAY-W01..W16 · web3-payment-production-gate"
      psg_20: "PF Entry · Platform Safe Step 4/5 · admission fee staging"
      psg_09: "TT-WEB3-ACTIVE-EXECUTION-MATRIX · Reality Certification"
      cert_paths: "PSG-10 OUT_OF_PSG_RUNNER · PSG-20 PF Entry · PSG-09 PARALLEL"
    - topic: Wallet connect / signing
      psg_10: "— (consumes)"
      psg_20: "—"
      psg_09: "—"
      psg_11: "Wallet UI · approve · deposit UX"
      note: "PSG-11 dependency · not PSG-10 owner"

settlement_term_traceability:
  closure_action: "Add disambiguation table to payment-architecture-classification.v1.yaml amendment (docs-only cross-ref in closure wave 1)"
  forbidden_ambiguous: settlement
  required_prefixes:
    order_settlement: "PSG-10 · escrow release · FeeRouter order rail"
    platform_revenue_settlement: "PSG-20 · Platform Safe → Operating Treasury"
    protocol_treasury_settlement: "PSG-09 · treasury_safe / Timelock spend"

stripe_rail_vs_policy_split:
  closure_action: "Publish rail/policy table in owned_modules_index and WBS 10.1 footnote"
