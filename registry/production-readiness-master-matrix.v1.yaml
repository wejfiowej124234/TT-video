closure_plan:
  production_go_rule: G1 PASS + G2 PASS + G3 PASS → Production GO
  waves:
    - wave: "1.1"
      go_gate: G1
      title: Browser UAT + Manual Validation (G1 active)
      domains: [browser_uat, manual_validation]
      content_readiness_note: >
        Community local G1 PASS · Runtime Truth P0 CLOSED · G1 Reality Audit closed B005/B006/MVAL-B002
      execute: bash scripts/dev/run-production-readiness-wave-1-1-g1.sh
      gaps:
        - PRM-UAT-B001
        - PRM-UAT-B002
        - PRM-UAT-B003
        - PRM-UAT-B004
        - PRM-MVAL-B001
        - PRM-MVAL-B003
    - wave: "2"
      go_gate: G2
      title: Production Hardening
      domains: [security, performance, monitoring]
      gaps:
        - PRM-SEC-B001
        - PRM-SEC-B002
        - PRM-PER-B001
        - PRM-MON-B001
    - wave: "3"
      go_gate: G3
      title: Production Cutover + Go Live
      domains: [stripe_live, domain_cdn, disaster_recovery, deployment]
      gaps:
        - PRM-STR-B001
        - PRM-DOM-B001
        - PRM-DR-B001
        - PRM-DR-B002
        - PRM-MVAL-B004
      final_audit: bash scripts/dev/run-phase3-production-go-audit.sh

