# Official Cold Start Dataset (OCS) · SSOT
# Runbook: docs/runbook/TT-OFFICIAL-COLD-START-DATASET.md
# Orchestrator: scripts/dev/run-official-cold-start-dataset.cjs

schema: traveltrust.official_cold_start_dataset.v1
version: 1
effective_utc: "2026-07-03"

machine_keys:
  TT_OFFICIAL_COLD_START_DATASET: CLOSED
  TT_OFFICIAL_COLD_START_RERUN_POLICY: CLOSED_UNLESS_TOUCHED
  TT_OFFICIAL_COLD_START_RUNBOOK: docs/runbook/TT-OFFICIAL-COLD-START-DATASET.md
  TT_OFFICIAL_COLD_START_MANIFEST: data/official-cold-start/dataset.v1.json
  TT_OCS_OFFICIAL_ASSETS_MANIFEST: data/official-cold-start/assets.v1.json
  TT_OCS_OFFICIAL_ASSET_BASELINE: V1

principles:
  - no_smoke_demo_probe_multi_demo_content
  - no_direct_sql_insert_for_public_catalog
  - all_publish_via_admin_public_operations
  - data_origin_production_at_publish
  - public_catalog_only_compliant
  - ddg_fe_api_ml_dg_safe
  - reusable_staging_and_production_baseline
  - single_official_public_catalog_policy
  - official_catalog_identity_immutable
  - operations_workflow_lifecycle
  - ocs_surface_expansion_not_separate_products
  - single_public_surface_manifest_ssot

# ── OCS 唯一真源 · Surface Expansion（非 Community Phase · 非独立冷启动）────────

ocs_architecture:
  single_source: Official Cold Start (OCS)
  expansion_label: OCS Surface Expansion
  alias: [Official Surface Expansion]
  forbidden_naming:
    - Community Cold Start
    - community-cold-start manifest
    - TT Community Cold Start Campaign
    - Phase 1.5 Community Surface
    - Community Admin
  consumption_surfaces:
    home: [home_hero, home_feed]
    market: [provider, guide, acquisition, market_feed, market_provider, market_acquisition]
    community: [community_feed, community_featured, community_explore, official_profile]
    destination: [destination_hub]
    campaign: [campaign_banner, landing_promo]
    guide: [official_guide, guide_catalog]
  unified_campaign:
    name: Official Cold Start Campaign
    surfaces:
      - home_hero
      - home_feed
      - market_feed
      - market_provider
      - market_acquisition
      - community_feed
      - community_featured
      - campaign_banner
      - landing_promo
    note: One campaign · many surfaces — not per-surface products

single_public_surface_manifest_principle:
  rule: >
    Any Public Surface MUST NOT have an independent official content source.
    All official content MUST originate from the OCS Manifest
    (data/official-cold-start/dataset.v1.json + state.json).
  surfaces:
    - home
    - community
    - market
    - explore
    - destination_hub
    - campaign
    - guide
    - provider
  forbidden_independent_sources:
    - community seed scripts as ②③ public path
    - community showcase env
    - community cold start manifest
    - parallel official dataset files

community_feed_policy:
  sole_source: Official Cold Start Dataset
  manifest_item: chains[].community_post
  orchestrator: scripts/dev/run-official-cold-start-dataset.cjs
  forbidden:
    - Community Seed
    - Community Showcase
    - Community Cold Start
    - community-cold-start.v1.json
    - TRAVELTRUST_COMMUNITY_PUBLIC_SHOWCASE on staging/prod
    - seed_community_public_showcase.rs as public catalog path
    - frontend communityShowcase production fallback
  admin_model: Official Operations · Community Surface tab — not Community Admin product

official_identity:
  model: Official Account per chain region (manifest-driven slug)
  unified_across: [official_guide, community_post, provider, acquisition, campaign_item]
  orchestrator_chain_order:
    - Official Identity (ops_accounts)
    - Guide
    - Provider
    - Acquisition
    - Official Guide
    - Community Post
    - Campaign
  profile_consistency: Community profile · Guide · Market listing share same author_account where manifest binds

surface_expansion:
  role: Extend OCS manifest items to additional Public Surfaces — no Platform/Registry/Builder
  destination_hub:
    current: destination_count aggregate
    target: destination_hub
    aggregates_per_destination_slug: [official_guide, community_post, provider, acquisition, campaign]
    example_tokyo: [Guide, Community, Provider, Campaign]
    reuse: [web_explore, future_mobile_app]
  manifest_only:
    fields: [canonical_key, destination_slug, priority, surfaces, post_type, body_markdown, tags, cover_url, media_urls, author_account_slug]
    rule: Ops edits manifest — no code change for copy/surface/priority/cities

manifest_extension:
  ssot_file: data/official-cold-start/dataset.v1.json
  assets_manifest: data/official-cold-start/assets.v1.json
  forbidden_second_manifest: true
  items:
    - guide
    - provider
    - acquisition
    - official_guide
    - community_post
    - campaign_item_refs
  community_surfaces:
    feed: { surface: community_feed, source: chains[].community_post }
    featured: { surface: community_featured, source: chains[].community_post, selector: priority_or_manifest_surfaces }
    explore: { mode: destination_hub, key: destination_slug }

operations_admin:
  hub: /admin/official
  product_name: Admin Official
  modules:
    - Guide
    - Provider
    - Market
    - Campaign
    - Community Surface
  community_surface:
    status: ocs_surface_expansion
    path: /admin/official/public-operations
    entity_types: [community_posts, guide_posts, market_listings, guides, campaigns]
    note: Community is a publish Surface under Official Ops — not a separate admin product

staging_verification:
  label: OCS Surface Expansion · Staging operational acceptance
  machine_key: TT_OCS_SURFACE_EXPANSION
  official_asset_baseline:
    version: V1
    machine_key: TT_OCS_OFFICIAL_ASSET_BASELINE
    assets_manifest: data/official-cold-start/assets.v1.json
    generate: scripts/dev/generate-ocs-official-media-assets.cjs
    bootstrap: scripts/dev/bootstrap-ocs-official-assets.cjs
    verify: scripts/dev/verify-ocs-official-assets.cjs
    shell: scripts/dev/run-ocs-official-asset-baseline.sh
    bind_remediation: scripts/dev/remediate-ocs-official-media-bindings-staging.cjs
    docker_bundle: data/official-cold-start/media → data/community_post_media
  publish_gate_dimensions:
    - METADATA
    - ASSET
    - GOVERNANCE
    - SURFACE
    - VERIFICATION
  publish_gate_rule: all five dimensions PASS before publish
  status_machine:
    current: VERIFIED
    allowed: [IMPLEMENTING, READY_FOR_STAGING_VERIFICATION, VERIFIED]
    verified_only_when: all_10_acceptance_pass_and_independent_staging_signoff
  defaults:
    ocs_strict_legacy_media: "1"
  shell: scripts/dev/run-ocs-surface-expansion-staging.sh
  validator: scripts/dev/validate-ocs-surface-expansion-staging.cjs
  evidence_root: evidence/GO_official_cold_start_dataset/ocs-surface-expansion-staging
  independent_staging_evidence: true
  forbidden_substitution: [local_evidence, phase1_closed_evidence_without_rerun]
  execution_order:
    - deploy_api_web_staging
    - mark_READY_FOR_STAGING_VERIFICATION
    - run_official_cold_start_dataset_on_staging
    - validate_10_acceptance_checks
    - ddg_post_scan
    - write_signoff_only_if_VERIFIED
  destination_hub_round1:
    no_new_aggregate_api: true
    verify_only: [manifest destination_slug, post destination field, explore api-aggregate-v1]
    full_hub_deferred: post_g3
  required_acceptance_count: 11
  acceptance_checks:
    - id: OCS_MANIFEST
      label: 10 community_post from orchestrator not seed/SQL
    - id: OCS_SINGLE_SOURCE
      label: Feed official content only from OCS manifest state map
    - id: OFFICIAL_IDENTITY
      label: author_account_slug binds Official Account
    - id: PUBLIC_OPERATIONS
      label: Publish Unpublish Priority Featured Surface
    - id: SURFACE_CONSISTENCY
      label: Manifest surfaces priority campaign refs match Public Operations
    - id: COMMUNITY_FEED
      label: governed path zero leakage OCS visible
    - id: CAMPAIGN
      label: community_post item_ref without second source
    - id: DESTINATION
      label: destination_slug explore tokyo kyoto no Hub API
    - id: REVERSE_GOVERNANCE
      label: Unpublish hides Feed Explore Campaign
    - id: MEDIA
      label: OCS_STRICT_LEGACY_MEDIA=1 no Showcase Sample Legacy URLs
    - id: ASSET_VERIFICATION
      label: Official Asset Baseline V1 HEAD 200 MIME Content-Length decodable

official_asset_baseline_v1:
  version: V1
  status: ACTIVE
  machine_key: TT_OCS_OFFICIAL_ASSET_BASELINE
  assets_manifest: data/official-cold-start/assets.v1.json
  media_root: data/official-cold-start/media
  public_serve: GET /api/v1/uploads/community-posts/:name
  entity_coverage: [guide, provider, acquisition, official_guide, community_post, campaign]
  scripts:
    generate: scripts/dev/generate-ocs-official-media-assets.cjs
    bootstrap: scripts/dev/bootstrap-ocs-official-assets.cjs
    verify: scripts/dev/verify-ocs-official-assets.cjs
    orchestrate: scripts/dev/run-ocs-official-asset-baseline.sh
  publish_gate:
    dimensions: [METADATA, ASSET, GOVERNANCE, SURFACE, VERIFICATION]
    rule: all PASS before publish — no 404 placeholder legacy URLs on published official content
