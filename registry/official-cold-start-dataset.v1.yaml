    bootstrap_mode: fly_deploy_docker_copy
    content_l5_real_media: true
    bytes_parity: scripts/dev/check-ocs-staging-media-bytes-parity.cjs
    supersedes: evidence/GO_official_cold_start_dataset/ocs-official-asset-baseline/20260704T085638Z
    note: Content L5 真图 60/60 · staging HTTP bytes match local · post OCS L5 CLOSED rebootstrap

