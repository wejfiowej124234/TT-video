# Governance Phase Transition Registry v1
# Machine SSOT for Genesis → Public → Community exit thresholds.
# Docs MUST read thresholds here — do NOT hardcode TTG amounts in prose SSOT.
#
# Revision of numeric thresholds: GOV-02 governance proposal (not silent doc edit).

schema: traveltrust.governance_phase_transition.v1
version: 1
machine_key: TT_GOVERNANCE_PHASE_TRANSITION
effective_utc: "2026-07-12"
status: ACTIVE

total_supply_ttg: 10000000
token_allocation_bps_ref: docs/spec/governance-token/protocol-ssot.v1.yaml

genesis_exit:
  logic: AND
  description: >
    Genesis Governance Phase ends only when ALL gates below are satisfied.
    Prevents early exit when Round 3 closed but community voting supply is thin,
    or when voting supply is high but public rounds are not fully closed.
  gates:
    G-END-01:
      id: G-END-01
      rule: round3_primary_market_closed
      detail: Public bucket R1 + R2 + R3 all on-chain closed
      verify: TtgPrimaryMarketV1 round status + events
    G-END-02:
      id: G-END-02
      rule: public_governance_threshold_met
      detail: Active Voting Supply and public-bucket votable TTG meet thresholds below
      verify: Governor getPastVotes snapshot aggregate + primary market disclosure

public_governance_threshold:
  active_voting_supply_min_bps: 3500
  active_voting_supply_min_bps_of: TTG_TOTAL_SUPPLY
  public_bucket_votable_min_bps: 7500
  public_bucket_votable_min_bps_of: public_global_allocation
  notes:
    - active_voting_supply_min_bps 3500 = 35.00% of 10M at default registry values
    - public_bucket_votable_min_bps 7500 = 75.00% of public_global 20% bucket (2M) at default
    - Illustrative only — revise via GOV-02 + registry bump, not ad-hoc doc edits

community_governance:
  label: Community Governance / Mature DAO
  narrative_ref: docs/spec/governance-token/PUBLIC-GOVERNANCE-PHASE.md
  entry: progressive_as_country_ecosystem_dao_buckets_release
  no_single_hard_gate_in_v1: true

doc_refs:
  genesis: docs/spec/governance-token/GENESIS-GOVERNANCE-PHASE.md
  public: docs/spec/governance-token/PUBLIC-GOVERNANCE-PHASE.md
  consistency_audit: scripts/gates/run-governance-consistency-audit.sh
