        - .github/workflows/community-governance-gate.yml
        - .github/workflows/internal-drill-gate.yml
        - .github/workflows/ai-governance-gate.yml
    docs_areas:
      - docs/handbook/engineering/**/*.md
      - docs/runbook/**/*.md
    target_location: keep:docs/spec/04-后端与API.md
    migration_prerequisites:
      - 任何机读窗/表体变更须与 run-check-04-routes 串联同 PR（engineering/04、CONTRIBUTING 同源）
