# spec 路径依赖 registry · v1 草稿
# 政策：只登记；不迁移、不删除 docs/spec/（见 docs/spec-path-dependency-migration-inventory.md）
registry_version: "1.0-draft"
source_inventory: docs/spec-path-dependency-migration-inventory.md
updated: "2026-04-29"
classification_enum:
  A: 法定壳（须长期留在 docs/spec 或同路径兼容壳）
