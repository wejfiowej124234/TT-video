  frozen_utc: "2026-07-09T16:30:00Z"
  freeze_doc: docs/spec/governance-token/evidence/phase3-production-entry-baseline/FPC-GOVERNANCE-FREEZE-v5.md
  unlock: [P0_governance_defect, version_upgrade_v6_plus]
  execution_mode: ACTIVE
