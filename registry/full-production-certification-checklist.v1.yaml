# Certification ≠ Checklist: each item requires verdict + verifier + evidence + release eligibility.
# PER Round 1 remains valid; FPC-100 is superset full-site certification.

certification_model:
  distinction: >-
    Checklist asks "was it inspected?" Certification asks "did it PASS?", "who verified?",
    "what evidence?", "is release allowed?"
  five_layers:
    L1_page_coverage:
      question: Was every surface inspected (100% coverage)?
      scope:
        - frontend/app/**/page.tsx
        - frontend/app/**/layout.tsx
        - dynamic_route_segments
        - modals_drawers_dialogs_per_page
        - empty_states
        - error_pages_403_404_500
        - loading_tsx
      target: "202/202 pages + global not-found + global-error"
      matrix_json: docs/spec/governance-token/evidence/phase3-production-entry-baseline/FPC-100/FPC-100-PAGE-CERTIFICATION-MATRIX-LATEST.json
      scaffold_script: scripts/dev/scaffold-fpc-100-page-certification-matrix.cjs
      batches: [B00, B23]
    L2_per_page_l5_ux_ui:
      question: Does each page meet production-grade UI/UX/content/function?
      page_card_fields: [ui_score, ux_score, content_score, function_flow_score, layer2_ux_states, layer2_ui_dimensions, ux_certification, l5_dimensions_96_16]
      score_scale: "0-10 (null until verified)"
      production_ready_enum: [YES, NO, CONDITIONAL]
      rubric_ssot: docs/spec/96-16-全页面UI-UX优化方案总册.md
      walkthrough_ssot: docs/spec/96-13-UI-UX-i18n-a11y-性能走查.md
      batches: [B25-C1, B25-C2, B25-C3, B25-C4, B25-C5, B25-C6]
    L2_5_customer_experience:
      question: Does the real user know what to do next (not just pretty UI)?
      priority: P0
      per_page_fields:
        - user_goal
        - primary_cta
        - time_to_complete
        - cognitive_load
        - user_journey_score
      checks:
        - first_visit_next_step_clear
        - single_primary_cta
        - no_confusing_navigation
        - core_action_clicks_lte_3
        - loading_communicates_progress
        - error_states_actionable
      batches: [B26]
    L3_business_flows:
      question: Do end-to-end business paths work (not page-only)?
      flows: [guide, provider, acquisition, governance_participation, escrow_golden_path]
      registry: registry/business-flow-matrix.v1.yaml
      batches: [B05, B08, B10]
    L4_enterprise:
      question: Do cross-cutting enterprise gates PASS?
      dimensions: [seo, i18n, a11y, mobile, rbac, security, performance, observability, production_build]
      batches: [B01, B13, B14, B15, B16, B17, B18, B19, B20, B21, B22, B24]
    L5_operations_truth:
      question: Can we operate, trust data, recover, and prove content truth at production grade?
      sub_domains: [content_operations, data_lineage, api_contract, operations, lifecycle, recovery, truthfulness]
      batches: [B30, B31, B32, B33, B34, B35, B36]
      dashboard: docs/spec/governance-token/evidence/phase3-production-entry-baseline/FPC-100/FPC-100-RELEASE-DASHBOARD-LATEST.json
      dashboard_script: scripts/dev/refresh-fpc-100-release-dashboard.cjs
  l5_certification_domains:
    - id: cx
      layer: L2_5
      title: Customer Experience Certification
      priority: P0
      batch: B26
    - id: content_operations
      layer: L5
      title: Content Operations Certification
      priority: P0
      batch: B30
      ssot: data/catalog/cms-asset-matrix.v1.yaml
      checks: [announcements, country_ambient, banners, hero, images, videos, publish_state, seo, alt, i18n]
    - id: data_lineage
      layer: L5
      title: Data Lineage Certification
      priority: P0
      batch: B31
      chain: [db, api, projection, frontend, ui]
      per_page_field: layer5_operations_truth_per_page.data_lineage
    - id: api_contract
      layer: L5
      title: API Contract Certification
      priority: P0
      batch: B32
      methods: [GET, POST, PATCH, DELETE]
      contract_fields: [request, response, error, loading, empty]
      ssot: docs/spec/04-后端与API.md
      gates: [scripts/gates/run-check-04-routes.sh, scripts/gates/smoke-api-public-routes.sh]
    - id: operations
      layer: L5
      title: Operations Certification
      priority: P0
      batch: B33
      checks:
        - admin_publish_announcement
        - admin_unpublish_rollback
        - admin_review_approve
        - admin_disable_user
        - admin_content_suspend
        - admin_audit_logs_readable
      personas: [E1, E2]
    - id: lifecycle
      layer: L5
      title: Data Lifecycle Certification
      priority: P0
      batch: B34
      entities: [guide, community_post, provider_listing, campaign]
      stages: [create, review, publish, visible, archive, delete]
    - id: recovery
      layer: L5
      title: Recovery Certification
      priority: P0
      batch: B35
      failure_modes: [api_500, network_offline, cdn_fail, image_missing, wallet_timeout]
      per_page_field: layer5_operations_truth_per_page.recovery
    - id: truthfulness
      layer: L5
      title: Truthfulness Certification
      priority: P0
      batch: B36
      target_pct: 100
      forbidden: [mock, demo, placeholder, fake_data, todo, coming_soon]
      per_page_field: layer5_operations_truth_per_page.truthfulness
      traveltrust_note: Core differentiator — no fake surfaces on consumer paths
  ux_certification_rubric:
    ia_information_architecture: Unique nav · clear hierarchy · no dead ends
    cta_unique_primary: One primary CTA per viewport band where applicable
    l5_visual_quality: Token/spacing/typography per 22/86 · no draft chrome
    user_comprehension_cost: No engineering jargon · mock/demo labels · internal spec IDs
    industry_best_practice: Matches travel/marketplace/Web3 product norms
    production_grade_product_feel: Would ship to paying users without apology

local_ssot_anchor:
  commit: e9df0a73f63b5ebccc7c17266f000c3bf867d872
  branch: feature/g23-04-abi-event-freeze
  per_round1_exit: docs/spec/governance-token/evidence/phase3-production-entry-baseline/PER-ROUND1-EXIT.md
  local_freeze: true

human_ssot: docs/spec/governance-token/evidence/phase3-production-entry-baseline/FPC-100-PRE-RELEASE-DEEP-CHECKLIST-v1.md
runbook: docs/runbook/FPC-100-PRE-RELEASE-EXECUTION-PLAN-v1.md

phase_ladder:
  completed:
    - local_ssot
    - per_round1_exit
    - local_freeze_baseline_commit
  active: fpc_100_batch_execution
  next:
    - one_shot_staging_deploy
    - environment_diff
    - staging_fpc_recheck
    - production_entry_review

honest_boundary: >-
  FPC-100 PASS on ① local ≠ ② staging GO ≠ ③ Production GO.
  PER Round 1 Exit (15 CI closed) is prerequisite, not substitute for FPC-100 completion.
  VP-01..VP-09 map to Round 2 / FPC batches B14–B18 — not Round 1 Exit blockers.

verdict_enum: [NOT_STARTED, IN_PROGRESS, PASS, PASS_WITH_WARN, FAIL, BLOCKED, N/A, EXPIRED, INVALIDATED]
severity_enum: [P0, P1, P2, P3]
issue_class_enum: [DEFECT, DRIFT, CONFLICT, BLOCKING_RISK, NON_BLOCKING_RISK, EXPECTED_DIFFERENCE]

certification_governance:
  certification_freeze:
    enabled: true
    rule: >-
      Batch PASS → evidence frozen (certification_frozen=true). Any change to covered SSOT
      invalidates batch → must re-certify. Dashboard must not show PASS on STALE/INVALIDATED evidence.
    check_script: scripts/dev/check-fpc-certification-freeze.cjs
  evidence_expiry_days:
    performance: 30
    accessibility: 60
    security: 90
    anchor_meta: 30
    truthfulness: 30
    default: 90
  release_blocker:
    field: release_blocker
    enum: [YES, NO]
    rule: FAIL or release_blocker YES blocks TT_FULL_PRODUCTION_CERTIFICATION
  human_certification:
    field: human_verified
    required_for_batches: [B25-C1, B25-C2, B25-C3, B25-C4, B25-C5, B25-C6, B26, B10, B33, B35, B40, B41]
  evidence_coverage_targets:
    pages: 202
    api_contracts: 181
    business_corridors: 23
    rbac_probes: 102
  deployment_certification:
    batch: B40
    phase: [staging]
    chain: [deploy, health, meta_sha, environment_diff, rollback_probe]
  business_readiness:
    batch: B41
    checks: [logo, icp_if_applicable, privacy, terms, contact, ops_email, email_templates, cdn, domain, sitemap, robots, analytics]

version_certification:
  enabled: true
  registry: registry/fpc-100-version-registry.v1.yaml
  evidence_json: FPC-100/FPC-100-VERSION-CERTIFICATION-LATEST.json
  rule: Each product_version (v1.0, v1.1, …) gets independent FPC run + release_history row

change_impact:
  enabled: true
  map: registry/fpc-100-change-impact-map.v1.json
  script: scripts/dev/check-fpc-change-impact.cjs
  rule: Code change invalidates only mapped batches — not full-system PASS wipe

release_traceability:
  enabled: true
  chain: [requirement, spec, code, test, evidence, certification, release]
  batch_field: traceability
  template:
    requirements: []
    spec_refs: []
    code_paths: []
    tests: []
    evidence_path: null
    certification_batch: null
    product_version: null

ai_review:
  enabled: true
  batch_field: ai_review
  required_fields: [verdict, ai_reviewer, review_type, review_date, review_version]
  note: Do not record model slugs — use Internal AI Review + review_version for dashboard stability

release_decision:
  machine_key: TT_RELEASE_DECISION
  enum: [GO, NO_GO, CONDITIONAL_GO, NOT_STARTED]
  rules:
    GO: All pillars PASS · coverage 100% · no pending risks · no blockers · human+ai complete on required batches
    CONDITIONAL_GO: PASS with only ACCEPTED risks (no PENDING) · Owner sign-off recorded
    NO_GO: FAIL pillar · release_blocker YES · pending risk · expired evidence without re-cert

release_health_dashboard:
  metrics: [certified_pct, expired_count, blocked_count, accepted_risks_count, coverage_pct, human_verified_pct, ai_review_pct]
  script: scripts/dev/refresh-fpc-100-release-dashboard.cjs

batch_evidence_required_fields:
  - product_version
  - certified_at_utc
  - expires_at_utc
  - certification_frozen
  - frozen_at_utc
  - frozen_git_sha
  - release_blocker
  - human_verified
  - human_verifier
  - ai_review
  - traceability
  - verdict
  - pass

dashboard_pillars:
  technical: { batches: [B00, B11, B23, B24, B32], description: Code · API · coverage · regression }
  product: { batches: [B25-C1, B25-C2, B25-C3, B25-C4, B25-C5, B25-C6, B26], description: UI · UX · CX · pages }
  operations: { batches: [B33, B09], description: Admin ops · RBAC }
  content: { batches: [B30, B12], description: CMS · content ops }
  business: { batches: [B41], description: Business readiness · legal · brand }
  security: { batches: [B17], description: Security gates }
  performance: { batches: [B16], description: Build · CWV }
  truthfulness: { batches: [B36, B01], description: Mock-free · public surface }
  deployment: { batches: [B40], description: Staging deploy · diff · rollback }
  human_verification: { rule: all required_for_batches human_verified true }

