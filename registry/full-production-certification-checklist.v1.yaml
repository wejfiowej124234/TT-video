    - environment_diff_finds_drift
    - staging_only_issue
    - new_p0_p1_from_fpc_batch
  deploy_policy: one_shot_after_fpc_local_batches_or_owner_scope
  batch_gate: each_batch_must_record_evidence_before_next_batch

