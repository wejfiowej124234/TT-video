# Phase② OCS Content L5 · Content Engineering
# Content First, Code Frozen · 与 Runtime / PP / Production GO 分线
# Content Brief: data/official-cold-start/content-brief.v1.yaml
# Production Matrix: data/official-cold-start/content-production-matrix.v1.yaml
# Runbook: docs/runbook/TT-OCS-CONTENT-L5.md

schema: traveltrust.ocs_content_l5.v1
version: 1
effective_utc: "2026-07-04"
content_l5_version: 2.3.0

machine_keys:
  TT_OCS_CONTENT_L5: CLOSED
  TT_OCS_CONTENT_L5_EXECUTION: CLOSED
  TT_OCS_CONTENT_L5_READY: "YES"
  TT_CONTENT_PRODUCTION_MATRIX: PASS
  TT_CONTENT_BRAND_CONSISTENCY: PASS
  TT_OCS_CONTENT_L5_CONTENT_BRIEF: data/official-cold-start/content-brief.v1.yaml
  TT_OCS_CONTENT_L5_PRODUCTION_MATRIX: data/official-cold-start/content-production-matrix.v1.yaml
  TT_OCS_CONTENT_L5_RUNBOOK: docs/runbook/TT-OCS-CONTENT-L5.md
  TT_OCS_CONTENT_L5_EVIDENCE_ROOT: evidence/GO_official_cold_start_dataset/ocs-content-l5/

content_first_code_frozen:
  motto: Content First, Code Frozen
  quality_over_speed: >-
    宁可 60 张均达企业级标准，也不为赶进度降低任一张内容质量；
    每张图直接影响 TravelTrust 品牌第一印象，质量优先于速度。
  no_quality_regression: >-
    新增任何一张图片都必须保证整体质量不下降（No Quality Regression）：
    不仅当前行 PASS，还须让所有已完成行/城市继续保持 PASS；
    若新增内容导致全局风格、品牌、真实性或多样性下降，须返工当前行，
    禁止修改已完成内容去适配新图。
  principle: >-
    OCS Content L5 阶段禁止新增业务功能、禁止修改 Runtime、SSOT、API、DB、Catalog、Baseline、
    前端媒体链及治理框架；所有工作仅允许发生在 Content Brief、Content Production Matrix、
    dataset.v1.json、官方媒体资产（media/）及其对应验证 Evidence 中，以内容质量驱动阶段关闭。
  frozen:
    - runtime
    - ssot_technical
    - api
    - db
    - catalog
    - staging_rc_baseline
    - frontend_media_render_chain
    - governance_framework
  allowed_only:
    - content-brief.v1.yaml
    - content-production-matrix.v1.yaml
    - dataset.v1.json_copy_within_chain
    - data/official-cold-start/media/
    - ocs_content_l5_evidence
    - content_validation_scripts

