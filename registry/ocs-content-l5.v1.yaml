manifest_first_discipline:
  principle: Manifest First
  order:
    - update content-brief.v1.yaml
    - sync content-production-matrix.v1.yaml row(s)
    - sync dataset.v1.json copy within same chain
    - replace media/{filename} binary
    - row verify and evidence
  forbidden:
    - replace_staging_media_without_brief_update
    - edit_dataset_copy_without_brief_alignment
    - divergent_community_vs_provider_city_theme
    - batch_skip_row_verification
  runbook_anchor: docs/runbook/TT-OCS-CONTENT-L5.md#manifest-first

frozen_during_content_l5:
  - runtime_ssot
  - staging_rc_baseline
  - api_contract
  - db_schema
  - catalog_schema
  - frontend_render_chain
  - governance_chain
  - official_ops_control_plane_architecture

allowed_changes:
  - replace media binaries under data/official-cold-start/media/
  - copy edits within dataset.v1.json per chain (no schema change)
  - content-brief.v1.yaml maintenance
  - content-production-matrix.v1.yaml row status updates
  - evidence and content validation scripts
  - bootstrap deploy of replaced assets to staging

forbidden:
  - new_business_features
  - data_model_changes
  - frontend_media_chain_changes
  - parallel_content_upload_via_admin_as_ocs_ssot
  - claiming_runtime_go_as_content_l5_ready
  - claiming_content_l5_as_production_go
  - unsplash_or_placeholder_regeneration_via_generate_script_without_real_assets
  - manifest_first_violations
  - batch_matrix_close_without_per_row_evidence

acceptance_gates:
  - id: G1_real_assets
    label: 60/60 真图素材
    criterion: >-
      全部 assets.v1.json 文件为真实摄影/设计素材；非 hash 纯色块；
      verify-ocs-official-assets 60/60；单文件 >16KB 且可解码 JPEG；Production Matrix asset_status=verified
    weight: 12
  - id: G2_copy_alignment
    label: 图文一致
    criterion: >-
      每 chain 抽检：copy_mapping / copy_label 与画面同城同主题；零「巴黎图+东京文案」
    weight: 12
  - id: G3_slot_differentiation
    label: 6 Slot 差异化
    criterion: >-
      每 chain 6 张视觉可区分；违反 content-brief no_duplicate_with 为 FAIL
    weight: 12
  - id: G4_cross_surface_city
    label: 跨 Surface 城市主题一致
    criterion: >-
      Community/Provider/Guide/Acquisition/Campaign refs 同城同主题；Campaign 继承 slot 不新增文件
    weight: 8
  - id: G5_brand_visual
    label: 品牌视觉统一
    criterion: >-
      暖色旅行纪实；与 L5 深壳+ref-sun 协调；无 watermark/无关 stock
    weight: 8
    contributes_to: TT_CONTENT_BRAND_CONSISTENCY
  - id: G6_commercial_perception
    label: 真实商业平台观感
    criterion: >-
      Staging 公面 UAT：用户盲测「像真实产品」≥8/10 城；Reveal 正常；非色块墙
    weight: 12
  - id: G7_wcag_visual
    label: WCAG 与视觉质量
    criterion: >-
      主体可辨；无图内大段文字；对比度/裁剪安全区满足 masonry 与 a11y alt 可读
    weight: 8
  - id: G8_evidence_matrix
    label: Evidence + 评分矩阵归档
    criterion: >-
      Content Production Matrix 60 行全填；每行 row evidence；维度分归档
    weight: 8
  - id: G9_content_authenticity
    label: Content Authenticity（内容真实性）
    criterion: >-
      每张图符合对应城市、场景、业务角色；禁止明显地理/角色错误、AI 明显失真、
      版权风险素材、与品牌定位冲突画面；人工+矩阵 review_status=pass
    weight: 10
    contributes_to: TT_CONTENT_BRAND_CONSISTENCY
  - id: G10_content_diversity
    label: Content Diversity（一致性与多样性平衡）
    criterion: >-
      同 chain 6 Slot 覆盖不同场景类型（地标/街景/体验/产品/人物等）；
      禁止仅换角度或色调造成视觉重复；跨 Surface 浏览有新鲜感且品牌统一
    weight: 10
    contributes_to: TT_CONTENT_BRAND_CONSISTENCY

scoring:
  content_production_matrix_file: data/official-cold-start/content-production-matrix.v1.yaml
  dimensions:
    - G1_real_assets
    - G2_copy_alignment
    - G3_slot_differentiation
    - G4_cross_surface_city
    - G5_brand_visual
    - G6_commercial_perception
    - G7_wcag_visual
    - G8_evidence_matrix
    - G9_content_authenticity
    - G10_content_diversity
  scale: 0-100 per dimension
  l5_score:
    formula: weighted_mean_of_dimensions
    ready_threshold:
      min_total: 85
      min_per_dimension: 75
      all_gates: PASS
  brand_consistency:
    machine_key: TT_CONTENT_BRAND_CONSISTENCY
    pass_when: G5_pass AND G9_pass AND G10_pass AND min_dimension_score_75

phase_closure:
  required_machine_keys:
    TT_OCS_CONTENT_L5: CLOSED
    TT_OCS_CONTENT_L5_READY: "YES"
    TT_CONTENT_PRODUCTION_MATRIX: PASS
    TT_CONTENT_BRAND_CONSISTENCY: PASS
  note: 四键同批成立 · 禁止仅以 TT_OCS_CONTENT_L5_READY 单键解闸 Production Preparation

