  status: CLOSED
  closed_utc: "20260704T155000Z"
  closure_evidence: evidence/GO_official_cold_start_dataset/ocs-content-l5/20260704T155000Z/OCS-CONTENT-L5-CLOSED.json
  l5_score: 93.5
  mode: row_by_row
  discipline: no_batch_skip
  progress:
    matrix_rows_total: 60
    matrix_rows_verified: 60
    matrix_rows_review_pass: 60
    last_completed_row: ocs-dubai-luxury-community-media.jpg
    chains_closed: 10
    current_chain: dubai-luxury
    current_chain_progress: "6/6 CLOSED"
    next_matrix_row: null
    last_milestone_review: evidence/GO_official_cold_start_dataset/ocs-content-l5/OCS-CONTENT-L5-OFFICIAL-CONTENT-LIBRARY-MILESTONE-60of60.REVIEW.json
    final_production_content_audit: evidence/GO_official_cold_start_dataset/ocs-content-l5/OCS-CONTENT-L5-FINAL-PRODUCTION-CONTENT-AUDIT-60of60.REVIEW.json
    brand_consistency_review: evidence/GO_official_cold_start_dataset/ocs-content-l5/OCS-CONTENT-L5-BRAND-CONSISTENCY-60of60.REVIEW.json
    closure_bundle: evidence/GO_official_cold_start_dataset/ocs-content-l5/20260704T155000Z/
  execution_discipline:
    frozen_nine_class_framework: true
    no_tenth_review_class: true
    per_row: Row Review + G1-G10 + nine-class + Global Regression
    per_city_chain_6_rows: City Chain Final Review
    global_milestone_rows: [24, 36, 48, 60]
    global_milestone_label: Global Official Content Library Milestone Review
    optional_sample_regression_every_12_rows: true
    final_60_of_60: Final Production Content Audit
    generation_quality_gates:
      content_safety_pre_check: Prompt 生成前审查，避免可识别名画/Logo/版权作品/名人肖像/未授权艺术品特写
      post_generation_technical: 生成后确认 JPEG 可解码、640x480、>16KB、非占位图（Row32 教训）
      business_semantic: 是否符合当前 Surface 职责（九类专项内执行，非第十类）
      country_authenticity: FR/JP/KR 等国家元素隔离
      global_regression: 新增行不得导致已完成行质量下降
  destination_experience_review_policy: >-
      每行 Community Media 及关键 Consumer Surface 须含 destination_experience_review，
      评估是否真实体现目的地旅行体验、用户价值、商业吸引力与城市特色。
  country_consistency_review_policy: >-
      每个新 country/chain 首行（Guide Avatar）须输出 country-consistency-{chain_id}.REVIEW.json，
      锁定该国文化主题在后续 6 Slot 及未来同国内容中统一，禁止与其他国家文化混用。
  user_experience_review_policy: >-
      每行 Community Cover/Media 及关键 Consumer Surface 须含 user_experience_review，
      从 Feed 首屏吸引力/点击意愿/缩略图识别度等维度评估，避免技术合格但缺乏点击欲望。
  cross_chain_review_policy: >-
      每完成新 city chain 首行 Acquisition 或 chain 3/6 里程碑时，
      与已 CLOSED chain 执行 cross-chain review，避免城市内容同质化。
  global_consistency_review_policy: >-
      每完成 10 行 Matrix（或每 city chain 里程碑）输出
      OCS-CONTENT-L5-GLOBAL-CONSISTENCY-{N}of60.REVIEW.json，
      检查重复/语义冲突/品牌漂移等全局风险。
  global_regression_review_policy: >-
      每完成新 Matrix 行（尤其 Provider/Guide 等身份敏感 slot）须输出
      OCS-CONTENT-L5-GLOBAL-REGRESSION-{N}of60.REVIEW.json：
      自动复核全部已完成行，检查人物撞脸、构图重复、色调同质化、城市辨识度、
      商业定位、品牌一致性、Consumer Experience、六类专项审核是否仍 PASS；
      新增行不得导致已完成内容回归（No Quality Regression）。
  content_portfolio_review_policy: >-
      第七类专项审核 Content Portfolio Review：每完成新 Matrix 行须把全部 verified 行
      作为 Official Content Library 整体审核（10 项固定检查）；
      脚本：run-ocs-content-l5-content-portfolio-review.cjs --visual-pass --trigger-filename <file>
      输出 OCS-CONTENT-L5-CONTENT-PORTFOLIO-{N}of60.REVIEW.json；
      仅 Portfolio PASS 且 No Quality Regression 才允许下一行。
  surface_boundary_review_policy: >-
      第八类专项审核 Surface Boundary Review：每行须确认素材仅表达所属 Surface 语义，
      禁止 Guide/Provider/Acquisition/Official Guide/Community 职责混用；
      脚本：run-ocs-content-l5-surface-boundary-review.cjs --filename <file> --visual-pass
  visual_sequence_review_policy: >-
      第九类专项审核 Visual Sequence Review（最终类 · 框架冻结为 9 类不再扩展）：
      连续浏览全库时无构图/色调/主体/镜位/光线/节奏/视觉重心重复；
      脚本：run-ocs-content-l5-visual-sequence-review.cjs --filename <file> --visual-pass
  nine_class_review_framework_frozen: true
  destination_authenticity_review_policy: >-
      每行在完成 G1–G10、Cross-Chain、Global Consistency 之后，必须执行
      Destination Authenticity Review：核查建筑/街景/服饰/语言/交通/自然/饮食/商业/文化元素
      全部属于当前城市与国家；禁止跨国家/文化/城市混用；并对照 Manifest 全字段 100% 对齐。
      脚本：run-ocs-content-l5-destination-authenticity-review.cjs --filename <file> --visual-pass
  guide_identity_diversity_review_policy: >-
      所有 guide-avatar 行（及后续含真人主体的 portrait slot）须执行 Guide Identity Diversity Review：
      不同城市 Guide 不得高度撞脸；年龄层/性别/发型/脸型/气质须有明显区别；
      职业形象符合当地文化；连续浏览多城不会误认同一位向导。
      脚本：run-ocs-content-l5-guide-identity-diversity-review.cjs --filename <file> --visual-pass
  provider_business_identity_review_policy: >-
      所有 provider-cover 行须执行 Provider Business Identity Review：
      不同城市 Provider 不得呈现同一商业空间/装修风格/经营模式或高度相似品牌气质；
      须体现当地特色业态与服务体验；连续浏览多城不会误认同一家商户。
      脚本：run-ocs-content-l5-provider-business-identity-review.cjs --filename <file> --visual-pass
  acquisition_product_identity_review_policy: >-
      所有 acquisition-cover 行须执行 Acquisition Product Identity Review：
      代购/悬赏商品须具明确本地特色与业务语义；不得与 Guide/Provider/Community/Official Guide
      主体或场景混用；跨城 Acquisition 商品不得高度相似。
      脚本：run-ocs-content-l5-acquisition-product-identity-review.cjs --filename <file> --visual-pass
  official_guide_destination_review_framework: >-
      official-guide-cover 行须执行 Official Guide Destination Review（框架已建立，Row 16 起判定）：
      路线/地图封面语义、目的地表达、与其它 Surface 隔离。
      脚本：run-ocs-content-l5-official-guide-destination-review.cjs --emit-framework | --filename <file> --visual-pass
  community_authenticity_review_policy: >-
      community-cover / community-media 须执行 Community Authenticity Review（Row 17 起正式判定）：
      长期固定项含真实分享感、自然互动、Feed 可读性、情绪表达、UGC 非商业海报；
      禁止与其它 Surface 语义混用；Cover 与 Media 须不同场景。
      脚本：run-ocs-content-l5-community-authenticity-review.cjs --filename <file> --visual-pass
  city_chain_final_review_policy: >-
      每完成一个城市 6/6 verified+pass，输出 chains/{chain_id}-chain-FINAL.REVIEW.json
      与 City Content Score；须含 Chain Narrative Continuity、Visual Diversity、
      City Brand Identity、Consumer Experience 四闸；再进入下一城市 Matrix 行。
  per_row_workflow:
    - manifest_first_brief_and_matrix
    - replace_media_binary
    - sync_dataset_copy_if_needed
    - row_verify_script
    - destination_authenticity_review
    - guide_identity_diversity_review
    - provider_business_identity_review
    - acquisition_product_identity_review
    - update_matrix_status
    - append_row_evidence
  row_verify_script: scripts/dev/run-ocs-content-l5-row-verify.cjs
  destination_authenticity_script: scripts/dev/run-ocs-content-l5-destination-authenticity-review.cjs
  guide_identity_diversity_script: scripts/dev/run-ocs-content-l5-guide-identity-diversity-review.cjs
  provider_business_identity_script: scripts/dev/run-ocs-content-l5-provider-business-identity-review.cjs
  acquisition_product_identity_script: scripts/dev/run-ocs-content-l5-acquisition-product-identity-review.cjs
  official_guide_destination_review_script: scripts/dev/run-ocs-content-l5-official-guide-destination-review.cjs
  community_authenticity_review_script: scripts/dev/run-ocs-content-l5-community-authenticity-review.cjs
  content_portfolio_review_script: scripts/dev/run-ocs-content-l5-content-portfolio-review.cjs
  surface_boundary_review_script: scripts/dev/run-ocs-content-l5-surface-boundary-review.cjs
  visual_sequence_review_script: scripts/dev/run-ocs-content-l5-visual-sequence-review.cjs
  row_complete_script: scripts/dev/run-ocs-content-l5-row-complete.cjs
  execution_open_evidence: evidence/GO_official_cold_start_dataset/ocs-content-l5/OCS-CONTENT-L5-EXECUTION-OPEN-20260704T121500Z.json

