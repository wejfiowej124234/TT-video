  per_row:
    - node scripts/dev/run-ocs-content-l5-row-verify.cjs --filename <ocs-*.jpg>
    - node scripts/dev/run-ocs-content-l5-destination-authenticity-review.cjs --filename <ocs-*.jpg> --visual-pass
    - node scripts/dev/run-ocs-content-l5-row-complete.cjs --filename <ocs-*.jpg> --asset-status verified --review-status pass
  content_alignment:
    - node scripts/dev/validate-ocs-content-l5-brief.cjs
    - node scripts/dev/generate-ocs-content-production-matrix.cjs --preserve-status
    - node scripts/dev/validate-ocs-content-production-matrix.cjs
  content_closure:
    - node scripts/dev/validate-ocs-content-production-matrix.cjs --require-ready
    - node scripts/dev/run-ocs-content-l5-closure-pack.cjs
  production_prep_entry:
    - bash scripts/dev/run-ocs-content-l5-production-prep-entry.sh
    - node scripts/dev/check-ocs-staging-media-bytes-parity.cjs
  asset_technical:
    - bash scripts/dev/run-ocs-official-asset-baseline.sh
    - node scripts/dev/verify-ocs-official-assets.cjs
  staging_deploy:
    - DEPLOYMENT_STATE=fix bash scripts/dev/phase2-staging-fly-deploy-and-sync.sh

downstream_unblock:
  when_all:
    TT_OCS_CONTENT_L5: CLOSED
    TT_OCS_CONTENT_L5_READY: "YES"
    TT_CONTENT_PRODUCTION_MATRIX: PASS
    TT_CONTENT_BRAND_CONSISTENCY: PASS
  then:
    - production_preparation: may_enter
    - registry_update: staging-rc-baseline.v1.yaml lifecycle production_preparation

honest_boundary: >-
  ② OCS Content L5 CLOSED ≠ ③ Production GO；
  Content First Code Frozen 不等于禁止 bootstrap/verify 脚本 — 仅禁止业务代码与 Runtime 变更。
