incident_trees:
  - id: INC-LOGIN
    symptom: 登录不了
    locate_first: [L3, L2, L4, L5]
    tree: |
      POST /auth/login ?
       ├─ 401 → Credential / Account (L5) — Staging seed on Production = invalid_credentials
       ├─ 404/405 → Route (L3) — historical Next page POST 405 SUPERSEDED 2026-08-15
       ├─ 5xx → API runtime (L3/L4) or Proxy (L2)
       └─ 200
            ↓
      Cookie / token persisted?
       ├─ no → Cookie / Edge / Browser (L0/L1)
       └─ yes HttpOnly traveltrust_session (GAP-SEC CLOSED)
            ↓
      GET /api/v1/me ?
       ├─ 401 → Session (L4)
       ├─ 403 → RBAC (L5)
       ├─ 503 → Proxy / upstream / pause (L2/L4)
       └─ 200
            ↓
      UI still anonymous?
       └─ Hydration / client state (L0)
    evidence: docs/runbook/TT-AUTH-SESSION-RUNTIME-TRACE-LATEST.md
  - id: INC-403
    symptom: 已登录但 403
    locate_first: [L5, L4]
    tree: |
      GET /me 200?
       ├─ no → GP-01 first
       └─ yes → capability / admin RBAC / role slot (L5)
  - id: INC-404-405
    symptom: 404 / 405
    locate_first: [L3, L2]
    tree: |
      Hitting Next page or API origin?
       ├─ Next /auth/login POST → historical 405 SUPERSEDED; live 200 Session/BFF
       ├─ missing Axum route → 404 (L3)
       └─ rewrite dest wrong → L2
  - id: INC-418
    symptom: 418
    locate_first: [L4]
    tree: |
      Not an observed Official code today.
      Pause is 503 api_paused (PAUSE_MODE=1).
      If 418 appears → treat as unknown L4/L3 contract drift; do not invent a handler.
  - id: INC-429
    symptom: 429
    locate_first: [L4, L1]
    tree: |
      Edge rate vs API rate_limit_layer vs onboarding quote/write limit.
      Read Retry-After. Do not raise limits as a first fix.
  - id: INC-500-503
    symptom: 500 / 503
    locate_first: [L2, L4, L6]
    tree: |
      503 api_unavailable / api.example.com → L2 proxyTraveltrustApi
      503 api_paused → L4 pause_gate
      503 chain_off / database_unavailable → L6
      500 → L3/L5 panic or unhandled domain error
  - id: INC-DB-DRIFT
    symptom: DB drift
    locate_first: [L6]
    tree: |
      migrations applied?
      session/user row exists?
      projection table vs handler query mismatch?
      Do not "fix" by reseeding until L3/L4/L5 are ruled out.
  - id: INC-INDEXER-LAG
    symptom: 链上成功但页面没更新
    locate_first: [L7, L8, L3, L0]
    tree: |
      Receipt status=1? (L7)
       ↓
      Indexer checkpoint >= tx block? (L8)
       ├─ no → ingestion lag/stall
       └─ yes
            ↓
      event projection exists?
       ├─ no → ABI / filter / address
       └─ yes
            ↓
      API returns projection? (L3)
       ↓
      UI renders? (L0)
  - id: INC-CHAIN-TX-FAIL
    symptom: Chain tx fail
    locate_first: [L7]
    tree: |
      Receipt status=0 / revert → L7 (allowlist, pause, cap, USDC, Timelock ETA).
      Do not patch Indexer or UI to fake success.

