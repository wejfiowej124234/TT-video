layers:
  - id: L0
    name: Client / Consumer
    question: Who initiated the request?
    children: [Web, Future App, Admin Console, Automation / Runner, Wallet]
  - id: L1
    name: Edge / Network
    question: Did the packet reach origin?
    children: [DNS, Cloudflare, TLS, Fly ingress, CORS, timeout / rate edge]
  - id: L2
    name: BFF / Proxy / Origin Routing
    question: Did same-origin bridge hit the right API base?
    children: [Next rewrite, proxyTraveltrustApi, SITE_URL, API_BASE_URL, same-origin bridge]
  - id: L3
    name: API Surface / Contract
    question: Does the route exist and match 04?
    children: [/auth/*, /me, /admin/*, /orders, /community, /governance, /meta, /health]
  - id: L4
    name: Request Control / Middleware
    question: Was the request gated before domain logic?
    children: [Session gate, Bearer, Idempotency, Rate limit, Pause, Headers, validation]
  - id: L5
    name: Identity / Authorization / Domain
    question: Who is the actor and which business rule fired?
    children: [user identity, roles, capabilities, admin RBAC, domain service, order state machine, business rules]
  - id: L6
    name: Persistence / Internal Data
    question: What did we store off-chain?
    children: [PostgreSQL, migrations, sessions, CMS metadata, catalog, configuration, object metadata]
  - id: L7
    name: Web3 Runtime / Money Path
    question: What actually happened on chain?
    children: [RPC, Escrow, Settlement, FeeRouter, PrimaryMarket, Seat Registry, Region Vault, P4Cap, Governor, Timelock]
  - id: L8
    name: Projection / Runtime Truth / Release
    question: Did the product observe, project, and prove L7?
    children: [Indexer, checkpoint, event projection, Registry, /meta, build identity, FTB, Evidence, Hard Gate, TT_PRODUCTION_GO]

