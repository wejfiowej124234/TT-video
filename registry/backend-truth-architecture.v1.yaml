golden_paths:
  - id: GP-01
    name: Login / Session
    layers: [L0, L1, L2, L3, L4, L5, L6]
    hops:
      - POST /auth/login (API origin, not Next page)
      - persist token / cookies
      - GET /api/v1/me via proxy
      - RBAC / UI identity
    frontend_actions: [AUTH.LOGIN.SUBMIT, AUTH.SESSION.HYDRATE]
  - id: GP-02
    name: Community Write
    layers: [L0, L2, L3, L4, L5, L6]
    hops:
      - POST /api/v1/community/posts/:id/comments
      - Idempotency-Key
      - ACL
      - posts/comments rows
    frontend_actions: [COMMUNITY.COMMENT.REPLY, COMMUNITY.POST.CREATE]
  - id: GP-03
    name: Media Upload
    layers: [L0, L2, L3, L4, L5, L6]
    hops:
      - POST /api/v1/uploads/community-posts
      - object store
      - object metadata
      - GET /api/v1/media/access/*
    frontend_actions: [COMMUNITY.MEDIA.UPLOAD]
  - id: GP-04
    name: Order → Escrow
    layers: [L0, L3, L4, L5, L6, L7, L8]
    hops:
      - POST /api/v1/itineraries or /itineraries/custom (homepage AI / custom draft)
      - POST /api/v1/guides (guide must exist)
      - POST /api/v1/orders
      - state machine
      - EscrowFactoryV2Wired.createEscrow
      - Indexer projection
      - GET /api/v1/orders/:id
    frontend_actions: [HOME.ITINERARY.CREATE, GUIDES.LIST.VIEW, ORDERS.CREATE.SUBMIT, ESCROW.OPEN]
  - id: GP-05
    name: Settlement → Fee
    layers: [L5, L6, L7, L8]
    hops:
      - release rules
      - SettlementRouter
      - FeeRouter
      - USDC conservation
      - Indexer checkpoint ≥ tx block
    frontend_actions: [ESCROW.RELEASE.SUBMIT]
  - id: GP-06
    name: USDC → TTG
    layers: [L0, L3, L5, L7, L8]
    hops:
      - Homepage quote
      - GET /api/v1/governance/ttg-exchange/quote
      - wallet
      - PrimaryMarket proxy / impl
      - USDC
      - P4Cap
      - TTG inventory
      - Purchase event
      - Indexer
      - API / UI dual disclosure
    frontend_actions: [HOME.TTG_PURCHASE.SUBMIT]
  - id: GP-07
    name: Region Fee → Vault/P4Cap → Claim
    layers: [L5, L7, L8]
    hops:
      - Region fee
      - SettlementRouter
      - FeeRouter
      - SeatRegistry
      - RegionVault | P4Cap
      - Claim
    frontend_actions: [STEWARD.CLAIM.SUBMIT]
  - id: GP-08
    name: Governance → Timelock → Spend
    layers: [L0, L3, L5, L7, L8]
    hops:
      - proposal
      - Governor
      - Timelock (48h)
      - execute
      - Indexer / Reality evidence
    frontend_actions: [GOVERNANCE.PROPOSAL.QUEUE, GOVERNANCE.TIMELOCK.EXECUTE]

