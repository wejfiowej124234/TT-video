# TravelTrust · Enterprise Frontend–API Consistency Audit · SSOT
# Runbook: docs/runbook/TT-FRONTEND-API-CONSISTENCY-AUDIT.md
# Script: scripts/dev/run-frontend-api-consistency-audit.sh

schema: traveltrust.frontend_api_consistency_audit.v1
version: 1
effective_utc: "2026-07-02"

machine_keys:
  TT_FRONTEND_API_CONSISTENCY_AUDIT: ENFORCED
  TT_FRONTEND_API_CONSISTENCY_AUDIT_RUNBOOK: docs/runbook/TT-FRONTEND-API-CONSISTENCY-AUDIT.md

placement:
  after: PRODUCT_CAPABILITY_COMPLETE
  before: DISPLAY_DATA_GOVERNANCE
  every_release: true

layer_stack:
  - database
  - api
  - frontend_mapping
  - state_store
  - ui
  - browser

check_dimensions:
  - api_count_equals_ui_count
  - uuid_consistent
  - status_consistent
  - sort_consistent
  - filter_consistent
  - pagination_consistent
  - placeholder_not_misleading
  - skeleton_not_misleading
  - cache_no_duplicate
  - hydration_no_duplicate
  - mock_no_leak
  - data_origin_consistent
  - city_consistent
  - avatar_consistent
  - bio_consistent

surfaces:
  - id: S01_MARKET_GUIDES
    name: Market · Guide Cards
    api: GET /api/v1/guides
    frontend: /market?view=guides · GuideCard · useMarketPage
    checks: [count, uuid, city, avatar, bio, data_origin, filter, pagination, mock_leak]
  - id: S02_MARKET_DISCOVER
    name: Market · Discover Orders
    api: GET /api/v1/discover/orders
    frontend: /market · MarketContentOrdersSection
    checks: [count, uuid, data_origin, mock_leak]
  - id: S03_COMMUNITY_FEED
    name: Community · Feed
    api: GET /api/v1/community/feed
    frontend: /community · useCommunityFeed · drawer
    checks: [count, uuid, pagination, posts_vs_feed]
  - id: S04_GOVERNANCE
    name: Governance · Proposals
    api: GET /api/v1/governance/proposals
    frontend: /governance
    checks: [count, uuid, auth_required]
    note: "Public read may require Bearer; audit uses tourist@test.com"
  - id: S05_OFFICIAL_CAMPAIGN
    name: Official Ops · Cold Start Surfaces
    api: GET /api/v1/official/cold-start/surfaces/:surface
    frontend: / · /market · /community
    surfaces: [homepage, market, community, festival, holiday, regional]
    checks: [published_only, draft_not_leaked]
  - id: S06_CONTENT
    name: Content · Catalog / POI
    api: GET /api/v1/catalog/countries · admin/content/pois
    frontend: landing · POI ambient
    checks: [admin_published_vs_public]
  - id: S07_USER_CENTER
    name: User Center
    api: GET /api/v1/me · /me/stats
    frontend: /me
  - id: S08_ORDERS
    name: Orders
    api: GET /api/v1/orders
    frontend: /escrow · orders list
  - id: S09_MESSAGES
    name: Messages
    api: GET /api/v1/community/conversations
    frontend: /community/messages
  - id: S10_ADMIN_PUBLIC_OPS
    name: Admin · Public Ops
    api: GET /api/v1/admin/official/public-operations/*
    frontend: /admin/official/public-operations
  - id: S11_GUIDE_DETAIL
    name: Guide Detail · Availability
    api: GET /api/v1/guides/:id · /availability
  - id: S12_MARKET_LISTINGS
    name: Market Listings
    api: GET /api/v1/market/{provider|acquisition}/listings
    note: >
      Market Subsite Frontend Race Fix CLOSED (20260703T091200Z): provider+acquisition
      browser regression vs API on staging web v45 — frontend race, not DDG.
      evidence/GO_market_subsite_frontend_race_fix/20260703T091200Z/

market_subsite_race_fix:
  stamp: "20260703T091200Z"
  status: CLOSED
  classification: Market Subsite Frontend Race Fix
  not_data_governance: true
  governance_gates: { OCS: CLOSED, DDG: CLOSED, SOPCP: CLOSED }
  evidence: evidence/GO_market_subsite_frontend_race_fix/20260703T091200Z/race-fix-closure.json
  signoff: evidence/manual-uat/signoff/MARKET-SUBSITE-FRONTEND-RACE-FIX-SIGNOFF-20260703T091200Z.md
  playwright: frontend/e2e/market-subsite-catalog-race-regression.spec.ts
  web_deploy: { app: tt-web-staging, release_version: 45 }
  issue_taxonomy:
    staging_cold_start: Fixed
    duplicate_data_listing_id: Fixed
    acquisition_jp_zero: Expected Difference
    err_connection_closed: Transient Flake
  verdict: CLOSED

browser_layer:
  playwright: frontend/e2e/frontend-api-consistency-audit.spec.ts
  record_script: scripts/dev/record-frontend-api-consistency-audit-staging.sh
  checks: [visual_duplicate_img_src, feed_count_sanity, governance_no_mock, c3_bio_canonical, showcase_avatar_unique, campaign_no_mock_leak]

staging_runs:
  api_strict:
    stamp: "20260702T021003Z"
    evidence: evidence/GO_frontend_api_consistency_audit/staging_browser_20260702T021003Z/audit-report.json
    blocking: 0
    warnings: 0
    pass: true
  browser_layer:
    stamp: "20260702T021003Z"
    evidence: evidence/GO_frontend_api_consistency_audit/staging_browser_20260702T021003Z/browser-report.json
    screenshots: evidence/GO_frontend_api_consistency_audit/staging_browser_20260702T021003Z/screenshots/
    playwright_pass: 6
    playwright_skip: 2
    blocking: 0
    warnings: 0
    pass: true
  web_deploy:
    app: tt-web-staging
    image: tt-web-staging:deployment-01KWG89JAX6V7C37NHRVJT1TXF
    deployed_utc: "2026-07-02T01:58:19Z"
    fix: marketMediaFallback guide.id 24-portrait pool + avatar_url assignments

signoff: evidence/manual-uat/signoff/FRONTEND-API-CONSISTENCY-AUDIT-SIGNOFF-20260702T021250Z.md

scripts:
  api_layer: scripts/dev/run-frontend-api-consistency-audit.sh
  gate: scripts/gates/check-frontend-api-consistency-audit-ssot.sh
  browser_layer: frontend/e2e/frontend-api-consistency-audit.spec.ts

evidence_root: evidence/GO_frontend_api_consistency_audit

release_pipeline: registry/release-pipeline.v1.yaml
