# W4 precondition — governance read-only may ship against indexer; must surface runtime PENDING
w4_precondition:
  governance_read_only_allowed: true
  requires_runtime_active: false
  ui_must_show_runtime_status: true
  ui_forbidden:
    - "reserve = principal - swept - disbursed"
    - direct_rpc_contract_reads
    - mutating_sweep_params_recipient

# W4b — Protocol Operations Console (read-only admin ops view)
w4b_ops_console:
  status: COMPLETE
  api: GET /api/v1/admin/vacancy-ledger
  ui: /admin/vacancy-ledger
  positioning: Protocol Operations Console
  read_only: true
  surfaces:
    - reconciliation_status
    - indexer_health
    - event_explorer
    - runtime_capability
  forbidden_writes:
    - sweep_params
    - recipient_allowlist
    - disburse
    - contract_upgrade
    - deploy

