# TRAVELTRUST_HOME_MODULAR_RELEASE_V1
# SSOT: /traveltrust Homepage Module Registry
# Runbook: docs/runbook/TT-TRAVELTRUST-HOME-MODULAR-RELEASE-V1-LATEST.md
# Gate: python scripts/gates/check-traveltrust-home-module-registry.py
# Scope: python scripts/gates/check-traveltrust-home-release-scope.py
#
# Not a physical React-file swap on Fly. Next still rebuilds the image.
# RELEASE_SCOPE only allows the named module(s) to change product behavior;
# every other module must prove 0-drift (hash/diff/runtime).
#
# Do not use module *count* to decide which environment is right.
# Lifecycle is 5 states. Local-only never jumps to Official.

schema: traveltrust.home_module_registry.v1
version: 1
id: TRAVELTRUST_HOME_MODULAR_RELEASE_V1
route: /traveltrust
tt_production_go: NO_GO
forbid:
  - official_local_dual_track
  - tt_home_variant
  - officialBody
  - localBody
  - force_equal_module_count_before_mapping
  - auto_ship_LOCAL_ONLY_PENDING
  - skip_READY_FOR_RELEASE
  - local_to_official_jump
  - delete_PROD_ONLY_to_match_local
  - auto_r1_rebaseline
  - hand_edit_READY_without_evidence
  - stamp_CANONICAL_ACTIVE_before_deploy
  - stamp_CANONICAL_ACTIVE_before_runtime_pass

# Five fixed Module Lifecycle states. Presence (mounted/absent) is orthogonal.
lifecycle:
  status_enum:
    - CANONICAL_ACTIVE
    - LOCAL_ONLY_PENDING
    - READY_FOR_RELEASE
    - PROD_ONLY_REBASE
    - DEPRECATED
  can_ship:
    CANONICAL_ACTIVE: true
    LOCAL_ONLY_PENDING: false
    READY_FOR_RELEASE: auth_required
    PROD_ONLY_REBASE: false
    DEPRECATED: dedicated_delete_release
  transitions:
    LOCAL_ONLY_PENDING: [READY_FOR_RELEASE, DEPRECATED]
    READY_FOR_RELEASE: [CANONICAL_ACTIVE, LOCAL_ONLY_PENDING]
    CANONICAL_ACTIVE: [READY_FOR_RELEASE, DEPRECATED]
    PROD_ONLY_REBASE: [CANONICAL_ACTIVE]
    DEPRECATED: []
  m07_path:
    - LOCAL_ONLY_PENDING
    - READY_FOR_RELEASE
    - RELEASE_SCOPE_PASS
    - STAGING_OR_PRODUCTION_DEPLOY
    - RUNTIME_VERIFICATION_PASS
    - CANONICAL_ACTIVE
  canonical_active_requires:
    - matching_READY_FOR_RELEASE_evidence
    - release_scope_pass
    - staging_or_production_deploy_pass
    - official_runtime_pass
  deploy_fail_keeps: READY_FOR_RELEASE
  transition_evidence:
    required_fields:
      - module_id
      - from_state
      - to_state
      - git_sha
      - tests
      - timestamp
      - reason
    ledger: registry/traveltrust-home-module-lifecycle-ledger.v1.json
    ready_for_release_requires_evidence: true
    canonical_active_promotion_requires_evidence: true
    recorder: scripts/dev/record-traveltrust-home-module-lifecycle.py
  canonical_seed:
    source: production_runtime_observation_2026-08-19
    module_ids: [M01, M02, M03, M04, M05, M06, M08, M09, M11]
    note: First-map from Official mounted modules. Not a bake. Later CANONICAL_ACTIVE promotions require ledger + deploy + runtime PASS.
  release_machine:
    - registry_lifecycle_allows_scope
    - scoped_module_diff_only
    - out_of_scope_zero_drift
    - build_pass
    - staging_or_production_deploy
    - official_runtime_pass
    - then_stamp_CANONICAL_ACTIVE
    - deploy_fail_keeps_READY_FOR_RELEASE
    - no_whole_page_overwrite

status_enum:
  - CANONICAL_ACTIVE
  - LOCAL_ONLY_PENDING
  - READY_FOR_RELEASE
  - PROD_ONLY_REBASE
  - DEPRECATED

presence_enum:
  - mounted
  - archived
  - absent
  - not_sampled

# LOCKED is this-wave *release policy*, not a permanent architecture name.
this_wave_release_policy:
  locked_module_ids: [M01, M02, M03]
  reason: Owner does not want Header / LIVE+Nav / Pulse product change this wave
  unlock: explicit RELEASE_SCOPE including that Module ID + Owner auth

