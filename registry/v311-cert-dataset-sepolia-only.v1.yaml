# Hard rule: every cert (Function / Product / UI/UX / PSG / RC) uses pure Sepolia only.
rule: PURE_SEPOLIA_DATASET_ONLY
required_chain_id: 11155111
network: sepolia

forbid:
  - chain_id_31337
  - local_anvil_seed
  - mock_escrow_addresses
  - historical_test_projections_mixed_into_cert
  - cross_chain_orders_bleed_into_reconcile

