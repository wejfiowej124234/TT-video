  - cert_run_chain_id_ne_11155111
  - live_reconcile_stats_chain_id_ne_11155111
  - seed_fixture_escrow_present_in_cert_scope
  - mock_or_placeholder_escrow_pattern_detected

seed_isolation:
  description: >
    Fixture/mock escrow rows (e.g. 0x2222… / 0x3333… under f0e0* ids) must be
    cleared or excluded from Sepolia cert scope before I-01 PASS.
  quarantine_script: scripts/dev/quarantine-v311-cert-seed-escrows.sh

indexer_live:
  machine_key: TT_V311_INDEXER_LIVE_RECONCILE
  pass_requires:
    - chain_id_11155111
    - issues_total_0
    - projection_reconcile_clean_true
    - no_31337_in_cert_payload
