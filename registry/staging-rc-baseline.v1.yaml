schema: traveltrust.staging_rc_baseline.v1
version: 1
effective_utc: "2026-07-04"

machine_key: TT_STAGING_RC_BASELINE
required_status: READY

# Living ops gates (② · not PSG Archive mutate)
companion_gates:
  TT_PSG_RELEASE_SSOT: ENFORCED
  TT_PSG_VERSION_GATE: ENFORCED
  TT_PATCH_PROMOTION_GATE: ENFORCED
  TT_DEPLOYMENT_IDENTITY_GATE: ENFORCED
  TT_DEPLOY_FRESHNESS_GATE: ENFORCED
  TT_PUBLIC_DISPLAY_10X4_LOCK: ENFORCED
  TT_DUAL_TRACK_RELEASE: ENFORCED
  deploy_target_required: CERTIFICATION_FREEZE|STAGING_PATCH|EXPERIMENT
  psg_release_ssot: docs/runbook/TT-PSG-RELEASE-SOURCE-OF-TRUTH-LATEST.md
  psg_release_version_pin: registry/psg-release-version-LATEST.yaml
  dual_track_runbook: docs/runbook/TT-PSG-DUAL-TRACK-RELEASE-STAGING-PATCH-LATEST.md
  patch_ledger: docs/runbook/TT-STAGING-PATCH-LEDGER-LATEST.md
  patch_promotion_runbook: docs/runbook/TT-PSG-PATCH-PROMOTION-GATE-LATEST.md
  deploy_freshness_runbook: docs/runbook/TT-PSG-DEPLOY-FRESHNESS-GATE-LATEST.md
  display_10x4_runbook: docs/runbook/TT-PSG-PUBLIC-DISPLAY-10X4-LOCK-LATEST.md
  wired_via: scripts/dev/lib/staging-rc-baseline-gate.sh → identity → psg-version → freshness
  note: >
    PSG is unique Release SSOT. Pre-deploy: Change Record + Version pin, then
    Identity → PSG Version Gate (local=testnet) → Freshness. FG-15: maintain
    09c72b93 only; Track B Ledger-only until ELAPSED + Promotion.

# 写死 · Public Surface / 业务模块 / 公开展示能力 · 准入纪律（canonical）
canonical_admission_policy: >-
  任何新增 Public Surface、业务模块或公开展示能力，必须先完成 Baseline 注册、SSOT 建模、
  统一 Gate、统一 Audit、统一 Evidence，并通过 TT_STAGING_RC_BASELINE 验证后，才允许进入 Staging；
  任何未纳入 Baseline 的模块不得部署、不得公开展示、不得视为 Release Candidate。

admission_sequence:
  - baseline_registration
  - ssot_modeling
  - unified_gate
  - unified_audit
  - unified_evidence
  - TT_STAGING_RC_BASELINE_verification

# 企业生命周期锚点（2026-07-04 · 写死）— 47/47 PASS 是结果，不是标准本身
lifecycle_phase:
  development: complete
  ssot: complete
  baseline: complete
  baseline_enforcement: complete
  public_surface_governance: complete
  release_candidate: complete
  rc_runtime_convergence: frozen_closed
  ocs_content_l5: closed
  production_preparation: in_progress
  production_verification: pending
  production_go: pending

# 唯一 Public Surface 标准 · 禁止第二套 Gate / Audit / Evidence
single_standard_policy:
  one_baseline: TT_STAGING_RC_BASELINE
  one_ssot_chain: dataset.v1.json → assets.v1.json → OCS state.json → governed public views
  one_gate: scripts/dev/lib/staging-rc-baseline-gate.sh
  one_audit: scripts/dev/audit-staging-rc-baseline-public-surfaces.cjs
  one_evidence_root: evidence/GO_staging_rc_baseline/
  one_enforcement: scripts/dev/validate-staging-rc-baseline-enforcement.cjs
  unified_lib: scripts/dev/lib/staging-rc-public-surface-unified.cjs
  forbidden:
    - module_specific_public_surface_gates
    - parallel_smoke_only_surface_checks
    - deploy_without_baseline_admission

# 新增/变更公开展示面 · 准入（先于写页面 / 先于 Staging deploy）
public_surface_admission:
  canonical: registry/staging-rc-baseline.v1.yaml#canonical_admission_policy
  rule: >-
    任何新增 Public Surface、业务模块或公开展示能力，必须先完成 Baseline 注册、SSOT 建模、
    统一 Gate、统一 Audit、统一 Evidence，并通过 TT_STAGING_RC_BASELINE 验证后，才允许进入 Staging；
    任何未纳入 Baseline 的模块不得部署、不得公开展示、不得视为 Release Candidate。
  before_first_line_of_ui:
    - register_surface_in_registry_expected_public_surface
    - extend_unified_baseline_lib_and_audit_checklist
    - wire_align_or_governed_mutation_if_runtime_rows
    - pass_baseline_gate_and_full_surface_audit
    - record_evidence_under_GO_staging_rc_baseline
  not_release_candidate_until:
    - TT_STAGING_RC_BASELINE: READY
    - TT_STAGING_RC_SSOT_PARITY: ALIGNED
    - TT_STAGING_RC_BASELINE_AUDIT: PASS

ssot_chain:
  release_candidate: evidence/manual-uat/signoff/RELEASE-CANDIDATE-SIGNOFF-20260702T144513Z.md
  official_catalog: data/official-cold-start/dataset.v1.json
  official_asset: data/official-cold-start/assets.v1.json
  official_media: data/official-cold-start/media/
  ocs_registry: registry/official-cold-start-dataset.v1.yaml
  alignment_registry: registry/staging-rc-ssot-alignment.v1.yaml
  # Runtime UUID pack for Staging public surfaces (10×4). Nested ocs-* evidence is NOT SSOT.
  ocs_runtime_state: evidence/GO_official_cold_start_dataset/20260708T121151Z/state.json
  ocs_runtime_active_pointer: evidence/GO_official_cold_start_dataset/ACTIVE.json

active_pointer: evidence/GO_staging_rc_baseline/ACTIVE.json

forbidden_on_staging:
  - historical_smoke_display_data
  - corridor_smoke_posts_c3_c10_c12_c4_c5
  - non_ocs_public_catalog_rows
  - legacy_uuid_volume_media_404
  - unsplash_showcase_demo_seed_urls
  - stateless_staging_deploy_without_deployment_state
  - old_api_public_surface_drift
  - deploy_without_TT_DEPLOY_FRESHNESS_GATE
  - public_catalog_counts_not_10x4
  - next_public_catalog_api_enabled_not_1_on_web_bake

allowed_changes:
