api_allowlist_frozen_reference:
  source: crates/api/src/db/catalog_ops_admin.rs
  kinds: [poi_hero, landing_ambient, hotel_tier_stock, transport_stock, generic]
  reserved_to_add: [city_hero]

asset_kind_final:
  city_hero:
    kind: city_hero
    verdict: CONFIRMED_RESERVED
    in_api_allowlist: false
  hotel:
    kind: hotel_tier_stock
    verdict: FROZEN
    in_api_allowlist: true
  transport:
    kind: transport_stock
    verdict: FROZEN
    in_api_allowlist: true
  listings:
    kind: null
    content_families: [provider_listing, acquisition_listing]
    verdict: CONFIRMED_NOT_MEDIA_KIND
    rejected_kind: listing_cover

unified_lifecycle:
  - Draft
  - Review
  - Publish
  - Catalog
  - Runtime
  - Consumer
  - Verify
  - Evidence
  - Frozen

module_exceptions:
  hotel:
    type: dual_read
    primary: GET /api/v1/catalog/hotel-tiers
    secondary: GET /api/v1/catalog/media?asset_kind=hotel_tier_stock
  listings:
    type: listing_api_not_media_kind
    families: [provider_listing, acquisition_listing]
    runtime: GET /api/v1/market/{provider|acquisition}/listings
    cover_field: payload.cover_url

admin_unified_shell:
  center: Content_Center
  flow: [upload, review, publish, history]
  nav_ssot: frontend/lib/admin/adminShellContentNavLinks.ts

verify_unified:
  per_family_script: scripts/dev/run-cms-content-l5-{family}-verify.cjs
  evidence_schema: traveltrust.cms_p1_family_verify.v1
  registry_consumes: [PASS, FAIL]
  machine_key_pattern: TT_CMS_{FAMILY}_ROW_VERIFY

frozen_exit_gate:
  gates: [catalog_ready, runtime_ready, consumer_ready, verify_pass, evidence_pass, l5_pass]
  all_required: true
  registry_transition: Pilot_to_Frozen

