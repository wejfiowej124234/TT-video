# schema: traveltrust.psg_production_release_readiness_gate.v1
# PSG = unique Production Readiness Gate (enterprise release governance)
# Not "fix everything" — every risk has status + evidence + owner + path; Gate decides ship.
machine_key: TT_PSG_PRODUCTION_RELEASE_READINESS_GATE
status: ACTIVE
recorded_utc: "2026-07-19T03:20:00Z"
phase: RELEASE_WINDOW_OPEN
wait_window: F-02_RELEASE_MINFIX
execute_allowed_now: true
execute_allowed_utc: "2026-07-19T06:50:00Z"
execute_allowed_by: Owner_session_implement_plan
model: enterprise_nine_domain_lifecycle
human_ssot: docs/runbook/TT-PSG-PRODUCTION-RELEASE-READINESS-GATE-LATEST.md
register_ssot: docs/runbook/TT-PRODUCTION-READINESS-REGISTER-LATEST.md
min_fix_queue: docs/runbook/TT-PFA-RELEASE-WINDOW-MIN-FIX-CANDIDATES-LATEST.md
release_control: docs/runbook/TT-RELEASE-CONTROL-STANDBY-LATEST.md
coverage_model: docs/runbook/TT-PSG-COVERAGE-MODEL-SEVEN-DIMENSIONS-LATEST.md
coverage_model_machine: registry/psg-coverage-model-seven-dimensions.v1.yaml

discipline:
  unique_verdict_entry: true
  zero_finding_not_required: true
  register_is_risk_map_not_task_list: true
  every_risk_needs_status_evidence_owner_path: true
  only_blocker_and_fix_required_must_clear_in_release_window: true
  deferred_and_accepted_need_record_owner_plan: true
  coverage_acceptance_is_final_gate_layer: true
  fix_close_alone_not_enough_for_go: true
  forbid_convert_deferred_not_run_cite_into_release_window_audit: true
  forbid_eta_full_recheck_loop: true
  forbid_conditional_go_as_production_go: true
  forbid_release_window_scope_expansion: true
  no_new_audit_while_frozen: true
  no_scattered_audit_bypasses_gate: true
  does_not_equal_tt_psg_production_cert: true
  does_not_equal_production_go: true

anti_errors:
  E1_coverage_as_task_list: "NOT_RUN → classify impact first; do not auto-spawn work"
  E2_conditional_go_as_go: "CONDITIONAL_GO = controlled prep only; need Fix close + Coverage Acceptance PASS + Recalculate"
  E3_release_window_scope_creep: "Fix → Verify → Evidence only; no drive-by refactor/upgrade/re-audit"
  E4_fix_then_ship_skip_coverage: "After Fix close must re-eval Coverage Acceptance before GO"

register_layers:
  L1_verified_evidence: "CLOSED/PASS/FINDING — already checked; do not re-run"
  L2_release_action: "RELEASE_FIX_REQUIRED — only open set (count=8) in Release Window"
  L3_governance_coverage: "DEFERRED/NOT_RUN/CITE — coverage placeholder; not auto-execute"
  L4_coverage_acceptance: "Final gate layer — seven dimensions PASS/CONDITIONAL/FAIL/DEFERRED"

gate_structure:
  - Release_Blocker
  - Fix_Required
  - Deferred_Accepted_Risk
  - Coverage_Acceptance

coverage_acceptance:
  rollup_status: CONDITIONAL
  baseline_status: COMPLETE
  baseline_human: docs/runbook/TT-PSG-COVERAGE-ACCEPTANCE-BASELINE-LATEST.md
  baseline_machine: registry/psg-coverage-acceptance-baseline.v1.yaml
  human_ssot: docs/runbook/TT-PSG-COVERAGE-MODEL-SEVEN-DIMENSIONS-LATEST.md
  production_thresholds:
    Functional_Domain: PASS
    User_Journey_core: PASS
    API_Backend: PASS
    Code_Line: DEFERRED_allowed
    Security_Web3: PASS
    Data_Governance_P0: PASS
    UI_UX_P0: PASS
  current:
    functional: PARTIAL
    journey: PARTIAL
    api: PASS
    code: DEFERRED
    security_web3: PARTIAL
    data: PARTIAL
    uiux: PARTIAL
  new_fix_from_baseline: 0
  release: NOT_READY_FOR_GO

# Dashboard questions (per check)
dashboard_questions:
  - id: Q1_CHECKED
    ask: "Has this been checked?"
    fields: [status, evidence_id]
  - id: Q2_FINDINGS
    ask: "Are there findings?"
    fields: [finding_id, severity, action_window]
  - id: Q3_SHIP
    ask: "May we ship?"
    fields: [production_release_status]

# Per-check / per-leaf status vocabulary
check_item_status_enum:
  PASS: "Verified OK for this leaf (may still have deferred children)"
  CLOSED: "Verified / archived — do not re-scan"
  RELEASE_FIX_REQUIRED: "Must Fix+single-reverify in PSG Release Window (Min-Fix)"
  DEFERRED: "Known — later phase; record+owner+plan"
  ACCEPTED_RISK: "Known — mitigation; Owner accepts for this release slice"
  NOT_RUN: "Registered existence — not executed this window (must Deferred or schedule)"
  BLOCKED: "Hard stop synonym — clear before progress/GO"
  RELEASE_BLOCKER: "Hard stop — no Release Window progress / no GO until cleared"

# Finding bucket classes (Register)
finding_classes:
  CLOSED: "Verified / archived — do not re-scan"
  RELEASE_FIX_REQUIRED: "Must Fix+single-reverify in PSG Release Window (Min-Fix)"
  RELEASE_BLOCKER: "Hard stop — no Release Window progress / no GO until cleared"
  DEFERRED: "Known — later phase; record+owner+plan"
  ACCEPTED_RISK: "Known — mitigation; Owner accepts for this release slice"

# Publish status vocabulary (Gate Verdict)
status_enum:
  GO: "Release_Fix_Required=0 AND Release_Blocker=0 AND publish_object_pinned AND Owner allows claim"
  CONDITIONAL_GO: "No Release_Blocker; Fix_Required>0 queued for Release Window OR soft pins pending — NOT Production GO"
  NO_GO: "Open Release_Blocker OR coverage incomplete OR publish identity unknown without Owner plan"

# Nine domains (lifecycle model) — leaves + current mapping (no re-audit)
domains:
  - id: D1_RELEASE_IDENTITY
    name: Release_Identity
    leaves: [SHA, Image_Digest, Artifact_Integrity, Release_Owner]
    coverage_ids: [PFA-01]
    domain_status: CLOSED_WITH_FIX_REQUIRED_PINS
  - id: D2_INFRASTRUCTURE
    name: Infrastructure_Readiness
    leaves: [Domain_DNS, TLS, Runtime, Storage, Database, Backup]
    coverage_ids: [FINAL-PAPER-A-B]
    domain_status: CLOSED_PAPER_DEFERRED_DRILL_DNS
  - id: D3_SECURITY
    name: Security_Readiness
    leaves: [Secrets, Auth, RBAC, Headers, Permission_Boundary]
    coverage_ids: [PFA-03, HARDENING-P0, WEB3-SECURITY-UI-SHADOW, CITE-AUTH-UI-FREEZE]
    domain_status: CLOSED_PAPER_DEFERRED_CSP_LIVE_RBAC
  - id: D4_WEB3
    name: Web3_Readiness
    leaves: [Chain_Identity, Contract_Address, Governor, Timelock, WalletConnect, Runtime_Binding]
    coverage_ids: [PFA-02, PFA-UI-01, CITE-V311-CLEAN-BASELINE-CERT, CITE-WEB3-ACTIVE-EXECUTION-MATRIX, CITE-CONSTITUTION-V311]
    domain_status: CLOSED_WITH_FIX_REQUIRED_WC_ACTIVE
  - id: D5_BUSINESS_FLOW
    name: Business_Flow_Readiness
    leaves: [Order, Escrow, Settlement, Dispute, Role_Journey]
    coverage_ids: [HARDENING-P1, CITE-ADMIN-BACKOFFICE-CERT]
    domain_status: CLOSED_PAPER_DEFERRED_MONEY_PATH_JOURNEY
  - id: D6_DATA_GOVERNANCE
    name: Data_Governance
    leaves: [CMS_Ownership, Data_Source, Content_Lifecycle, Duplicate_Prevention]
    coverage_ids: [CMS-DATA-CHAIN]
    domain_status: CLOSED_DEFERRED_PULSE_DUAL
  - id: D7_UI_UX
    name: UI_UX_Readiness
    leaves: [Route, Navigation, Role_Experience, Wallet_Flow, Error_Handling]
    coverage_ids: [T0-UI, PFA-UI-01, CITE-FIVE-MAIN-UI-FREEZE]
    domain_status: CLOSED_WITH_FIX_REQUIRED_ROLE_TRUST_WALLET
  - id: D8_OPERATIONS
    name: Operations_Readiness
    leaves: [Monitoring, Incident_Response, Rollback, Owner, Escalation]
    coverage_ids: [HARDENING-P2, FINAL-PAPER-A-B, CITE-CEREMONY-ROLLBACK]
    domain_status: CLOSED_PAPER_ACCEPTED_PAGER
  - id: D9_LEGAL_EXTERNAL
    name: Legal_External_Readiness
    leaves: [ToS, Privacy, Token_Disclosure, Trust_Center_Disclosure, Investor_Material_Consistency]
    coverage_ids: []
    domain_status: DEFERRED_REGISTERED
    note: "Register §2b five rows — pre-public; NOT in coverage_closed; not scanned in WAIT_WINDOW"

