    - id: PSG-EXT-STATUS-TEMPLATE
      domain: D8_OPERATIONS
      status: DEFERRED
      owner: Owner
      note: "who posts / which channel / who approves — not in Gate counts"

register_completeness_policy:
  coverage: Sufficient
  expansion: STOPPED
  last_allowed_increment: "PSG-RELEASE-OWNER-SIG + PSG-EXT-STATUS-TEMPLATE"
  forbid:
    - sbom_engineering
    - legal_copywriting
    - settlement_deep_split
    - dispute_deep_split
    - indexer_sla_rebuild
    - infinite_checklist_growth

