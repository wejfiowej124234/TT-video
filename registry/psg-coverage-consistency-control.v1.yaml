machine_key: TT_PSG_COVERAGE_CONSISTENCY_CONTROL
schema: traveltrust.psg_coverage_consistency_control.v1
status: ACTIVE
recorded_utc: "2026-07-19T05:00:00Z"
human_ssot: docs/runbook/TT-PSG-COVERAGE-CONSISTENCY-CONTROL-LATEST.md
gate_script: scripts/gates/check-psg-coverage-consistency-control.sh
stamp_script: scripts/dev/stamp-psg-coverage-run.py
domain_batch_ssot: docs/runbook/TT-PSG-DOMAIN-BATCH-CLOSURE-LATEST.md
domain_batch_registry: registry/psg-domain-batch-closure.v1.yaml
execution_mode: domain_batch_closure

release_gate_stamp:
  psg: CONDITIONAL_GO
  fix_required: 8
  coverage_evidence: VERIFIED
  coverage_metrics: FINAL
  consistency_control: OPEN
  threshold_rollup: NEED_FIX

principle: >
  Any Coverage Gap fix must complete Local PASS → Git Commit SHA pin →
  Staging same-SHA deploy → Staging Evidence → Coverage Recalculate.
  Local-only PASS must not count as Coverage PASS.

pass_tiers:
  LOCAL_PASS:
    counts_for_threshold: false
    counts_for_acceptance: false
    meaning: local probe succeeded with evidence_path
  ALIGNED_PASS:
    counts_for_threshold: true
    counts_for_acceptance: true
    meaning: five_point_alignment_loop_complete

alignment_loop:
  - id: L1_LOCAL
    name: Local PASS
    required: true
  - id: L2_GIT
    name: Git Commit SHA pin
    required: true
    checks:
      - working_tree_clean_for_fix_paths_or_committed
      - head_equals_pinned_sha
      - registry_pinned_sha_matches
      - evidence_coverage_run_git_sha_matches
  - id: L3_STAGING_DEPLOY
    name: Staging deploy same SHA
    required: true
  - id: L4_STAGING_EVIDENCE
    name: Staging Evidence verify
    required: true
    requires_coverage_run_environment: staging
  - id: L5_RECALCULATE
    name: Coverage Recalculate
    required: true
    aligned_cells_only: true

environment_parity:
  - local_tests_pass
  - staging_same_sha_deploy
  - staging_db_migration_aligned
  - env_config_mode_aligned
  - api_health_and_meta_aligned

coverage_run_schema:
  schema: traveltrust.psg_coverage_run.v1
  required_fields:
    - git_sha
    - environment
    - api_sha
    - web_sha
    - migration_state
    - api_version
    - frontend_version
    - timestamp
    - evidence_path
    - consistency_verdict
  optional_fields:
    - cell_refs
    - register_issue_ids
    - staging_meta_git_sha
    - notes

rbac_acceptance_note: >
  RBAC 60/96 NEED_FIX is structural (threshold pass/96==100 while 36 N/A never count).
  Do not expand tests to chase 100% until Owner redefines valid cells vs N/A / Acceptance rule.
  Consistency Closure must not invent meaningless RBAC probes.

finding_path:
  - PSG_Register
  - Issue_ID
  - Owner
  - Min_Fix
  - Regression_Evidence
  - Alignment_Loop
  - Recalculate

# Consistency Closure: ALIGNED + Measurement Recalculate bound (Pass Tier ALIGNED_PASS).
current_verdict: ALIGNED_PASS
