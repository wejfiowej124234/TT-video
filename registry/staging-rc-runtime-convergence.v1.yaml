# RC Runtime Convergence · Release Candidate 运行态收敛（② → Production Preparation 前最后一阶）
# Human: docs/runbook/TT-STAGING-RC-RUNTIME-CONVERGENCE.md
# Parent: registry/staging-rc-baseline.v1.yaml

schema: traveltrust.staging_rc_runtime_convergence.v1
version: 1
effective_utc: "2026-07-04"
frozen_utc: "2026-07-04T11:13:00Z"

phase_name: RC Runtime Convergence
phase_position: after_release_candidate_complete_before_production_preparation
phase_status: FROZEN_CLOSED

machine_key: TT_RC_RUNTIME_CONVERGENCE
required_status: CLOSED

# 写死 · 阶段已关闭 — 禁止重新打开 RC 收敛轨；后续仅两条主线
post_closure_policy:
  status: FROZEN
  forbidden:
    - reopen_rc_runtime_convergence_phase
    - register_new_rc_class_issues
    - expand_rc_bucket_taxonomy
    - ad_hoc_rc_a001_style_convergence_sprints
  downstream_tracks_only:
    production_preparation:
      id: PP
      scope: 工程增强 · fingerprint · deploy hygiene · RC-D-001 等
      examples: [RC-D-001]
    l5_polish:
      id: L5
      scope: 体验优化 · a11y · 视觉 · copy · RC-G-001 等
      examples: [RC-G-001]
  regression_routing: >-
    若 Staging 公开展示面再出现 Drift，按 Regression 处置（Bucket H 语义保留于 Baseline audit），
    不得以此重开 RC Runtime Convergence 阶段或新增 RC 类 OPEN 项。
  ssot_chain_ref: registry/staging-rc-baseline.v1.yaml#ssot_chain

parent_baseline:
  machine_key: TT_STAGING_RC_BASELINE
  registry: registry/staging-rc-baseline.v1.yaml
  prerequisite_keys:
    TT_STAGING_RC_BASELINE: READY
    TT_STAGING_RC_BASELINE_ENFORCEMENT: ENFORCED
    TT_STAGING_RC_SSOT_PARITY: ALIGNED
    TT_STAGING_RC_BASELINE_AUDIT: PASS

# 写死：所有 Staging RC 剩余问题只能进入下列八桶之一（禁止「发现一处修一处」无分类）
bucket_policy:
  rule: >-
    任何 Bug / Drift / 截图 / Evidence 必须先归类到 Bucket A–H，再定 Root Cause 与修复链；
    禁止无 Bucket 标签的 ad-hoc 修复；禁止 Evidence 后直接修（跳过分类与 Fix Chain）。
  ssot_traceability: >-
    所有 Bucket 的 OPEN/CLOSED 状态必须追溯到同一 SSOT 链（dataset → assets → OCS state →
    governed public views → Baseline ACTIVE → audit evidence）；禁止各 Bucket 维护平行状态表。
  ssot_chain_ref: registry/staging-rc-baseline.v1.yaml#ssot_chain
  issue_lifecycle:
    - issue_id
    - evidence
    - bucket
    - severity
    - root_cause
    - fix_chain
    - verification
    - release_impact
    - closed
  review_workflow:
    - submit_evidence
    - classify_bucket_and_priority
    - state_root_cause
    - prescribe_fix_chain
    - re_audit_until_pass
    - state_release_impact

buckets:
  A:
    id: runtime_drift
    label: Runtime Drift
    examples:
      - api_web_payload_mismatch
      - staging_vs_ssot_row_drift
      - meta_profile_mismatch
    machine_key: TT_RC_RUNTIME_DRIFT
    target: "0"
  B:
