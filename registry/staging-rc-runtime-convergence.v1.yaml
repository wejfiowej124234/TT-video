      - legacy_unpublished_rows
      - discover_non_ocs
      - duplicate_public_rows
    machine_key: TT_RC_DATA_DRIFT
    target: "0"
  F:
    id: catalog
    label: Catalog
    examples:
      - ocs_id_missing
      - cover_url_not_in_payload
      - avatar_not_bound
      - asset_manifest_gap
    machine_key: TT_RC_CATALOG_DRIFT
    target: "0"
  G:
    id: l5_experience
    label: L5 Experience
    examples:
      - ops_copy_quality
      - brand_visual_polish
      - hero_imagery_quality
    machine_key: TT_RC_L5_DRIFT
    blocking_for_rc_data: false
