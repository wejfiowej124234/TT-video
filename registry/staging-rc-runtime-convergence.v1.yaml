  H:
    id: regression
    label: Regression
    examples:
      - post_fix_surface_regression
      - gate_regression
      - audit_check_regression
    machine_key: TT_RC_REGRESSION
    target: "0"

convergence_matrix:
  # 百分比 = 该维机读闸 + 最近一次 audit 覆盖；100% = 无 OPEN blocking item
  api_drift: { current_pct: 100, target_pct: 100, bucket: A }
  web_drift: { current_pct: 100, target_pct: 100, bucket: A }
  asset_chain: { current_pct: 100, target_pct: 100, bucket: B }
  public_surface: { current_pct: 100, target_pct: 100, bucket: E }
  runtime_alignment: { current_pct: 100, target_pct: 100, bucket: A }
  deployment_consistency: { current_pct: 100, target_pct: 100, bucket: D }
  presentation_layer: { current_pct: 100, target_pct: 100, bucket: C }
  l5_visual_quality: { current_pct: 100, target_pct: 100, bucket: G, blocking: false, routed_to: L5_POLISH }

