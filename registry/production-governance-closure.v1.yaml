  - docs/runbook/TT-9626-zero-to-production-go-single-path.md
  - docs/runbook/TT-MASTER-PUBLISH-GO-CHECKLIST-001.md

documents:
  pgc: docs/runbook/TT-PRODUCTION-GOVERNANCE-CLOSURE.md
  traceability: docs/runbook/TT-PGC-TRACEABILITY-MATRIX.md
