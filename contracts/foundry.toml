# TravelTrust contracts — Foundry (与 01 §4、19、contracts/README 一致)
# 目标：Polygon PoS (chainId 137)；MVP 单链
# 首次：forge install foundry-rs/forge-std

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
auto_detect_solc = true
evm_version = "paris"
remappings = ["forge-std/=lib/forge-std/src"]
via_ir = true
optimizer = true
optimizer_runs = 200
# V8 token family is Solidity 0.8.26 (Etherscan CVE banner). Do not compile it with 0.8.19.
# Run: bash scripts/dev/run-ttg-v8-forge.sh
skip = ["src/ttg-meme-denom", "test/ttg-v8", "src/ttg-v9", "test/ttg-v9"]

fs_permissions = [
  { access = "read-write", path = "../docs/spec/governance-token/evidence/vacancy-w7-dry-run" },
]

# Isolated 25T V8 profile. Compiler path comes from --use / run-ttg-v8-forge.sh (not a machine-local foundry.toml pin).
[profile.ttg_v8]
src = "src/ttg-meme-denom"
test = "test/ttg-v8"
script = "src/ttg-meme-denom"
out = "out-ttg-v8"
cache_path = "cache-ttg-v8"
libs = ["lib"]
auto_detect_solc = false
evm_version = "paris"
remappings = ["forge-std/=lib/forge-std/src"]
via_ir = true
optimizer = true
optimizer_runs = 200
# --use 0.8.26 must not compile the 0.8.19 broadcast scripts.
skip = ["script"]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./out-ttg-v8" },
  { access = "read-write", path = "../evidence/GO_ttg_v8_sepolia_rehearsal" },
]

# Same isolation as ttg_v8, but compiles .s.sol for Sepolia ② rehearsal only.
[profile.ttg_v8_broadcast]
src = "src/ttg-meme-denom"
test = "test/ttg-v8"
script = "src/ttg-meme-denom"
out = "out-ttg-v8"
cache_path = "cache-ttg-v8"
libs = ["lib"]
auto_detect_solc = false
evm_version = "paris"
remappings = ["forge-std/=lib/forge-std/src"]
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./out-ttg-v8" },
  { access = "read-write", path = "../evidence/GO_ttg_v8_sepolia_rehearsal" },
]

[profile.default.fmt]
line_length = 120


# Isolated V9 Batch PM / Design Lock (solc 0.8.36 · via_IR). Local only — no broadcast.
# Pre-deploy scanner note: pin 0.8.36+via_IR so UnsoundSpill (fixed 0.8.36) and LostStorageArray
# (fixed 0.8.32) are patched; remaining explorer banners are N/A for our patterns — see
# docs/runbook/TT-TTG-V9-PRE-DEPLOY-COMPILER-AND-WALLET-SCAN-LATEST.md
[profile.ttg_v9]
src = "src/ttg-v9"
test = "test/ttg-v9"
script = "src/ttg-v9"
out = "out-ttg-v9"
cache_path = "cache-ttg-v9"
libs = ["lib"]
solc_version = "0.8.36"
auto_detect_solc = true
evm_version = "paris"
remappings = ["forge-std/=lib/forge-std/src"]
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./out-ttg-v9" },
]

# ② Sepolia V9 Batch PM rehearsal broadcast only (chain_id 11155111).
[profile.ttg_v9_broadcast]
src = "src/ttg-v9"
test = "test/ttg-v9"
script = "src/ttg-v9"
out = "out-ttg-v9"
cache_path = "cache-ttg-v9"
libs = ["lib"]
solc_version = "0.8.36"
auto_detect_solc = true
evm_version = "paris"
remappings = ["forge-std/=lib/forge-std/src"]
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./out-ttg-v9" },
  { access = "read-write", path = "../evidence/GO_ttg_v9_sepolia_rehearsal" },
  { access = "read-write", path = "../evidence/GO_ttg_v9_remint_sepolia" },
  { access = "read-write", path = "../evidence/GO_ttg_v9_design_lock_sepolia" },
  { access = "read-write", path = "../evidence/GO_ttg_v9_mainnet_dl_r1" },
]
