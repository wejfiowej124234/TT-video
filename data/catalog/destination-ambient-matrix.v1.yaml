# CMS Content L5 · Destination Ambient Asset Matrix
# Product: Destination Ambient · Catalog asset_kind (legacy): landing_ambient
# Runbook: docs/runbook/TT-CMS-CONTENT-L5.md

schema: traveltrust.cms_destination_ambient_matrix.v1
version: 2
effective_utc: "2026-07-05"
machine_key: TT_CMS_DESTINATION_AMBIENT_MATRIX
status: BASELINE
brief_ssot: data/catalog/cms-content-brief.v1.yaml
hero_upgrade_ssot: data/catalog/destination-ambient-hero-matrix.v1.yaml

# 双维收口（禁止混读）
closure_dimensions:
  pipeline:
    phase: "② Staging"
    status: CLOSED
    meaning: CMS→Catalog→Publish→Runtime→Browser→Evidence · Wave 1 接线
  visual_l5:
    phase: "② Hero Upgrade"
    status: OPEN
    meaning: 全屏 Hero 3840×2160 · 见 hero_upgrade_ssot · 当前 public_url 均为 640×480 OCS

# Phase 1 执行顺序 · 与 OCS 国际城链顺序对齐（JP→…→AE）· CN 为产品国第 10 位
phase_1_execution_order:
  - { order: 1, matrix_id: DA-JP-HOME, country_iso: JP, ocs_chain_ref: tokyo-photo }
  - { order: 2, matrix_id: DA-KR-HOME, country_iso: KR, ocs_chain_ref: seoul-food }
  - { order: 3, matrix_id: DA-TH-HOME, country_iso: TH, ocs_chain_ref: bangkok-temple }
  - { order: 4, matrix_id: DA-SG-HOME, country_iso: SG, ocs_chain_ref: singapore-family }
  - { order: 5, matrix_id: DA-FR-HOME, country_iso: FR, ocs_chain_ref: paris-art }
  - { order: 6, matrix_id: DA-US-HOME, country_iso: US, ocs_chain_ref: nyc-skyline }
  - { order: 7, matrix_id: DA-AU-HOME, country_iso: AU, ocs_chain_ref: sydney-coast }
  - { order: 8, matrix_id: DA-ES-HOME, country_iso: ES, ocs_chain_ref: barcelona-arch }
  - { order: 9, matrix_id: DA-AE-HOME, country_iso: AE, ocs_chain_ref: dubai-luxury }
  - { order: 10, matrix_id: DA-CN-HOME, country_iso: CN, ocs_chain_ref: product_country_only }

phase_1_fixed_workflow:
  - destination_ambient_brief
  - asset_matrix
  - designer_upload
  - cms_review
  - catalog_publish
  - verify
  - evidence
  - matrix_pass
  forbidden_shortcut: upload_direct_to_live

phase_1_single_asset_template:
  runbook: docs/runbook/TT-CMS-PHASE1-SINGLE-ASSET-TEMPLATE.md
  evidence_schema: traveltrust.cms_phase1_single_asset_evidence.v1
  evidence_template: data/catalog/templates/cms-phase1-single-asset-evidence.v1.json
  scaffold_script: scripts/dev/scaffold-cms-phase1-single-asset-evidence.cjs
  dod_script: scripts/dev/run-cms-phase1-single-asset-dod.cjs
  execution_gate_enum: [PASS, FAIL]
  steps:
    - { id: step_1_brief_review, gate: brief_review, lifecycle_out: draft }
    - { id: step_2_designer_upload, gate: null, lifecycle_out: review }
    - { id: step_3_cms_review, gates: [cms_review, destination_authenticity, brand_consistency], lifecycle_out: approved }
    - { id: step_4_catalog_publish, gate: catalog_publish, lifecycle_out: published }
    - { id: step_5_verify, gate: verify, lifecycle_out: live }
    - { id: step_6_evidence, gate: evidence_complete, lifecycle_out: live }
  forbidden:
    - upload_direct_to_live
    - skip_review
    - skip_verify
    - batch_upload_then_accept
    - mark_pass_without_evidence

execution_gate_enum: [PASS, FAIL]

# Phase 1 三波试点 · 禁止 10 国批量上传（Change Policy §4）
phase_1_pilot_discipline:
  change_policy: docs/runbook/TT-CMS-CHANGE-POLICY.md
  wave_1:
    matrix_ids: [DA-JP-HOME]
    purpose: full single-row loop Draft to Live · validate process
  wave_2:
    matrix_ids: [DA-KR-HOME]
    purpose: second country · confirm no process adjustment needed
  wave_3_plus:
    after: wave_1_and_wave_2_complete
    order_from_execution: 3
    matrix_ids: [DA-TH-HOME, DA-SG-HOME, DA-FR-HOME, DA-US-HOME, DA-AU-HOME, DA-ES-HOME, DA-AE-HOME, DA-CN-HOME]
  forbidden:
    - batch_upload_all_countries
    - skip_wave_1_pilot
    - skip_wave_2_validation

content_health_score:
  script: scripts/dev/run-cms-content-health-score.cjs
  latest: evidence/GO_cms_content_l5/CMS-CONTENT-HEALTH-SCORE-LATEST.json
  schema: traveltrust.cms_content_health_score.v2
  governance_metrics: [live_assets, review_sla, verify_pass_rate, revision_rollback_success, evidence_completeness]
  content_health_ops:
    - live_assets
    - pending_review
    - published
    - pending_publish
    - rejected
    - average_review_time_hours
    - average_publish_time_hours
    - revision_rollback_success
    - last_publish
    - last_verify
    - ops_board

asset_lifecycle_enum:
  - draft
  - review
  - approved
  - published
  - live
  - archived

matrix_row_status_enum: [pending, pass, fail]

row_status_enum:
  current_source: [ts_unsplash_fallback, catalog_api, media_platform_cdn]

