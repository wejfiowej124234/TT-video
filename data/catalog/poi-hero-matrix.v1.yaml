  forbidden_bulk: ingest_all_330_on_day_one

phase_1_pilot_discipline:
  advancement: Scope → Country → City → POI
  acceptance_unit: city
  city_status_enum: [NOT_STARTED, ACTIVE, CLOSED]
  ops_hierarchy: [asset_family, country, city, poi]
  full_scope_rows: 330
  wave_1_pilot:
    wave_id: POI-WAVE-1-PILOT
    country_iso: JP
    cities: [东京]
    purpose: Catalog Build → full loop · validate pipeline before Wave 2
  wave_2:
    wave_id: POI-WAVE-2
    country_iso: KR
  wave_3_plus:
    countries: [TH, SG, FR, US, AU, ES, AE, CN]
  forbidden:
    - ingest_all_330_on_day_one
    - skip_pilot_before_wave_2
    - batch_upload_all_countries

phase_1_fixed_workflow:
  - poi_scope_lock
  - catalog_ingest
  - cms_review
  - designer_replace
  - catalog_publish
  - verify
  - evidence
  - matrix_pass

