# CMS Image Inventory · 全站非 OCS 图片运营清单（operational · not governance）
# Pack: node scripts/dev/run-cms-image-inventory-pack.cjs
# 流程：Inventory → current_source → L5 门 → Matrix 排队 → 逐张 Upload→Live（禁止批量 · 禁止回 OCS）

schema: traveltrust.cms_image_inventory.v1
version: 1
effective_utc: "2026-07-05"
machine_key: TT_CMS_IMAGE_INVENTORY
role: operations_inventory
not_governance: true

current_source_enum:
  - catalog
  - catalog_partial
  - unsplash_fallback
  - placeholder
  - old_external
  - official_cold_start

target_source_default: catalog

forbidden:
  - batch_replace_without_l5
  - route_back_to_ocs
  - skip_review
  - skip_verify

asset_type_owners:
  destination_ambient: { owner: CMS, admin_route: /admin/content/landing-ambient, asset_kind: landing_ambient }
  poi_city: { owner: CMS, admin_route: /admin/content/poi-images, asset_kind: poi_hero, scope: city_poi_attraction }
  poi_food: { owner: CMS, admin_route: /admin/content/poi-images, asset_kind: poi_hero, scope: food_poi }
  hotel: { owner: CMS, admin_route: /admin/content/hotel-tiers, asset_kind: hotel_tier_stock }
  transport: { owner: CMS, admin_route: /admin/content/transport, asset_kind: transport_stock }
  brand_video: { owner: Media, note: media_platform_later }
  campaign_banner: { owner: Public Ops, note: schedule_public_ops_visuals_case_by_case }

l5_manual_checks:
  - country_correct
  - city_correct
  - copy_correct
  - scene_correct
  - image_quality
  - no_watermark_logo_copyright_risk
  - not_old_unsplash_pexels_external
  - not_placeholder
  - page_renders_catalog_not_fallback

correct_flow:
  - full_site_cms_image_inventory
  - mark_current_source
  - l5_gate
  - non_compliant_enter_asset_matrix
  - upload
  - review
  - publish
  - verify
  - evidence
  - live

pack_script: scripts/dev/run-cms-image-inventory-pack.cjs
latest_evidence: evidence/GO_cms_operation/CMS-IMAGE-INVENTORY-LATEST.json
asset_matrix_ssot: data/catalog/cms-asset-matrix.v1.yaml
destination_ambient_matrix: data/catalog/destination-ambient-matrix.v1.yaml

