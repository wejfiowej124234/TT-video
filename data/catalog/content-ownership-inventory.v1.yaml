# Content Ownership Inventory · 全站只读盘点（非治理）
# Policy: docs/runbook/TT-CONTENT-OWNERSHIP-POLICY.md
# PER 入口: Business Closed Loop → Inventory → P0 → Evidence → Sign-off
# CMS 入口: Wave → Inventory owner + modify_entry

schema: traveltrust.content_ownership_inventory.v2
version: 2
effective_utc: "2026-07-05"
inventory_type: read_only
not_governance: true

execution_links:
  per_business_closed_loop:
    flow: [inventory, p0_pages, evidence, signoff]
    criticality_order: [P0, P1, P2]
  cms_operation:
    flow: [inventory, owner, modify_entry, publish, verify, evidence, health_score]
  production_go:
    requires: [per_signoff, cms_ops_maturity]

ownership_planes: [OCS, CMS, PUBLIC_OPS, MEDIA_PLATFORM, API, RUNTIME, LOCALES, STATIC_TS, CSS_UI]

check_dimensions:
  - business_domain
  - image_owner
  - copy_owner
  - data_owner
  - modify_entry
  - current_status
  - business_criticality

current_status_enum:
  - live
  - draft
  - frozen
  - not_started
  - ops_maintenance
  - redirect

business_criticality_enum: [P0, P1, P2]

completion_criterion: >-
  Every entry answers: owner, modify_entry, current_status, business_criticality.

