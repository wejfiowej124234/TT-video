  visual_l5:
    label: Visual L5（Hero Quality · Ken Burns 全屏）
    phase: "② Staging"
    status: CLOSED
    note: 10/10 da-hero-* @ 3840×2160 · Verify PASS · Runtime Audit PASS

asset_family_split:
  ocs_card:
    purpose: OCS 6 格 · Listing · Feed · Guide Card
    dimensions: 640×480
    forbidden_for: [landing_hero, ken_burns_backdrop]
  destination_ambient_hero:
    purpose: Landing Hero · Ken Burns · 全屏 object-cover
    dimensions_recommended: 3840×2160
    dimensions_minimum: 1920×1080
    aspect_ratio: "16:9"
    filename_convention: da-hero-{country_iso_lower}-home-v{N}.jpg
    storage_planned: data/catalog/media/destination-ambient-hero/

hero_render_context:
  consumer: LandingHomeAmbientBackdrop
  route: /
  effects:
    - fixed inset-0 full viewport
    - inner canvas 124% × 124% offset -12%
    - ken_burns scale 1.0 → 1.2 translate -4% -3%
    - object-cover object-center
  effective_scale_note: >-
    动效峰值约 视口宽 × 1.49 · 1080p 需源图宽 ≥2860px · 4K 需 ≥5710px；
    故推荐 3840×2160，最低 1920×1080（大屏可能略软）。

composition_requirements:
  aspect_ratio: "16:9"
  subject_placement: 地标主体落在画面中心水平带（左右各留 ≥12% 裁切安全区）
  vertical_safe_zone: 上下各留 ≥15%（Ken Burns + object-cover 会裁边）
  ui_readability: 中下区域留给 Landing 玻璃表单 · 避免高亮天空占满下 1/3
  sky: 中低明度 · 避免灰雾低对比 · 与 bg-experience-landing-vignette 协调
  forbidden: [OCS 640 图 upscale, 竖图, 图内大段文字/水印, 与 OCS 6 格同构图]
  brand: 暖色旅行纪实 · 与 cms-content-brief brand_visual 同源

verify_tiers_spec:
  description: Verify/Runtime 阈值 · scripts/dev/lib/cms-destination-ambient-hero.cjs + run-cms-content-l5-destination-ambient-verify.cjs --hero-matrix-id
  decode_required: true
  aspect_ratio_tolerance: "16:9 ±2%"
  bytes_min: 16384
  tiers:
    PASS:
      min_width_px: 3840
      min_height_px: 2160
      label: Hero Recommended
    WARN:
      min_width_px: 1920
      min_height_px: 1080
      label: Hero Minimum · 1080p 可接受 · 2K/4K 可能略软
    FAIL:
      below: WARN
      label: 含 640×480 OCS 卡片 · 禁止作 Landing Hero

