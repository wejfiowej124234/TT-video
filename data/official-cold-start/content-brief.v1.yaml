# OCS Content L5 · 10 城 × 6 Slot Content Brief
# 唯一内容 SSOT（Content Supply · 非 Official Ops 控制面）
# Phase: Phase② OCS Content L5 · Content Engineering
# 技术 SSOT 不变: dataset.v1.json · assets.v1.json · 文件名不可改（仅替换 media/ 二进制）
# Human: docs/runbook/TT-OCS-CONTENT-L5.md

schema: traveltrust.ocs_content_brief.v1
version: 1
effective_utc: "2026-07-04"
machine_key: TT_OCS_CONTENT_L5_CONTENT_BRIEF

status: ACTIVE
replacement_policy: >-
  仅替换 data/official-cold-start/media/{filename} 二进制；
  文案微调仅允许同 chain 内 dataset.v1.json 字段；
  禁止改 API/DB schema、禁止改 assets 文件名、禁止第二套媒体 URL。

global_rules:
  manifest_first: >-
    任何官方图片、文案、标签、城市信息变更：先更新本 Brief → 同步 Production Matrix 行 →
    再改 dataset.v1.json 与 media/ 二进制；禁止绕过 Content SSOT 直接换线上资源。
  content_authenticity_g9: >-
    每张图须符合城市、场景、业务角色；禁止地理/角色错误、AI 明显失真、版权风险、品牌冲突。
  content_diversity_g10: >-
    同 chain 6 Slot 须覆盖不同场景类型（地标/街景/体验/产品/人物等）；禁止仅换角度或色调重复。
  no_duplicate_across_slots: >-
    同一 chain 的 6 张图必须不同构图/场景；禁止同色块、禁止同一张图缩放复用、禁止跨 chain 复用。
  no_duplicate_across_chains: >-
    10 城之间禁止复用同一摄影素材（含裁剪/滤镜变体）。
  copy_image_lock: >-
    画面须与 copy_mapping 所列 manifest 文案同城、同主题；禁止巴黎文案配东京图。
  brand_visual:
    palette: 暖色旅行纪实 · 与 TravelTrust L5 深壳 + ref-sun Accent 协调
    avoid: [纯色素块,  stock watermark,  unrelated landmark,  oversaturated HDR]
    prefer: [natural light,  readable subject,  4:5 or 3:4 crop-safe center]
  technical:
    min_width_px: 640
    min_height_px: 480
    format: JPEG
    aspect_safe: center-weighted for masonry crop
  wcag_visual:
    contrast_subject: 主体与背景可区分；避免大面积低对比雾面
    no_text_in_image: 图片内禁止嵌入大段文字（文案由 UI 渲染）
  campaign_inheritance: >-
    Campaign/Home Hero 不新增第 7 文件；引用 item_refs 对应 slot 封面，须满足该 slot brief 且 Hero 优先选 official-guide-cover 或 provider-cover 宽幅构图。

slots:
  guide-avatar:
    surface: [market_guides, guide_catalog, community_profile]
    composition: 1:1 肖像 · 肩部以上 · 面向镜头 · 专业向导气质
  provider-cover:
    surface: [market_provider, market_feed]
    composition: 4:5 竖构图 · 服务场景/产品场景 · 商家橱窗感
  acquisition-cover:
    surface: [market_acquisition, market_feed]
    composition: 4:5 · 悬赏标的/商品/包装 · 非风景主图
  official-guide-cover:
    surface: [official_guide, community_official, home_hero, destination_hub]
    composition: 16:9 或 3:4 宽幅路线感 · 地标序列/一日路线封面
  community-cover:
    surface: [community_feed, community_featured]
    composition: 4:5 瀑布流缩略 · 生活化瞬间 · 与 community-media 不同场景
  community-media:
    surface: [community_feed_detail, community_post_body]
    composition: 4:5 详情主图 · 更深叙事场景 · 与 community-cover 不同机位/时段

