# tt-web-staging · Fly.io（build context = frontend/ · 路径相对本文件）
# 部署：bash scripts/dev/deploy-tt-web-staging.sh
# SSOT 副本：deploy/fly/tt-web-staging/

app = 'tt-web-staging'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.fly-staging'
  context = '.'

[env]
  PORT = '8080'
  TRAVELTRUST_API_BASE_URL = 'https://tt-api-staging.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
