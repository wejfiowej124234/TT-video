services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: traveltrust-community-minio-evidence
    ports:
      - "19000:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # Community MinIO: per-bucket CORS API is unavailable; use global API CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sleep 4
        mc alias set local http://minio:9000 minio minio12345
        mc mb local/traveltrust-community-evidence --ignore-existing
        mc anonymous set download local/traveltrust-community-evidence
        echo minio-init-ok
