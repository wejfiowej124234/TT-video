# TravelTrust Web3 System Master Map · Machine SSOT
#
# Human companion: docs/runbook/WEB3-SYSTEM-MASTER-MAP-V1.md
# Parity probe:   node scripts/dev/check-web3-system-master-map-parity.cjs
#
# Chain: Master Map → Registry addresses → contract sources → prod /meta → Evidence

schema: traveltrust.web3_system_master_map.v1
version: 1
effective_utc: "2026-07-08"
production_scope: PRODUCTION_SCOPE_SEPOLIA
chain_id: "11155111"

human_doc: docs/runbook/WEB3-SYSTEM-MASTER-MAP-V1.md
deploy_registry: registry/protocol-convergence-deployments.v1.yaml
deploy_baseline: gov_freeze_v2_clean_baseline
fundstack_env: sepolia
g24_registry: registry/g24-p-upgrade-01-contract-posture.v1.yaml
ttg_cert_registry: registry/ttg-governance-cert-gates.v1.yaml
prod_meta_probe: scripts/dev/check-web3-system-production-meta-contracts.cjs

status_enum:
  - PASS
  - IN_PROGRESS
  - PARTIAL
  - TARGET
  - DEFER
  - BLOCKED

deployment_wave_enum:
  - wave1
  - wave2
  - wave3

deploy_phase_enum:
  - local
  - sepolia
  - prod_runtime
  - mainnet

upgrade_type_enum:
  - proxy
  - controller
  - immutable_instance
  - parameter
  - target

accounting_track_enum:
  - orthogonal
  - R1_ttg
  - R2_country_pool
  - R3_escrow
  - R4_platform_fee
  - D4555_A_platform_fee_country_bucket
  - D4555_B_net_profit_split

# Wave definitions (③ Production ops · ② contracts already broadcast)
deployment_waves:
  wave1:
    title: Core business — Escrow · USDC · FeeRouter · Governance runtime · Indexer
    exit_gate: TT_WEB3_PAYMENT_PRODUCTION_READY
  wave2:
    title: Governance extension · Steward · CountryPool distribution · Cert · RBAC
    exit_gate: TT_WEB3_SYSTEM_PRODUCTION_READY
  wave3:
    title: Advanced — SlashRouter · DR · External audit · Mainnet
    exit_gate: TT_PRODUCTION_GO

