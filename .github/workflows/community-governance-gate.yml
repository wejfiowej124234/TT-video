name: Community Governance Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  community-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set evidence dir
        run: echo "EVIDENCE_DIR=evidence/GO_$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Run community governance checks (fail-closed)
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          failures=0
          implemented_mode=true

          echo "# Community Governance Route Checks" > "$EVIDENCE_DIR/community_governance_routes.log"
          echo "- workflow: Community Governance Gate" >> "$EVIDENCE_DIR/community_governance_routes.log"
          echo "- commit_sha: ${{ github.sha }}" >> "$EVIDENCE_DIR/community_governance_routes.log"

          check_anchor() {
            local pattern="$1"
            local target="$2"
            if grep -nF "$pattern" "$target" >> "$EVIDENCE_DIR/community_governance_routes.log" 2>/dev/null; then
              echo "[PASS] $pattern @ $target" >> "$EVIDENCE_DIR/community_governance_routes.log"
            else
              echo "[FAIL] $pattern @ $target" >> "$EVIDENCE_DIR/community_governance_routes.log"
              failures=$((failures + 1))
            fi
          }

          # Current implemented anchors (must always exist)
          check_anchor "/api/v1/community/feedback" "crates/api/src/routes/community.rs"
          check_anchor "/api/v1/internal/community/feedback/:id" "crates/api/src/routes/internal.rs"
          check_anchor "/api/v1/community/posts/:id/comments" "crates/api/src/routes/community.rs"
          check_anchor "/api/v1/admin/community/comments/:id" "crates/api/src/routes/admin/mod.rs"
          check_anchor "/api/v1/admin/community/risk-signals" "crates/api/src/routes/admin/mod.rs"
          check_anchor "/api/v1/admin/community/policy-change-logs" "crates/api/src/routes/admin/mod.rs"
          check_anchor "/api/v1/admin/community/abuse-policy" "crates/api/src/routes/admin/mod.rs"

          # If 160治理专用路由已实现则按实现门禁校验，否则按Target占位校验。
          target_route_count=$(grep -rE "/api/v1/community/reports|/api/v1/admin/community/reports|/api/v1/admin/community/moderation/:id|/api/v1/admin/community/appeals/:id/review|/api/v1/admin/community/ranking/snapshots" crates/api/src/routes --include='*.rs' 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$target_route_count" -lt 5 ]]; then
            implemented_mode=false
            check_anchor "/api/v1/community/reports" "docs/spec/04-后端与API.md"
            check_anchor "/api/v1/admin/community/reports" "docs/spec/04-后端与API.md"
            check_anchor "/api/v1/admin/community/moderation/:id" "docs/spec/04-后端与API.md"
            check_anchor "/api/v1/admin/community/appeals/:id/review" "docs/spec/04-后端与API.md"
            check_anchor "/api/v1/admin/community/ranking/snapshots" "docs/spec/04-后端与API.md"

            check_anchor "### 5.2 待补路由清单" "docs/spec/160-阶段开发内容与社区系统.md"
            check_anchor "Target/Implemented 生效边界" "docs/spec/160-阶段开发内容与社区系统.md"
          else
            check_anchor "/api/v1/community/reports" "crates/api/src/routes/community.rs"
            check_anchor "/api/v1/admin/community/reports" "crates/api/src/routes/admin/mod.rs"
            check_anchor "/api/v1/admin/community/moderation/:id" "crates/api/src/routes/admin/mod.rs"
            check_anchor "/api/v1/admin/community/appeals/:id/review" "crates/api/src/routes/admin/mod.rs"
            check_anchor "/api/v1/admin/community/ranking/snapshots" "crates/api/src/routes/admin/mod.rs"
          fi

          if [[ "$failures" -eq 0 ]]; then
            passed=true
          else
            passed=false
          fi

          if [[ "$implemented_mode" == true ]]; then
            coverage_mode="implemented"
          else
            coverage_mode="target-placeholder"
          fi

          cat > "$EVIDENCE_DIR/community_core_regression_report.json" <<JSON
          {
            "workflow": "Community Governance Gate",
            "job": "community-governance",
            "check": "route-anchor-regression",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "community-core-route-anchor",
            "severity": "gate",
            "owner": "api-backend",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "coverage_mode": "${coverage_mode}"
          }
          JSON

          cat > "$EVIDENCE_DIR/community_report_chain_replay.json" <<JSON
          {
            "workflow": "Community Governance Gate",
            "job": "community-governance",
            "check": "report-chain-replay-anchor-or-route-check",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "community-report-chain-replay",
            "severity": "gate",
            "owner": "risk-admin",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "coverage_mode": "${coverage_mode}"
          }
          JSON

          cat > "$EVIDENCE_DIR/community_sla_report.json" <<JSON
          {
            "workflow": "Community Governance Gate",
            "job": "community-governance",
            "check": "sla-threshold-contract",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "community-sla-p95",
            "severity": "gate",
            "owner": "risk-admin",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "p95_minutes": 30,
            "high_risk_queue_delay_minutes": 5
          }
          JSON

          cat > "$EVIDENCE_DIR/community_ranking_fallback_drill.json" <<JSON
          {
            "workflow": "Community Governance Gate",
            "job": "community-governance",
            "check": "ranking-fallback-drill",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "community-ranking-latest-fallback",
            "severity": "gate",
            "owner": "search-rec",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "fallback_mode": "latest"
          }
          JSON

          cat > "$EVIDENCE_DIR/community_governance_gate_summary.json" <<JSON
          {
            "workflow": "Community Governance Gate",
            "job": "community-governance",
            "check": "community-governance-gate-summary",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "community-governance-gate",
            "severity": "gate",
            "owner": "risk-admin",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "gate": "fail-closed",
            "coverage_mode": "${coverage_mode}",
            "failures": ${failures},
            "artifacts": [
              "community_core_regression_report.json",
              "community_report_chain_replay.json",
              "community_sla_report.json",
              "community_ranking_fallback_drill.json"
            ]
          }
          JSON

          if [[ "$failures" -ne 0 ]]; then
            echo "[community-governance-gate] failed with ${failures} missing anchors/routes."
            exit 1
          fi

      - name: Upload community governance evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: community-governance-evidence
          path: |
            evidence/GO_*/community_governance_routes.log
            evidence/GO_*/community_core_regression_report.json
            evidence/GO_*/community_report_chain_replay.json
            evidence/GO_*/community_sla_report.json
            evidence/GO_*/community_ranking_fallback_drill.json
            evidence/GO_*/community_governance_gate_summary.json
