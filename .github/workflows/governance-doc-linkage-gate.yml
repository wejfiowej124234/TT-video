# 82 / governance-token 与索引、总表、串联、07 §二 2.4 的静态联动校验（fail-closed）
# Step 1：须与本地 `bash scripts/check-governance-doc-linkage.sh`（Windows：`.\scripts\check-governance-doc-linkage.ps1`）同源 — 见 CONTRIBUTING、docs/spec/84 文首「机器校验」、scripts/README §二。
name: Governance doc linkage gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run governance doc linkage script
        run: bash scripts/check-governance-doc-linkage.sh
      - name: Run 07 version triple check (header / 00 index / §6.5 top)
        run: bash scripts/check-07-version-triple.sh
