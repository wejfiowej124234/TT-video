# TT-L4-PARALLEL-CI-001：Sepolia L4 在 CI + Next `start` 下以 workers=2 做并行观测。
# 不替代默认单 worker 门禁；未配置 L4_CI_DOTENV_B64 时整 job 跳过。
name: L4 parallel CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: l4-parallel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l4-sepolia-workers-2:
    # ASCII job name：避免中间点 `·` 在部分 runner 上导致日志/步骤元数据异常（仅 system.txt、无 step 日志）。
    name: L4 Sepolia (start, workers=2)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traveltrust
          POSTGRES_PASSWORD: traveltrust
          POSTGRES_DB: traveltrust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traveltrust -d traveltrust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      PLAYWRIGHT_FULL_STACK: "1"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3012"
      PLAYWRIGHT_API_PORT: "8080"
      PLAYWRIGHT_EXPECT_CHAIN_ID: "11155111"
      PLAYWRIGHT_WORKERS: "2"
      PORT: "3012"
      FRONTEND_PORT: "3012"
      TRAVELTRUST_FRONTEND_PORT: "3012"
      NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8080"
      TRAVELTRUST_BUILD_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      # secrets 不可用于 job-level if（workflow_dispatch 解析失败）；未配置时此处短路为绿跳过。
      - name: Gate (skip when L4_CI_DOTENV_B64 unset)
        id: l4_gate
        run: |
          if [ -z "${{ secrets.L4_CI_DOTENV_B64 }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.l4_gate.outputs.run == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # SSOT: runbook TT-L4-CHROMIUM-SEPOLIA-E2E-BASELINE-001 / TT-L4-PARALLEL-CI-001 — `cd frontend && npm run e2e:sepolia`.
      - name: Assert L4 e2e:sepolia script contract
        if: steps.l4_gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("frontend/package.json", "utf8"));
          const cmd = (pkg.scripts && pkg.scripts["e2e:sepolia"]) || "";
          if (!cmd.includes("run-e2e-sepolia.mjs")) {
            console.error(
              'L4 contract: frontend/package.json must define scripts["e2e:sepolia"] pointing at ./scripts/run-e2e-sepolia.mjs (see docs/runbook/TT-L4-CHROMIUM-SEPOLIA-E2E-BASELINE-001.md).'
            );
            process.exit(1);
          }
          if (!fs.existsSync("frontend/scripts/run-e2e-sepolia.mjs")) {
            console.error("L4 contract: missing frontend/scripts/run-e2e-sepolia.mjs");
            process.exit(1);
          }
          NODE

      - uses: dtolnay/rust-toolchain@master
        if: steps.l4_gate.outputs.run == 'true'
        with:
          toolchain: stable

      - name: Decode L4 CI .env (Sepolia + contracts)
        if: steps.l4_gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "${{ secrets.L4_CI_DOTENV_B64 }}" | base64 -d > "${GITHUB_WORKSPACE}/.env"
          printf '\n# CI service postgres (TT-L4-PARALLEL-CI-001)\nDATABASE_URL=postgres://traveltrust:traveltrust@127.0.0.1:5432/traveltrust\n' >> "${GITHUB_WORKSPACE}/.env"

      - name: Install frontend deps
        if: steps.l4_gate.outputs.run == 'true'
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        if: steps.l4_gate.outputs.run == 'true'
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Build frontend (production)
        if: steps.l4_gate.outputs.run == 'true'
        run: cd frontend && npm run build

      - name: Build traveltrust-api
        if: steps.l4_gate.outputs.run == 'true'
        run: cargo build -p traveltrust-api

      - name: Run L4 Sepolia (e2e:sepolia, workers=2)
        if: steps.l4_gate.outputs.run == 'true'
        env:
          SKIP_API_BUILD: "1"
        run: |
          set -euo pipefail
          unset PLAYWRIGHT_L4_FILE_PARALLEL PLAYWRIGHT_L4_FULL_PARALLEL PLAYWRIGHT_PARALLEL || true
          export PLAYWRIGHT_WORKERS=2
          cd frontend && npm run e2e:sepolia

      - name: Upload Playwright report (on failure)
        if: failure() && steps.l4_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: l4-parallel-ci-playwright-report
          path: frontend/playwright-report/
          retention-days: 7
