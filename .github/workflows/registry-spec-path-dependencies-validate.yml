# Lightweight structural check for registry/spec-path-dependencies.v1.yaml
# (orthogonal to build.yml). Current policy: acceptance is LOCAL — run before commit:
#   python registry/validate-spec-path-dependencies-registry.py
#   bash scripts/check-handbook-frontmatter.sh
#   bash scripts/check-handbook-engineering-content.sh
# This workflow is OPTIONAL for when GitHub CI is available again; it is NOT a required
# PR green check while CI is unavailable. Policy refs: CONTRIBUTING, registry/README,
# docs/spec-path-dependency-migration-inventory.md — sync inventory + YAML; do not
# migrate/delete spec via this track unless separately scoped; do not change default
# build.yml required jobs. paths-filter includes inventory + check-ci-exemption.sh so
# edits to those sync surfaces can optionally re-run the same validator in CI.
name: Registry spec-path dependencies validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/spec-path-dependency-migration-inventory.md'
      - 'registry/spec-path-dependencies*.yaml'
      - 'registry/validate-spec-path-dependencies-registry.py'
      - 'scripts/gates/check-ci-exemption.sh'
      - '.github/workflows/registry-spec-path-dependencies-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/spec-path-dependency-migration-inventory.md'
      - 'registry/spec-path-dependencies*.yaml'
      - 'registry/validate-spec-path-dependencies-registry.py'
      - 'scripts/gates/check-ci-exemption.sh'
      - '.github/workflows/registry-spec-path-dependencies-validate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate registry YAML structure
        run: python3 registry/validate-spec-path-dependencies-registry.py
