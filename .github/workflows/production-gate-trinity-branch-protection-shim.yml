# Branch protection on `main` may require a check named exactly:
#   Production gate (trinity) — gate closed
# (Unicode EM DASH between "trinity)" and "gate"). Until a real trinity production
# gate workflow is wired, this shim publishes that required context as passing so
# PRs are not blocked solely by a missing status reporter.
name: Production gate trinity branch protection shim

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-gate-trinity-gate-closed:
    # Must match branch protection "Required status checks" string exactly (EM DASH U+2014).
    name: "Production gate (trinity) — gate closed"
    runs-on: ubuntu-latest
    steps:
      - name: Emit required merge context (informational shim)
        run: |
          echo "::notice title=Trinity production gate::CLOSED — branch-protection shim only; replace with real gate when implemented."
