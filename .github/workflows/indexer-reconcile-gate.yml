name: Indexer Reconcile Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  indexer-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set evidence dir
        run: echo "EVIDENCE_DIR=evidence/GO_$(date +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Self-test Ed25519 reconcile export verify script
        run: bash scripts/verify-reconcile-export-ed25519.sh --self-test
      - name: Verify indexer/reconcile route anchors
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          failures=0
          checks_total=106
          checks_passed=0

          check_anchor() {
            local metric="$1"
            local pattern="$2"
            local target="$3"
            if rg -n "$pattern" "$target" >> "$EVIDENCE_DIR/indexer_replay.log" 2>/dev/null; then
              echo "[PASS] ${metric} @ ${target}" >> "$EVIDENCE_DIR/indexer_replay.log"
              checks_passed=$((checks_passed + 1))
            else
              echo "[FAIL] ${metric} @ ${target}" >> "$EVIDENCE_DIR/indexer_replay.log"
              failures=$((failures + 1))
            fi
          }

          echo "# Indexer Reconcile Checks" > "$EVIDENCE_DIR/indexer_replay.log"
          echo "- workflow: Indexer Reconcile Gate" >> "$EVIDENCE_DIR/indexer_replay.log"
          echo "- commit_sha: ${{ github.sha }}" >> "$EVIDENCE_DIR/indexer_replay.log"

          check_anchor "internal_indexer_replay_route" "/api/v1/internal/indexer-replay" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reorg_rewind_route" "/api/v1/internal/indexer-reorg-rewind" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_route" "/api/v1/internal/indexer-reconcile" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_root_fields" "projection_reconcile_clean" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_chain_scope_dry_run_anchor" "110-ORDERS-CHAIN-SCOPE-DRY-RUN" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_chain_scope_execute_anchor" "110-ORDERS-CHAIN-SCOPE-EXECUTE" "crates/api/src/routes/internal.rs"
          check_anchor "env_traveltrust_allow_orders_chain_scope_rollback" "TRAVELTRUST_ALLOW_ORDERS_CHAIN_SCOPE_ROLLBACK" ".env.example"
          check_anchor "env_traveltrust_allow_event_log_chain_scope_rollback" "TRAVELTRUST_ALLOW_EVENT_LOG_CHAIN_SCOPE_ROLLBACK" ".env.example"
          check_anchor "env_traveltrust_allow_correction_executor_chain_scope_rollback" "TRAVELTRUST_ALLOW_CORRECTION_EXECUTOR_CHAIN_SCOPE_ROLLBACK" ".env.example"
          check_anchor "env_traveltrust_allow_indexer_memory_sync_from_db" "TRAVELTRUST_ALLOW_INDEXER_MEMORY_SYNC_FROM_DB" ".env.example"
          check_anchor "internal_indexer_reconcile_memory_sync_anchor" "110-INDEXER-MEMORY-SYNC-FROM-DB" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_body_sync_memory" "sync_indexer_memory_from_db_checkpoint" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_body_include_chain_tip" "include_chain_tip" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_chain_observation_anchor" "110-RECONCILE-CHAIN-TIP" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_rpc_escrow_sample_meta_anchor" "110-RPC-ESCROW-SAMPLE-META" "crates/api/src/routes/internal.rs"
          check_anchor "internal_indexer_reconcile_event_log_escrow_coverage_anchor" "110-EVENT-LOG-ESCROW-COVERAGE" "crates/api/src/routes/internal.rs"
