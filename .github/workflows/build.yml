# 仓库构建与门禁：check-invariants（含 Node 锁策略）→ Rust 构建与测试 → 依赖审计（可选不阻塞）
# 见 08-5、README 实现状态。若默认分支非 main，请将下方 branches 改为实际默认分支（如 master）
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - name: Check invariants
        run: bash ./scripts/check-invariants.sh
      - name: Build workspace
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace
      - name: Audit dependencies (optional, does not block)
        run: bash ./scripts/audit-deps.sh
        continue-on-error: true
