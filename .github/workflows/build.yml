  # Runs after all parallel jobs finish; prints baseline + triage template when any needed job failed.
  # `always()` is required so this job is not skipped when a sibling `needs` job fails (default skip rule).
  ci-triage-hint:
    name: CI triage hint (baseline)
    runs-on: ubuntu-latest
    if: ${{ always() && failure() }}
    needs:
      - build
      - frontend
      - regional-matrix
      - a11y
      - e2e
      - finance-reconcile
      - config-center
      - feature-flag
      - job-queue
      - secret-key
    steps:
      - uses: actions/checkout@v6
      - name: CI triage hint
        run: bash scripts/ci-triage.sh

  # Informational release hint: does not affect workflow success/failure.
  go-no-go-hint:
    name: GO/NO-GO hint (informational)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - frontend
      - regional-matrix
      - a11y
      - e2e
      - finance-reconcile
      - config-center
      - feature-flag
      - job-queue
      - secret-key
    steps:
      - uses: actions/checkout@v6
      - name: Download e2e playwright outcome (if any)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-playwright-outcome
          path: e2e-out
      - name: GO/NO-GO hint
        env:
          E2E_PLAYWRIGHT_OUTCOME: ${{ needs.e2e.outputs.playwright_outcome }}
          E2E_OUTCOME_FILE: e2e-out/e2e-playwright-outcome.txt
          JOB_BUILD: ${{ needs.build.result }}
          JOB_FRONTEND: ${{ needs.frontend.result }}
          JOB_REGIONAL_MATRIX: ${{ needs.regional-matrix.result }}
          JOB_A11Y: ${{ needs.a11y.result }}
          JOB_E2E: ${{ needs.e2e.result }}
          JOB_FINANCE_RECONCILE: ${{ needs.finance-reconcile.result }}
          JOB_CONFIG_CENTER: ${{ needs.config-center.result }}
          JOB_FEATURE_FLAG: ${{ needs.feature-flag.result }}
          JOB_JOB_QUEUE: ${{ needs.job-queue.result }}
          JOB_SECRET_KEY: ${{ needs.secret-key.result }}
        run: bash scripts/check-go-no-go.sh
