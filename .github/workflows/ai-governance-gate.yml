name: AI Governance Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set evidence dir
        run: echo "EVIDENCE_DIR=evidence/GO_$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Run AI governance checks (fail-closed)
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          failures=0
          implemented_mode=true

          itinerary_checks_total=3
          itinerary_checks_passed=0
          schema_checks_total=3
          schema_checks_passed=0
          traceability_checks_total=5
          traceability_checks_passed=0
          audit_field_checks_total=0
          audit_field_checks_passed=0

          echo "# AI Governance Checks" > "$EVIDENCE_DIR/ai_governance_routes.log"
          echo "- workflow: AI Governance Gate" >> "$EVIDENCE_DIR/ai_governance_routes.log"
          echo "- commit_sha: ${{ github.sha }}" >> "$EVIDENCE_DIR/ai_governance_routes.log"

          check_anchor() {
            local pattern="$1"
            local target="$2"
            if rg -n "$pattern" "$target" >> "$EVIDENCE_DIR/ai_governance_routes.log" 2>/dev/null; then
              echo "[PASS] $pattern @ $target" >> "$EVIDENCE_DIR/ai_governance_routes.log"
            else
              echo "[FAIL] $pattern @ $target" >> "$EVIDENCE_DIR/ai_governance_routes.log"
              failures=$((failures + 1))
            fi
          }

          check_metric() {
            local metric="$1"
            local pattern="$2"
            local target="$3"
            if rg -n "$pattern" "$target" >> "$EVIDENCE_DIR/ai_governance_routes.log" 2>/dev/null; then
              echo "[METRIC PASS] ${metric} @ ${target}" >> "$EVIDENCE_DIR/ai_governance_routes.log"
              return 0
            fi
            echo "[METRIC FAIL] ${metric} @ ${target}" >> "$EVIDENCE_DIR/ai_governance_routes.log"
            failures=$((failures + 1))
            return 1
          }

          # Implemented anchors that must exist now
          if check_metric "itinerary_route_default" "/api/v1/itineraries" "crates/api/src/routes/itineraries.rs"; then
            itinerary_checks_passed=$((itinerary_checks_passed + 1))
          fi
          if check_metric "itinerary_route_custom" "/api/v1/itineraries/custom" "crates/api/src/routes/itineraries.rs"; then
            itinerary_checks_passed=$((itinerary_checks_passed + 1))
          fi
          if check_metric "observability_overview_route" "/api/v1/admin/observability/overview" "crates/api/src/routes/admin.rs"; then
            itinerary_checks_passed=$((itinerary_checks_passed + 1))
          fi

          # Target governance routes might not be implemented yet; fall back to doc anchors
          target_route_count=$(rg -n "/api/v1/admin/flags|/api/v1/admin/secrets/metadata|/api/v1/admin/internal-tools/audits" crates/api/src/routes -S | wc -l | tr -d ' ')
          if [[ "$target_route_count" -lt 3 ]]; then
            implemented_mode=false
            check_anchor "/api/v1/admin/flags" "docs/spec/04-后端与API.md"
            check_anchor "/api/v1/admin/secrets/metadata" "docs/spec/04-后端与API.md"
            check_anchor "/api/v1/admin/internal-tools/audits" "docs/spec/04-后端与API.md"
            check_anchor "Target 升级为 Implemented 的触发条件" "docs/spec/170-阶段开发AI行程系统运行管理治理层.md"
          else
            check_anchor "/api/v1/admin/flags" "crates/api/src/routes/admin.rs"
            check_anchor "/api/v1/admin/secrets/metadata" "crates/api/src/routes/admin.rs"
            check_anchor "/api/v1/admin/internal-tools/audits" "crates/api/src/routes/admin.rs"
          fi

          # Quantitative schema/traceability baselines for current implementation.
          # Current baseline uses schema_version/snapshot_hash fields already present in code.
          if check_metric "schema_field_present" "schema_version|output_schema_version" "crates/api/src/routes/evidence.rs"; then
            schema_checks_passed=$((schema_checks_passed + 1))
          fi
          if check_metric "snapshot_field_present" "snapshot_hash|output_snapshot_hash" "crates/api/src/routes/evidence.rs"; then
            schema_checks_passed=$((schema_checks_passed + 1))
          fi
          if check_metric "schema_guard_message_present" "JSON Schema|schema" "docs/spec/170-阶段开发AI行程系统运行管理治理层.md"; then
            schema_checks_passed=$((schema_checks_passed + 1))
          fi

          if check_metric "trace_content_hash" "content_hash|request_hash" "crates/api/src/chain_off/evidence.rs"; then
            traceability_checks_passed=$((traceability_checks_passed + 1))
          fi
          if check_metric "trace_snapshot_hash" "snapshot_hash|output_snapshot_hash" "crates/api/src/chain_off/evidence.rs"; then
            traceability_checks_passed=$((traceability_checks_passed + 1))
          fi
          if check_metric "trace_prompt_version" "prompt_version" "crates/api/src/chain_off/evidence.rs"; then
            traceability_checks_passed=$((traceability_checks_passed + 1))
          fi
          if check_metric "trace_schema_version" "schema_version|output_schema_version" "crates/api/src/chain_off/evidence.rs"; then
            traceability_checks_passed=$((traceability_checks_passed + 1))
          fi
          if check_metric "trace_generated_at" "created_at|generated_at" "crates/api/src/chain_off/evidence.rs"; then
            traceability_checks_passed=$((traceability_checks_passed + 1))
          fi

          itinerary_pass_rate=$((itinerary_checks_passed * 100 / itinerary_checks_total))
          schema_pass_rate=$((schema_checks_passed * 100 / schema_checks_total))
          traceability_pass_rate=$((traceability_checks_passed * 100 / traceability_checks_total))

          if [[ "$itinerary_pass_rate" -ne 100 ]]; then
            echo "[FAIL] itinerary availability baseline not 100% (${itinerary_checks_passed}/${itinerary_checks_total})" >> "$EVIDENCE_DIR/ai_governance_routes.log"
            failures=$((failures + 1))
          fi
          if [[ "$schema_pass_rate" -ne 100 ]]; then
            echo "[FAIL] schema baseline not 100% (${schema_checks_passed}/${schema_checks_total})" >> "$EVIDENCE_DIR/ai_governance_routes.log"
            failures=$((failures + 1))
          fi
          if [[ "$traceability_pass_rate" -ne 100 ]]; then
            echo "[FAIL] traceability baseline not 100% (${traceability_checks_passed}/${traceability_checks_total})" >> "$EVIDENCE_DIR/ai_governance_routes.log"
            failures=$((failures + 1))
          fi

          if [[ "$failures" -eq 0 ]]; then
            passed=true
          else
            passed=false
          fi

          if [[ "$implemented_mode" == true ]]; then
            coverage_mode="implemented"
          else
            coverage_mode="target-placeholder"
          fi

          cat > "$EVIDENCE_DIR/ai_generation_contract_report.json" <<JSON
          {
            "workflow": "AI Governance Gate",
            "job": "ai-governance",
            "check": "itinerary-contract-regression",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "ai-generation-contract",
            "severity": "gate",
            "owner": "api-backend",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "coverage_mode": "${coverage_mode}"
          }
          JSON

          cat > "$EVIDENCE_DIR/ai_schema_validation_report.json" <<JSON
          {
            "workflow": "AI Governance Gate",
            "job": "ai-governance",
            "check": "schema-validation-anchor",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "ai-schema-validation",
            "severity": "gate",
            "owner": "api-backend",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed}
          }
          JSON

          cat > "$EVIDENCE_DIR/ai_traceability_sampling_report.json" <<JSON
          {
            "workflow": "AI Governance Gate",
            "job": "ai-governance",
            "check": "traceability-anchor",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "ai-traceability-sampling",
            "severity": "gate",
            "owner": "ai-governance",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed}
          }
          JSON

          cat > "$EVIDENCE_DIR/ai_governance_audit_report.json" <<JSON
          {
            "workflow": "AI Governance Gate",
            "job": "ai-governance",
            "check": "governance-audit-anchor",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "ai-governance-audit",
            "severity": "gate",
            "owner": "ai-governance",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed}
          }
          JSON

          cat > "$EVIDENCE_DIR/ai_governance_gate_summary.json" <<JSON
          {
            "workflow": "AI Governance Gate",
            "job": "ai-governance",
            "check": "ai-governance-gate-summary",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "ai-governance-gate",
            "severity": "gate",
            "owner": "ai-governance",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": ${passed},
            "gate": "fail-closed",
            "coverage_mode": "${coverage_mode}",
            "metrics": {
              "itinerary_checks": {"passed": ${itinerary_checks_passed}, "total": ${itinerary_checks_total}, "pass_rate": ${itinerary_pass_rate}},
              "schema_checks": {"passed": ${schema_checks_passed}, "total": ${schema_checks_total}, "pass_rate": ${schema_pass_rate}},
              "traceability_checks": {"passed": ${traceability_checks_passed}, "total": ${traceability_checks_total}, "pass_rate": ${traceability_pass_rate}}
            },
            "failures": ${failures}
          }
          JSON

          required_fields='"workflow" "job" "check" "commit_sha" "ci_run_id" "env" "rule_id" "severity" "owner" "generated_at" "passed"'
          reports="ai_generation_contract_report.json ai_schema_validation_report.json ai_traceability_sampling_report.json ai_governance_audit_report.json ai_governance_gate_summary.json"
          for report in $reports; do
            for field in $required_fields; do
              audit_field_checks_total=$((audit_field_checks_total + 1))
              if rg -n "$field" "$EVIDENCE_DIR/$report" >/dev/null 2>&1; then
                audit_field_checks_passed=$((audit_field_checks_passed + 1))
              else
                echo "[FAIL] missing required field ${field} in ${report}" >> "$EVIDENCE_DIR/ai_governance_routes.log"
                failures=$((failures + 1))
              fi
            done
          done

          audit_field_pass_rate=$((audit_field_checks_passed * 100 / audit_field_checks_total))
          if [[ "$audit_field_pass_rate" -ne 100 ]]; then
            echo "[FAIL] evidence required fields baseline not 100% (${audit_field_checks_passed}/${audit_field_checks_total})" >> "$EVIDENCE_DIR/ai_governance_routes.log"
            failures=$((failures + 1))
          fi

          cat > "$EVIDENCE_DIR/ai_governance_gate_metrics.json" <<JSON
          {
            "workflow": "AI Governance Gate",
            "job": "ai-governance",
            "check": "ai-governance-quantitative-metrics",
            "commit_sha": "${{ github.sha }}",
            "ci_run_id": "${{ github.run_id }}",
            "env": "ci",
            "rule_id": "ai-governance-quantitative-baseline",
            "severity": "gate",
            "owner": "ai-governance",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": $([[ "$failures" -eq 0 ]] && echo true || echo false),
            "metrics": {
              "itinerary": {"passed": ${itinerary_checks_passed}, "total": ${itinerary_checks_total}, "pass_rate": ${itinerary_pass_rate}},
              "schema": {"passed": ${schema_checks_passed}, "total": ${schema_checks_total}, "pass_rate": ${schema_pass_rate}},
              "traceability": {"passed": ${traceability_checks_passed}, "total": ${traceability_checks_total}, "pass_rate": ${traceability_pass_rate}},
              "evidence_fields": {"passed": ${audit_field_checks_passed}, "total": ${audit_field_checks_total}, "pass_rate": ${audit_field_pass_rate}}
            }
          }
          JSON

          if [[ "$failures" -ne 0 ]]; then
            echo "[ai-governance-gate] failed with ${failures} missing anchors/routes."
            exit 1
          fi

      - name: Upload AI governance evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-governance-evidence
          path: |
            evidence/GO_*/ai_governance_routes.log
            evidence/GO_*/ai_generation_contract_report.json
            evidence/GO_*/ai_schema_validation_report.json
            evidence/GO_*/ai_traceability_sampling_report.json
            evidence/GO_*/ai_governance_audit_report.json
            evidence/GO_*/ai_governance_gate_summary.json
            evidence/GO_*/ai_governance_gate_metrics.json
