version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # If Node.js tooling is introduced later (package.json), add an npm update block
  # and enforce lockfile policy via scripts/check-node-lock-policy.sh.
