# tt-api-staging · Fly.io（阶段二 ②）
# 部署（仓库根）:
#   fly deploy -c deploy/fly/tt-api-staging/fly.toml --build-arg TRAVELTRUST_BUILD_GIT_SHA=$(git rev-parse HEAD)
# secrets 见 evidence/GO_*/fly-secrets.md（B-12）

app = 'tt-api-staging'
primary_region = 'sin'

[build]
  dockerfile = '../../../Dockerfile'
  context = '../../..'

[env]
  PORT = '8080'
  # GET /meta 治理聚合易超 30s → 408；与 meta-availability-hotfix 同源
  REQUEST_TIMEOUT_SECS = '120'
  TRAVELTRUST_COMPLEXITY_CONVERGENCE_FREEZE = '1'
  # TN-P1-010 · staging indexer backfill（freetier RPC + Fly HTTP 窗）
  INDEXER_ETH_GET_LOGS_MAX_BLOCK_SPAN = '9999'
  INDEXER_TICK_MAX_BLOCKS_PER_SCAN = '9999'
  INDEXER_BOOTSTRAP_FROM_BLOCK = '11045000'
  DATABASE_POOL_MAX_LIFETIME_SECS = '900'
  DATABASE_POOL_IDLE_TIMEOUT_SECS = '300'
  DATABASE_POOL_ACQUIRE_TIMEOUT_SECS = '30'
  DATABASE_PG_TRANSIENT_RETRY_MAX = '3'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
